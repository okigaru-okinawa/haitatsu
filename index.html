<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="配達ルート">
<meta name="theme-color" content="#1f6fb2">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>配達ルート</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#16181d;--sub:#5d6470;--muted:#9aa1ab;--line:#e2e5ea;
  --accent:#1f6fb2;--accent-bg:#e5f0fa;--on-accent:#fff;--warn:#8a5a00;--warn-bg:#fdf1d8;
  --ok:#1e7a44;--ok-bg:#e3f4ea;--danger:#b42318;
  --r:12px;--fs:17px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111317;--card:#1c1f25;--text:#eef0f3;--sub:#a9b0bb;--muted:#6f7682;--line:#2c3038;
  --accent:#5aa2e6;--accent-bg:#17304a;--on-accent:#0b1520;--warn:#f2c46b;--warn-bg:#3a2c0f;
  --ok:#6fd39a;--ok-bg:#12321f;--danger:#ff8a80;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(160px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--sub);font:inherit;font-size:14px;padding:8px 0;border-radius:8px}
.tabs button.on{background:var(--card);color:var(--text);font-weight:600}
main{padding:12px 14px}
h2{font-size:20px;margin:6px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.sub{color:var(--sub);font-size:14px}.muted{color:var(--muted);font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--sub)}
.seg button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
input,textarea{font:inherit;font-size:18px;width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:70px;font-size:16px}
.btn{display:block;width:100%;font:inherit;font-weight:600;padding:15px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-size:19px;padding:17px}
.btn.small{padding:12px 4px;font-size:15px;font-weight:500}
.btn:active{transform:scale(.98)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.cand{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
.cand:last-child{border-bottom:0}
.cand .nm{font-weight:600}
.cand .ad{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.ok{background:var(--ok-bg);color:var(--ok)}
.group-h{font-size:13px;color:var(--sub);margin:12px 2px 4px}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.num{width:28px;height:28px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none}
.num.done{background:var(--ok-bg);color:var(--ok)}
.x{border:0;background:transparent;color:var(--muted);font-size:22px;padding:4px 8px}
.pin{border:1px solid var(--line);background:var(--card);color:var(--sub);font:inherit;font-size:13px;padding:5px 9px;border-radius:999px}
.pin.on{background:var(--warn-bg);color:var(--warn);border-color:transparent;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.stats.two{grid-template-columns:1fr 1fr}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:22px}
.prog{height:8px;background:var(--line);border-radius:4px;margin:6px 0 14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.big-name{font-size:26px;font-weight:700;margin:2px 0;line-height:1.3}
.memo{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:15px}
.prev{font-size:13px;color:var(--ok);background:var(--ok-bg);border-radius:10px;padding:8px 12px;margin-bottom:12px}
#map{height:270px;border-radius:12px;border:1px solid var(--line);margin-bottom:10px;z-index:0;background:var(--line)}
.mk{width:26px;height:26px;border-radius:50%;background:#1f6fb2;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.45)}
.mk.done{background:#8a919c}.mk.cur{background:#d9480f}.mk.dep{background:#16181d}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bar .more{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.bar .more.two{grid-template-columns:1fr 1fr}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.opt{display:block;width:100%;text-align:left;font:inherit;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px}
.opt b{display:block;font-size:17px}.opt span{font-size:13px;color:var(--sub)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{border:1px solid var(--line);background:var(--card);color:var(--sub);font:inherit;font-size:14px;padding:6px 12px;border-radius:999px}
.tag.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top));background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:15px;z-index:30;max-width:90%;text-align:center}
.loading{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:600}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
label.f{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px}
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs">
    <button data-a="tab" data-v="reg">登録</button><button data-a="tab" data-v="go">配達</button><button data-a="tab" data-v="rev">振り返り</button><button data-a="tab" data-v="set">設定</button>
  </div>
</header>
<main id="main"></main>
<div class="bar" id="bar" hidden></div>
<div id="overlay"></div>

<script>
'use strict';
/* =========================================================
   配達ルートアプリ（1ファイル構成）
   データは端末（localStorage）に保存し、スプレッドシートとは Apps Script 経由で裏で同期する
   ========================================================= */
const VERSION = 'v2';
const DWELL_DEFAULT = 6;            // 1件あたりの標準滞在（分）
const AUTO_DONE_METERS = 250;       // アプリに戻った時、この距離以内なら自動で完了
const MAX_WP = 25;                  // Routes API の順番最適化で1回に扱える経由地の上限
const TAG_LIST = ['裏口','右側','左側','駐車しにくい','駐車場あり','昼休みあり','受付に時間がかかる'];
const ROUTE_MASK = 'routes.optimizedIntermediateWaypointIndex,routes.legs.duration,routes.legs.distanceMeters,routes.legs.polyline.encodedPolyline';

/* ---------- 保存 ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const todayStr = () => new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
function newTrip(s){ return { shift:s, stops:[], order:null, legs:null, legBase:0, idx:0, status:'plan', changes:0, startAt:null, endAt:null, predEnd:null, km:null, id:null, navAt:null, pending:null }; }
function newDay(){ return { date: todayStr(), trips: { am: newTrip('am'), pm: newTrip('pm') }, active: null }; }
const S = {
  view: 'reg',
  cfg: LS.get('cfg', { url:'', t:'', depot:null }),
  master: LS.get('master', []),
  day: LS.get('day', null) || newDay(),
  queue: LS.get('queue', []),
  shift: 'am',        // 登録画面で選んでいる便
  q: '',              // 検索文字
  sheet: null,        // 開いているシート
  showAll: false, showMap: false, revDay: 'today'
};
let flushing = false, returning = false, IDX = null, mapObj = null, mapSeq = 0, leaflet = null;
const save = () => { LS.set('day', S.day); LS.set('cfg', S.cfg); };
const saveMaster = () => { IDX = null; LS.set('master', S.master); };
const byId = id => { if (!IDX) IDX = new Map(S.master.map(p => [p.id, p])); return IDX.get(id); };
const goShift = () => S.day.active || ['am','pm'].find(k => ['ready','run'].includes(S.day.trips[k].status)) || S.shift;
const curTrip = () => S.day.trips[goShift()];
const live = t => t.stops.filter(s => s.state !== 'drop');
const shiftName = k => k === 'am' ? '午前' : '午後';

/* 日付が変わったら新しい日にする（前の日は振り返り用に残す） */
function ensureToday(){
  if (S.day.date === todayStr()) return false;
  ['am','pm'].forEach(k => { if (S.day.trips[k].status === 'run') closeTrip(S.day.trips[k], true); });
  if (['am','pm'].some(k => S.day.trips[k].stops.length)) LS.set('prevDay', S.day);
  S.day = newDay(); S.revDay = 'today'; S.sheet = null; save();
  return true;
}

/* ---------- 初回セットアップ（#setup=...） ---------- */
(function(){
  const m = location.hash.match(/setup=([^&]+)/);
  if (!m) return;
  try{
    const o = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    S.cfg.url = o.u; S.cfg.t = o.t; save();
    history.replaceState(null,'',location.pathname);
    setTimeout(()=>toast('設定を読み込みました'),300);
  }catch(e){ setTimeout(()=>toast('設定リンクが読めませんでした'),300); }
})();

/* ---------- 通信（Apps Script） ---------- */
async function api(body){
  if (!S.cfg.url) throw new Error('設定でApps ScriptのURLを入れてください');
  const res = await fetch(S.cfg.url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({...body, t:S.cfg.t}) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '通信エラー');
  return j;
}
async function loadMaster(silent){
  if (!S.cfg.url) return;
  try{
    const res = await fetch(S.cfg.url + '?a=master&t=' + encodeURIComponent(S.cfg.t));
    const j = await res.json();
    if (!j.ok) throw new Error(j.error);
    S.master = j.master; saveMaster(); LS.set('masterAt', Date.now());
    if (!silent) toast('薬局リストを更新しました（' + S.master.length + '件）');
    if (S.view !== 'rev' || !silent) render();
  }catch(e){ if (!silent) toast('薬局リストを取れませんでした: ' + e.message); }
}
/* 記録は裏で送る。送れなかった分は端末に貯めて、次の機会にまとめて送る */
function enqueue(item){ S.queue.push(item); LS.set('queue', S.queue); flush(); }
async function flush(){
  if (flushing || !S.queue.length || !S.cfg.url) return;
  flushing = true;
  try{
    const batch = S.queue.slice(0, 30);
    const logs = batch.filter(x => x.a === 'log');
    if (logs.length) await api({ a:'log', items: logs.map(x => ({sheet:x.sheet, row:x.row})) });
    for (const x of batch.filter(x => x.a !== 'log')) await api(x);
    S.queue = S.queue.slice(batch.length); LS.set('queue', S.queue);
    flushing = false;
    if (S.queue.length) flush();
  }catch(e){ flushing = false; }
}
window.addEventListener('online', flush);

/* ---------- 検索 ---------- */
const kata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const norm = s => kata(String(s||'').normalize('NFKC')).replace(/[\s・\-ー－（）()]/g,'').toLowerCase();
const NORM = new WeakMap();
function keys(p){ let k = NORM.get(p); if (!k){ k = { n:norm(p.name), k:norm(p.kana), a:norm(p.addr), t:String(p.tel||'').replace(/\D/g,'') }; NORM.set(p, k); } return k; }
function searchOne(raw){
  const q = norm(raw).replace(/(薬局|ヤッキョク)$/,'');
  const digits = String(raw||'').normalize('NFKC').replace(/\D/g,'');
  if (!q && digits.length < 4) return [];
  const usage = LS.get('usage', {});
  const res = [];
  for (const p of S.master){
    const k = keys(p);
    let sc = 0;
    if (q){
      if (k.n.startsWith(q) || k.k.startsWith(q)) sc = 100;
      else if (k.n.includes(q) || k.k.includes(q)) sc = 60;
      else if (q.length >= 2 && k.a.includes(q)) sc = 20;
    }
    if (digits.length >= 4 && k.t.includes(digits)) sc = Math.max(sc, 90);
    if (!sc) continue;
    sc += Math.min(40, (usage[p.id]||0) * 8) + Math.min(10, p.visits||0);
    res.push([sc, p]);
  }
  return res.sort((a,b) => b[0]-a[0]).slice(0, 6).map(x => x[1]);
}
/* 「、」や空白で区切って複数まとめて探す（音声入力向け） */
function tokens(q){
  const out = [];
  for (const c of String(q).split(/[、,，。\n]+/).map(x => x.trim()).filter(Boolean)){
    if (searchOne(c).length){ out.push(c); continue; }
    const parts = c.split(/\s+/).flatMap(x => x.replace(/薬局(?=.)/g, '薬局\u0000').split('\u0000')).map(x => x.trim()).filter(Boolean);
    out.push(...(parts.length ? parts : [c]));
  }
  return out;
}
function addStop(id){ addToTrip(S.day.trips[S.shift], id); }
function addToTrip(t, id){
  const other = S.day.trips[t.shift === 'am' ? 'pm' : 'am'];
  const old = t.stops.find(s => s.id === id);
  if ((old && old.state !== 'drop') || other.stops.some(s => s.id === id && s.state !== 'drop')){ toast('登録済みです'); return; }
  const u = LS.get('usage', {}); u[id] = (u[id]||0) + 1; LS.set('usage', u);
  if (old){ old.state = 'todo'; old.added = true; } else t.stops.push({ id, pin:false, state:'todo', added: t.status === 'run' });
  if (t.status === 'run'){ save(); reroute('追加', { ids: t.order.slice(t.idx).concat(id), target:id }); return; }
  if (t.status === 'ready'){ save(); buildRoute(t.shift); return; }
  t.order = null; t.status = 'plan'; save();
}

/* ---------- 距離・時刻・現在地 ---------- */
function meters(a, b){
  const R = 6371000, r = x => x*Math.PI/180;
  const dLat = r(b.lat-a.lat), dLng = r(b.lng-a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const pt = p => (p.plat && p.plng) ? {lat:p.plat, lng:p.plng} : {lat:p.lat, lng:p.lng};
const hm = d => d ? new Date(d).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tokyo'}) : '--:--';
const secs = s => Number(String(s||'0s').replace('s','')) || 0;
const mins = sec => Math.max(1, Math.round(sec/60));
function here(){
  return new Promise((ok, ng) => {
    if (!navigator.geolocation) return ng(new Error('位置情報が使えません'));
    navigator.geolocation.getCurrentPosition(p => ok({lat:p.coords.latitude, lng:p.coords.longitude}),
      () => ng(new Error('現在地が取れません（設定で位置情報を許可してください）')), { enableHighAccuracy:true, timeout:10000, maximumAge:20000 });
  });
}

/* ---------- ルート計算 ---------- */
const wp = p => ({ location:{ latLng:{ latitude:p.lat, longitude:p.lng } } });
async function routeCall(origin, list, dest, optimize){
  const body = {
    origin: wp(origin), destination: wp(dest), intermediates: list.map(wp),
    travelMode:'DRIVE', routingPreference:'TRAFFIC_AWARE',
    routeModifiers:{ avoidHighways:true, avoidTolls:true },
    languageCode:'ja-JP', units:'METRIC'
  };
  if (optimize && list.length > 1) body.optimizeWaypointOrder = true;
  const j = await api({ a:'routes', body, mask: ROUTE_MASK });
  const r = j.data.routes && j.data.routes[0];
  if (!r) throw new Error('ルートが見つかりませんでした');
  let ord = list.map((_,i) => i);
  if (body.optimizeWaypointOrder && r.optimizedIntermediateWaypointIndex) ord = r.optimizedIntermediateWaypointIndex;
  return { ord, legs: r.legs || [] };
}
/* 直線距離での大まかな巡回順（25件を超える時に、近いもの同士で分けるために使う） */
function roughTour(origin, items){
  const left = items.slice(), out = []; let cur = origin;
  while (left.length){
    let bi = 0, bd = Infinity;
    left.forEach((p,i) => { const d = meters(cur, pt(p)); if (d < bd){ bd = d; bi = i; } });
    cur = pt(left[bi]); out.push(left.splice(bi,1)[0]);
  }
  for (let pass = 0; pass < 3; pass++){
    for (let i = 0; i < out.length-1; i++) for (let k = i+1; k < out.length; k++){
      const a = i ? pt(out[i-1]) : origin, b = pt(out[i]), c = pt(out[k]), d = k+1 < out.length ? pt(out[k+1]) : origin;
      if (meters(a,c) + meters(b,d) < meters(a,b) + meters(c,d) - 1) out.splice(i, k-i+1, ...out.slice(i,k+1).reverse());
    }
  }
  return out;
}
/* origin を出て items（[{id,pin}]）を回り dest へ。pin は渡した順のまま先頭に固定する */
async function planRoute(origin, items, dest){
  const ps = items.map(s => ({ s, p: byId(s.id) })).filter(x => x.p && x.p.lat);
  const pinned = ps.filter(x => x.s.pin), free = ps.filter(x => !x.s.pin);
  const seq = [], legs = []; let start = origin;
  if (pinned.length){
    const last = pt(pinned[pinned.length-1].p);
    const r = await routeCall(start, pinned.slice(0,-1).map(x => pt(x.p)), last, false);
    seq.push(...pinned); legs.push(...r.legs); start = last;
  }
  if (free.length <= MAX_WP){
    const r = await routeCall(start, free.map(x => pt(x.p)), dest, true);
    seq.push(...r.ord.map(i => free[i])); legs.push(...r.legs);
  } else {
    const back = new Map(free.map(x => [x.p, x]));
    const tour = roughTour(start, free.map(x => x.p));
    const n = Math.ceil(tour.length / MAX_WP), size = Math.ceil(tour.length / n);
    const groups = []; for (let i = 0; i < tour.length; i += size) groups.push(tour.slice(i, i + size));
    for (let g = 0; g < groups.length; g++){
      const isLast = g === groups.length - 1;
      const r = await routeCall(start, groups[g].map(pt), isLast ? dest : pt(groups[g+1][0]), true);
      const ordered = r.ord.map(i => groups[g][i]);
      seq.push(...ordered.map(p => back.get(p)));
      legs.push(...(isLast ? r.legs : r.legs.slice(0, -1)));   // 次の組への区間は、次の計算で引き直す
      start = pt(ordered[ordered.length-1]);
    }
  }
  return { order: seq.map(x => x.s.id), legs: legs.map(l => ({ sec: secs(l.duration), m: l.distanceMeters || 0, poly: (l.polyline && l.polyline.encodedPolyline) || null })) };
}
const curLeg = (t, i) => (t.legs || [])[i - (t.legBase || 0)];
/* 各配達先の到着予定と、営業所に戻る予定 */
function etas(t){
  const out = [], now = Date.now(); let tm = now;
  for (let i = 0; i < t.order.length; i++){
    if (i < t.idx){ out.push(null); continue; }
    const leg = curLeg(t, i), sec = leg ? leg.sec : 600;
    tm = (i === t.idx && t.navAt) ? Math.max(now, t.navAt + sec*1000) : tm + sec*1000;
    out.push(tm);
    const p = byId(t.order[i]); tm += ((p && p.avg) || DWELL_DEFAULT) * 60000;
  }
  const back = curLeg(t, t.order.length), bsec = back ? back.sec : 600;
  const end = (t.idx >= t.order.length && t.navAt) ? Math.max(now, t.navAt + bsec*1000) : tm + bsec*1000;
  return { list: out, end, backSec: bsec };
}
async function buildRoute(shift){
  const t = S.day.trips[shift];
  const items = live(t);
  if (!items.length){ toast('配達先を登録してください'); return; }
  if (!S.cfg.depot){ toast('設定で営業所の場所を登録してください'); S.view = 'set'; render(); return; }
  const other = S.day.trips[shift === 'am' ? 'pm' : 'am'];
  if (other.status === 'run') closeTrip(other, false);
  const noPos = items.filter(s => { const p = byId(s.id); return !p || !p.lat; });
  if (noPos.length) toast(noPos.length + '件は場所が分からないので外しました');
  busy('最短ルートを計算中…');
  try{
    const r = await planRoute(S.cfg.depot, items.filter(s => !noPos.includes(s)), S.cfg.depot);
    Object.assign(t, { order: r.order, legs: r.legs, legBase: 0, idx: 0, status: 'ready', navAt: null,
                       km: Math.round(r.legs.reduce((a,l) => a + l.m, 0) / 100) / 10 });
    S.day.active = shift; S.view = 'go'; S.sheet = null; save();
  }catch(e){ toast(e.message); }
  busy(false); render();
}
/* 残りを組み直す。opt: {ids, firstId, lastId, target} */
async function reroute(kind, opt){
  opt = opt || {};
  const t = curTrip();
  const ids = (opt.ids || t.order.slice(t.idx)).slice();
  const lastId = (opt.lastId && ids.length > 1) ? opt.lastId : null;
  let fallback = ids.slice();
  if (opt.firstId) fallback = [opt.firstId, ...fallback.filter(x => x !== opt.firstId)];
  if (lastId) fallback = [...fallback.filter(x => x !== lastId), lastId];
  busy('組み直し中…');
  let pos = null;
  try{
    pos = await here().catch(() => null);
    const origin = pos || (t.idx ? pt(byId(t.order[t.idx-1])) : S.cfg.depot);
    const r = await planRoute(origin, ids.filter(id => id !== lastId).map(id => ({ id, pin: id === opt.firstId })), lastId ? pt(byId(lastId)) : S.cfg.depot);
    let order = r.order, legs = r.legs;
    if (lastId){ const b = await planRoute(pt(byId(lastId)), [], S.cfg.depot); order = order.concat(lastId); legs = legs.concat(b.legs); }
    fallback.forEach(id => { if (!order.includes(id)) order.push(id); });
    t.order = t.order.slice(0, t.idx).concat(order); t.legs = legs;
  }catch(e){
    t.order = t.order.slice(0, t.idx).concat(fallback); t.legs = [];
    toast('通信できないので、順番だけ変えました');
  }
  t.legBase = t.idx; t.changes++; t.navAt = null;
  logChange(kind, opt.target || opt.firstId || lastId || '', pos);
  save(); busy(false); render();
}

/* ---------- 配達の進行 ---------- */
function startTrip(){
  const t = curTrip();
  Object.assign(t, { status:'run', startAt: Date.now(), idx: 0, legBase: 0, navAt: null, pending: null, id: S.day.date + '-' + t.shift });
  const e = etas(t);
  t.predEnd = e.end;
  t.order.forEach((id, i) => { const st = t.stops.find(s => s.id === id); if (st){ st.plan = i + 1; st.eta0 = e.list[i]; } });
  S.day.active = t.shift; save(); render();
}
const mapsUrl = d => 'https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination=' + d.lat + ',' + d.lng;
function navTo(dest){
  const t = curTrip();
  settle(t, Date.now());
  t.navAt = Date.now(); save();
  location.href = mapsUrl(dest);
}
/* 完了にする。滞在時間は「次へ出発した時」に確定させる（settle） */
function complete(auto){
  const t = curTrip(); const id = t.order[t.idx]; if (!id) return;
  settle(t, null);
  const now = Date.now(), leg = curLeg(t, t.idx);
  const st = t.stops.find(s => s.id === id);
  Object.assign(st, { state:'done', doneAt: now, seq: t.idx + 1, auto: !!auto,
                      arrAt: (t.navAt && leg) ? Math.min(now, t.navAt + leg.sec*1000) : now });
  t.pending = id; t.idx++; t.navAt = null; S.sheet = null; save();
  const p = byId(id);
  if (p){ p.visits = (p.visits||0) + 1; p.last = S.day.date; saveMaster(); }
  toast((p ? p.name : '') + ' 完了');
  render();
}
/* ひとつ前の配達の記録を確定して送る。departAt = 次へ出発した時刻（分からなければ null） */
function settle(t, departAt){
  if (!t.pending) return;
  const st = t.stops.find(s => s.id === t.pending); t.pending = null;
  if (!st) return;
  const d = Math.round(((departAt || st.doneAt) - st.arrAt) / 60000);
  st.dwell = (d >= 1 && d <= 90) ? d : null;
  const p = byId(st.id);
  enqueue({ a:'log', sheet:'配達記録', row:[t.id, S.day.date, st.id, p ? p.name : '', st.plan || '', st.seq, st.eta0 ? hm(st.eta0) : '', hm(st.doneAt), st.dwell === null ? '' : st.dwell, (st.auto ? '完了(自動)' : '完了') + (st.added ? '・追加' : ''), st.pin ? '優先' : ''] });
  enqueue({ a:'visit', id: st.id, dwell: st.dwell, date: S.day.date });
  save();
}
function skipLater(){
  const t = curTrip();
  if (t.order.length - t.idx < 2){ toast('最後の1件です'); return; }
  reroute('後回し', { lastId: t.order[t.idx] });
}
function dropStop(id){
  const t = curTrip();
  const st = t.stops.find(s => s.id === id); if (!st) return;
  st.state = 'drop';
  const p = byId(id);
  enqueue({ a:'log', sheet:'配達記録', row:[t.id, S.day.date, id, p ? p.name : '', st.plan || '', '', st.eta0 ? hm(st.eta0) : '', '', '', '今日は行かない', ''] });
  reroute('今日は行かない', { ids: t.order.slice(t.idx).filter(x => x !== id), target: id });
}
function closeTrip(t, stale){
  settle(t, stale ? null : Date.now());
  const lastDone = Math.max(0, ...t.stops.map(s => s.doneAt || 0));
  t.status = 'done'; t.endAt = stale ? (lastDone || t.startAt) : Date.now(); t.navAt = null;
  enqueue({ a:'log', sheet:'便の記録', row:[t.id, S.day.date, shiftName(t.shift), hm(t.startAt), stale ? '(終了を押し忘れ)' : hm(t.endAt), t.stops.filter(s => s.state === 'done').length, hm(t.predEnd), hm(t.endAt), t.km || '', t.changes] });
  if (S.day.active === t.shift) S.day.active = null;
  save();
}
function finishTrip(){
  closeTrip(curTrip(), false);
  S.view = 'rev'; S.revDay = 'today'; S.sheet = null; render(); toast('おつかれさまでした');
}
function logChange(kind, id, pos){
  const t = curTrip();
  enqueue({ a:'log', sheet:'変更の記録', row:[t.id || '', new Date().toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}), kind, id || '', pos ? pos.lat : '', pos ? pos.lng : ''] });
}
/* アプリに戻ってきた時：ナビ中の行き先の近くにいれば自動で完了にする */
async function onReturn(){
  if (returning) return; returning = true;
  try{
    const changed = ensureToday(); flush();
    const t = S.day.active && S.day.trips[S.day.active];
    if (t && t.status === 'run' && t.navAt){
      const pos = await here().catch(() => null);
      const id = t.order[t.idx], p = id && byId(id);
      if (pos && p && meters(pos, pt(p)) <= AUTO_DONE_METERS){ complete(true); return; }
      if (pos && !id && S.cfg.depot && meters(pos, S.cfg.depot) <= AUTO_DONE_METERS){ finishTrip(); return; }
    }
    if (changed || (S.view === 'go' && !S.sheet)) render();
  } finally { returning = false; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') onReturn(); });
window.addEventListener('pageshow', ev => { if (ev.persisted) onReturn(); });

/* ---------- 地図（Leaflet + OpenStreetMap。使う時だけ読み込む） ---------- */
function loadLeaflet(){
  if (leaflet) return leaflet;
  leaflet = new Promise((ok, ng) => {
    const base = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.';
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = base + 'css';
    const js = document.createElement('script'); js.src = base + 'js';
    let n = 0; const done = () => { if (++n === 2) ok(); };
    css.onload = done; js.onload = done;
    css.onerror = js.onerror = () => { leaflet = null; ng(new Error('map')); };
    document.head.append(css, js);
  });
  return leaflet;
}
function decodePoly(str){
  const out = []; let i = 0, lat = 0, lng = 0;
  while (i < str.length){
    for (const k of [0, 1]){
      let b, shift = 0, r = 0;
      do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << shift; shift += 5; } while (b >= 32);
      const d = (r & 1) ? ~(r >> 1) : (r >> 1);
      if (k === 0) lat += d; else lng += d;
    }
    out.push([lat / 1e5, lng / 1e5]);
  }
  return out;
}
async function drawMap(){
  const my = ++mapSeq;
  try{ await loadLeaflet(); }catch(e){ const el = document.getElementById('map'); if (el) el.outerHTML = '<p class="muted">地図を読み込めませんでした（電波を確認してね）</p>'; return; }
  const el = document.getElementById('map');
  if (my !== mapSeq || !el) return;
  if (mapObj){ try{ mapObj.remove(); }catch(e){} mapObj = null; }
  const t = curTrip(); if (!t.order) return;
  const L = window.L, e = etas(t), dep = S.cfg.depot;
  const m = mapObj = L.map(el, { zoomControl:false });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap' }).addTo(m);
  const icon = (cls, txt) => L.divIcon({ className:'', html:`<div class="mk ${cls}">${txt}</div>`, iconSize:[26,26], iconAnchor:[13,13] });
  const at = i => { if (i < 0 || i >= t.order.length) return dep; const p = byId(t.order[i]); return p && p.lat ? pt(p) : null; };
  const all = [];
  for (let i = t.idx; i <= t.order.length; i++){
    const leg = curLeg(t, i), a = at(i - 1), b = at(i);
    const line = (leg && leg.poly) ? decodePoly(leg.poly) : (a && b && (i > t.idx || t.status !== 'run')) ? [[a.lat,a.lng],[b.lat,b.lng]] : null;
    if (line) L.polyline(line, { color:'#1f6fb2', weight:4, opacity:.8, dashArray: (leg && leg.poly) ? null : '6 8' }).addTo(m);
  }
  if (dep){ L.marker([dep.lat, dep.lng], { icon: icon('dep','発') }).addTo(m).bindPopup('営業所'); all.push([dep.lat, dep.lng]); }
  t.order.forEach((id, i) => {
    const p = byId(id), c = at(i); if (!c) return;
    const cls = i < t.idx ? 'done' : (i === t.idx && t.status === 'run') ? 'cur' : '';
    L.marker([c.lat, c.lng], { icon: icon(cls, i + 1), zIndexOffset: cls === 'cur' ? 1000 : cls === 'done' ? -500 : 0 }).addTo(m)
      .bindPopup(`${i + 1}. ${esc(p.name)}${e.list[i] ? '<br>着く予定 ' + hm(e.list[i]) : '<br>完了'}`);
    if (i >= t.idx || t.status !== 'run') all.push([c.lat, c.lng]);
  });
  if (all.length) m.fitBounds(all, { padding:[28,28], maxZoom:16 });
}

    <h2>振り返り</h2>
    ${prev ? `<div class="seg"><button data-a="revDay" data-d="today" class="${day===S.day?'on':''}">今日</button><button data-a="revDay" data-d="prev" class="${day===S.day?'':'on'}">前回（${esc(prev.date.slice(5).replace('-','/'))}）</button></div>` : ''}
    <div class="sub" style="margin-bottom:10px">${esc(day.date)}　完了 ${all.filter(s => s.state === 'done').length}件　${S.queue.length ? `<span class="pill warn">未送信 ${S.queue.length}</span>` : '<span class="pill ok">保存済み</span>'}</div>
    ${['am','pm'].map(k => { const t = day.trips[k]; if (!t.startAt) return ''; return `<div class="stats"><div class="stat"><span class="sub">${shiftName(k)} 予測</span><b>${hm(t.predEnd)}</b></div><div class="stat"><span class="sub">実際</span><b>${t.endAt ? hm(t.endAt) : '配達中'}</b></div><div class="stat"><span class="sub">ルート変更</span><b>${t.changes}回</b></div></div>`; }).join('')}
    ${all.length ? all.map(s => { const p = byId(s.id) || { name:s.id }; const tg = tagsOf(p); return `
      <div class="card">
        <div class="row"><div class="grow" style="font-weight:600">${esc(p.name)}</div><div class="sub">${s.state === 'drop' ? '行かなかった' : (s.dwell != null ? '滞在 約' + s.dwell + '分' : hm(s.doneAt))}</div></div>
        <div class="tags">${TAG_LIST.map(x => `<button class="tag ${tg.includes(x)?'on':''}" data-a="tag" data-tag="${esc(x)}" data-id="${s.id}">${esc(x)}</button>`).join('')}</div>
        <textarea data-note="${s.id}" placeholder="備考（マイクで話してもOK）">${esc(p.note||'')}</textarea>
        <div class="row" style="margin-top:8px"><button class="pin" data-a="park" data-id="${s.id}">今いる場所を駐車位置にする</button>${p.plat ? '<span class="pill ok">駐車位置あり</span>' : ''}</div>
      </div>`; }).join('') : `<div class="empty">まだ完了した配達がありません</div>`}`;
  setBar('');
}

/* 設定 */
function vSet(){
  const d = S.cfg.depot, at = LS.get('masterAt', 0);
  $('#main').innerHTML = `
    <h2>設定</h2>
    <div class="card">
      <b>営業所の場所</b>
      <div class="sub" style="margin:4px 0 10px">${d ? `登録済み（${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}）` : '未登録：営業所にいる時に下のボタンを押してね'}</div>
      <button class="btn small" data-a="setDepot">今いる場所を営業所にする</button>
    </div>
    <div class="card">
      <b>薬局リスト</b>
      <div class="sub" style="margin:4px 0 10px">${S.master.length}件　${at ? '更新 ' + new Date(at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}) : ''}</div>
      <button class="btn small" data-a="reload">薬局リストを更新</button>
    </div>
    <div class="card">
      <b>今日のデータ</b>
      <div class="sub" style="margin:4px 0 10px">未送信の記録 ${S.queue.length}件</div>
      <button class="btn small" data-a="flushNow">今すぐ送る</button>
      <div style="height:8px"></div>
      <button class="btn small" data-a="resetDay" style="color:var(--danger)">今日の配達をリセット</button>
    </div>
    <div class="card">
      <b>接続設定</b>
      <label class="f">Apps Script のURL</label><input id="cUrl" value="${esc(S.cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec">
      <label class="f">合言葉（TOKEN）</label><input id="cTok" value="${esc(S.cfg.t)}">
      <div style="height:10px"></div><button class="btn small" data-a="saveCfg">保存して確認</button>
    </div>
    <p class="muted">Googleマップの設定でも「高速道路を使わない」をオンにしておくと、ナビがこのアプリと同じ道になります。</p>
    <p class="muted">配達ルート ${VERSION}</p>`;
  setBar('');
}

/* 下から出るシート */
function renderSheet(){
  const o = $('#overlay'); if (o.querySelector('.loading')) return;
  if (!S.sheet){ o.innerHTML = ''; return; }
  const t = curTrip();
  const wrap = body => `<div class="sheet-bg" data-a="close"><div class="sheet">${body}<button class="btn small" data-a="close">閉じる</button></div></div>`;
  if (S.sheet === 'change'){
    o.innerHTML = wrap(`<h2>ルート変更</h2>
      <button class="opt" data-a="rr"><b>今いる場所から組み直す</b><span>渋滞や寄り道のあとに</span></button>
      <button class="opt" data-a="sheet" data-s="first"><b>この薬局を先に行く</b><span>一覧から選んで次にする</span></button>
      <button class="opt" data-a="sheet" data-s="add"><b>薬局を追加</b><span>名前で探して追加</span></button>
      <button class="opt" data-a="sheet" data-s="drop"><b>今日は行かない</b><span>リストから外す</span></button>`);
  } else if (S.sheet === 'first' || S.sheet === 'drop'){
    o.innerHTML = wrap(`<h2>${S.sheet === 'first' ? '先に行く薬局を選ぶ' : '今日は行かない薬局を選ぶ'}</h2>
      <div class="card list" style="padding:2px 12px">${t.order.slice(t.idx).map((id,i) => `<div class="it" data-a="${S.sheet}" data-id="${id}"><div class="num">${t.idx+i+1}</div><div class="grow">${esc(byId(id)?.name || id)}</div></div>`).join('')}</div>`);
  } else if (S.sheet === 'add'){
    o.innerHTML = wrap(`<h2>薬局を追加</h2><input id="aq" placeholder="薬局名・電話番号" autocomplete="off"><div id="acands"></div><div style="height:10px"></div>`);
    const aq = $('#aq'); aq.focus();
    aq.oninput = () => { const r = searchOne(aq.value); $('#acands').innerHTML = aq.value.trim() ? `<div class="card" style="padding:0;margin-top:8px">${r.map(p => `<div class="cand" data-a="addrun" data-id="${p.id}"><div class="grow"><div class="nm">${esc(p.name)}</div><div class="ad">${esc(shortAddr(p.addr))}</div></div><span class="pill ok">追加</span></div>`).join('') || '<div class="cand muted">見つかりません</div>'}</div>` : ''; };
  } else if (S.sheet === 'done'){
    const p = byId(t.order[t.idx]);
    o.innerHTML = wrap(`<h2>完了にしますか？</h2><div class="big-name" style="margin-bottom:14px">${esc(p ? p.name : '')}</div>
      <button class="btn primary" data-a="done">完了にする</button><div style="height:8px"></div>`);
  }
}

/* 新しい薬局をリストに登録 */
async function newPharmacy(name){
  const nm = prompt('薬局名', name || ''); if (!nm) return;
  const addr = prompt('住所（伝票の住所をそのまま）', '沖縄県'); if (!addr || addr === '沖縄県') return;
  busy('登録中…');
  try{
    const j = await api({ a:'add', name:nm, addr });
    S.master.push(j.row); saveMaster();
    if (!j.row.lat) toast('住所から場所が分かりませんでした。住所を確かめてね');
    S.q = ''; busy(false); addStop(j.row.id);
  }catch(e){ toast(e.message); }
  busy(false); render();
}

/* ---------- 操作 ---------- */
const ACT = {
  tab: d => { S.view = d.v; S.sheet = null; if (d.v === 'go') S.showAll = false; render(); window.scrollTo(0,0); },
  shift: d => { S.shift = d.s; render(); },
  add: d => {
    const tk = tokens(S.q);
    S.q = tk.length > 1 ? tk.filter(x => x !== d.tok).join('、') : '';
    addStop(d.id); render();
    if (!S.q){ const q = $('#q'); if (q) q.focus(); }
  },
  new: d => newPharmacy(d.tok),
  del: d => { const t = S.day.trips[S.shift]; t.stops = t.stops.filter(s => s.id !== d.id); t.order = null; t.status = 'plan'; save(); render(); },
  pin: d => { const t = S.day.trips[S.shift], s = t.stops.find(s => s.id === d.id); s.pin = !s.pin; t.order = null; t.status = 'plan'; save(); render(); },
  move: () => { const from = S.day.trips[S.shift], to = S.day.trips[S.shift === 'am' ? 'pm' : 'am']; if (to.status === 'run'){ toast('配達中の便には移せません'); return; } to.stops.push(...from.stops); from.stops = []; from.order = to.order = null; from.status = to.status = 'plan'; save(); render(); },
  build: () => buildRoute(S.shift),
  rebuild: () => buildRoute(goShift()),
  edit: () => { S.shift = goShift(); S.view = 'reg'; render(); },
  start: () => startTrip(),
  nav: () => { const t = curTrip(), p = byId(t.order[t.idx]); if (p) navTo(pt(p)); },
  navDepot: () => navTo(S.cfg.depot),
  finish: () => finishTrip(),
  later: () => skipLater(),
  done: () => complete(false),
  sheet: d => { S.sheet = d.s; renderSheet(); },
  close: () => { S.sheet = null; renderSheet(); },
  rr: () => { S.sheet = null; reroute('組み直し'); },
  first: d => { S.sheet = null; reroute('先に行く', { firstId: d.id }); },
  drop: d => { S.sheet = null; dropStop(d.id); },
  addrun: d => { S.sheet = null; renderSheet(); addToTrip(curTrip(), d.id); },
  toggleAll: () => { S.showAll = !S.showAll; render(); },
  toggleMap: () => { S.showMap = !S.showMap; render(); if (S.showMap) setTimeout(() => { const m = document.getElementById('map'); if (m) m.scrollIntoView({ behavior:'smooth', block:'center' }); }, 50); },
  revDay: d => { S.revDay = d.d; render(); },
  tag: (d, el) => {
    const p = byId(d.id); if (!p) return;
    const tg = tagsOf(p);
    p.tags = (tg.includes(d.tag) ? tg.filter(x => x !== d.tag) : tg.concat(d.tag)).join('、');
    saveMaster(); el.classList.toggle('on'); enqueue({ a:'note', id:p.id, tags:p.tags });
  },
  park: async d => {
    try{ const pos = await here(); const p = byId(d.id); p.plat = pos.lat; p.plng = pos.lng; saveMaster(); enqueue({ a:'note', id:p.id, plat:pos.lat, plng:pos.lng }); toast('駐車位置を保存しました'); render(); }
    catch(e){ toast(e.message); }
  },
  setDepot: async () => { busy('現在地を取得中…'); try{ S.cfg.depot = await here(); save(); toast('営業所を登録しました'); }catch(e){ toast(e.message); } busy(false); render(); },
  reload: () => loadMaster(false),
  flushNow: () => { toast('送信しています'); flush().then(() => { if (S.view === 'set') render(); }); },
  resetDay: () => { if (confirm('今日の配達を全部消しますか？（スプレッドシートの記録は残ります）')){ S.day = newDay(); save(); render(); } },
  saveCfg: () => { S.cfg.url = $('#cUrl').value.trim(); S.cfg.t = $('#cTok').value.trim(); save(); loadMaster(false); }
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]');
  if (!el) return;
  if (el.classList.contains('sheet-bg') && ev.target !== el) return;   // シートの中の空白では閉じない
  const fn = ACT[el.dataset.a];
  if (fn) fn(el.dataset, el);
});
/* 備考は、入力が止まったら保存 */
let noteTimer = null;
document.addEventListener('input', ev => {
  const id = ev.target.dataset && ev.target.dataset.note; if (!id) return;
  const p = byId(id); if (!p) return;
  p.note = ev.target.value; LS.set('master', S.master);
  clearTimeout(noteTimer); noteTimer = setTimeout(() => enqueue({ a:'note', id, note:p.note }), 1200);
});

/* ---------- 起動 ---------- */
ensureToday();
if (S.day.active && S.day.trips[S.day.active].status === 'run') S.view = 'go';
render();
if (S.cfg.url && (!S.master.length || Date.now() - LS.get('masterAt', 0) > 6*3600*1000)) loadMaster(true);
onReturn();
</script>
