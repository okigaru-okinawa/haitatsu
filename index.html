<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="配達ルート">
<meta name="theme-color" id="themeColor" content="#F2F2F7">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>配達ルート</title>
<style>
:root{
  --paper:#F2F2F7;--card:#FFFFFF;--ink:#000000;--ink2:#636366;--ink3:#A1A1A6;--rule:#E3E3E8;
  --blue:#007AFF;--blue-deep:#0062CC;--blue-soft:#E5F1FF;--on-blue:#FFFFFF;
  --green:#248A3D;--green-soft:#E3F6E8;--amber:#8A5300;--amber-soft:#FFF4D6;--red:#FF3B30;--bar:rgba(249,249,249,.88);
  --tab:58px;--num:"DIN Alternate","Avenir Next Condensed","Helvetica Neue",system-ui,sans-serif;
}
html[data-theme=dark]{
  --paper:#000000;--card:#1C1C1E;--ink:#FFFFFF;--ink2:#AEAEB2;--ink3:#636366;--rule:#2C2C2E;
  --blue:#0A84FF;--blue-deep:#0060DF;--blue-soft:#0A2A4D;--on-blue:#FFFFFF;
  --green:#30B050;--green-soft:#0F2E18;--amber:#FFD60A;--amber-soft:#3A2F00;--red:#FF453A;--bar:rgba(28,28,30,.88);
}
@media (prefers-color-scheme:dark){html[data-theme=auto]{
  --paper:#000000;--card:#1C1C1E;--ink:#FFFFFF;--ink2:#AEAEB2;--ink3:#636366;--rule:#2C2C2E;
  --blue:#0A84FF;--blue-deep:#0060DF;--blue-soft:#0A2A4D;--on-blue:#FFFFFF;
  --green:#30B050;--green-soft:#0F2E18;--amber:#FFD60A;--amber-soft:#3A2F00;--red:#FF453A;--bar:rgba(28,28,30,.88);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(var(--tab) + 170px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
[data-a]{cursor:pointer}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

main{padding:10px 16px 0;max-width:560px;margin:0 auto}
.title{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:10px 2px 14px}
.title h1{font-size:28px;font-weight:800;line-height:1.2;margin:0;letter-spacing:.01em}
.title .aside{font-size:13px;color:var(--ink2);padding-bottom:5px;text-align:right}
.label{font-size:13px;color:var(--ink2);margin:18px 4px 6px;display:flex;justify-content:space-between;gap:8px}
.hint{font-size:12px;color:var(--ink3);margin:6px 4px 0}
.card{background:var(--card);border-radius:12px;overflow:hidden}
.pad{padding:14px 16px}
.empty{text-align:center;color:var(--ink2);padding:34px 16px;font-size:15px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* 便の切り替え */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--rule);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-size:15px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.shift{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.shift button{border:2px solid var(--rule);background:var(--card);border-radius:14px;padding:10px 14px;text-align:left;display:flex;align-items:center;gap:8px;color:var(--ink2)}
.shift button b{font-size:18px;font-weight:800;color:var(--ink)}
.shift button .n{font-size:20px;font-weight:700;margin-left:auto}
.shift button small{font-size:12px}
.shift button.on{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.shift button.on b{color:var(--on-blue)}
.shift .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink3);flex:none;display:flex;align-items:center;justify-content:center}
.shift .on .dot{border-color:var(--on-blue);background:var(--on-blue);color:var(--blue)}
.shift .dot svg{width:14px;height:14px;stroke-width:3;display:none}
.shift .on .dot svg{display:block}

/* 検索 */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 6px 0 14px;height:54px;border:2px solid transparent}
.search:focus-within{border-color:var(--blue)}
.search svg{color:var(--ink3)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:18px;color:var(--ink);outline:none;height:100%}
.search input::placeholder{color:var(--ink3);font-size:16px}
.clear{border:0;background:var(--rule);color:var(--ink2);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-right:6px}
.clear svg{width:14px;height:14px;color:inherit}
.nextmemo{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:14px;font-weight:600;line-height:1.4}
.nextmemo b{display:block;font-size:12px;opacity:.85}
.testbar{background:var(--amber-soft);color:var(--amber);font-size:13px;font-weight:700;text-align:center;border-radius:10px;padding:6px 10px;margin-top:6px}
.newlink{display:flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--blue);font-size:15px;font-weight:600;padding:12px 4px 4px}
.newlink svg{width:18px;height:18px}
.quick{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:0;background:var(--card);border-radius:999px;padding:8px 14px 8px 10px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap}
.quick svg{width:16px;height:16px;color:var(--blue)}
.cand{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-top:1px solid var(--rule)}
.cand:first-child{border-top:0}
.cand .nm{font-weight:700;line-height:1.35}
.cand .ad{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plus{width:34px;height:34px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:flex;align-items:center;justify-content:center;flex:none}
.plus svg{width:18px;height:18px}
.chip{display:inline-block;font-size:12px;line-height:1;padding:4px 8px;border-radius:6px;background:var(--blue-soft);color:var(--blue);white-space:nowrap;vertical-align:2px;font-weight:600}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.red{background:var(--red);color:#fff}
.chip.due{background:var(--blue);color:#fff}
.always{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:10px 12px;border:0;border-radius:12px;background:var(--paper);color:var(--ink);text-align:left;font-size:14px}
.always i{width:24px;height:24px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px var(--ink3);color:transparent;background:var(--card)}
.always i .ic{width:15px;height:15px}
.always.on i{background:var(--blue);box-shadow:none;color:#fff}
.always b{display:block;font-weight:700}.always small{display:block;font-size:12px;color:var(--ink2);margin-top:1px}
.duehint{margin:10px 2px 0;font-size:13px;color:var(--ink2)}
.duebar{background:var(--card);border-radius:14px;margin:10px 0 0;overflow:hidden}
.duebar>div{display:flex;align-items:center;gap:10px;padding:10px 14px}
.duebar>div+div{border-top:1px solid var(--rule)}
.duebar b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duebar small{display:block;font-size:12px;color:var(--ink2)}
.duebar .grow{min-width:0;flex:1}
.duebar .t{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}.duebar .t small{display:inline;margin-left:2px}
.duebar .late small{color:var(--red);font-weight:600}.duebar .late .t{color:var(--red)}
.memo.duememo{background:var(--blue-soft);color:var(--blue)}
.memo.closed{background:var(--red);color:#fff}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick .tag{min-width:52px}
.pick.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pick.days .tag{min-width:0;padding:8px 0;text-align:center}
.grow{flex:1;min-width:0}

/* 配達先の行（路線図ふう）。左スワイプで削除、長押しで並べ替え */
.srow{position:relative;background:var(--red);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.srow .row-del{position:absolute;right:0;top:0;bottom:0;width:88px;border:0;background:var(--red);color:#fff;font-size:15px;font-weight:700}
.srow.two{background:var(--green)}
.srow .row-went{position:absolute;right:88px;top:0;bottom:0;width:88px;border:0;background:var(--green);color:#fff;font-size:15px;font-weight:700}
.row-body:active{background:var(--rule)}
.row-body{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);padding:0 12px 0 0;min-height:62px;touch-action:pan-y;transition:transform .18s ease}
.rail{position:relative;align-self:stretch;width:56px;flex:none;display:flex;align-items:center;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;background:var(--blue)}
.noline .rail::before{display:none}
.srow.first .rail::before{top:50%}
.srow.last .rail::before{bottom:50%}
.srow.done .rail::before{background:var(--green)}
.node{position:relative;width:30px;height:30px;border-radius:50%;background:var(--card);border:3px solid var(--blue);color:var(--blue);display:flex;align-items:center;justify-content:center;font:700 15px/1 var(--num)}
.srow.done .node{border-color:var(--green);background:var(--green);color:#fff}
.srow.term .node{border-radius:8px;background:var(--ink);border-color:var(--ink);color:var(--paper);font:700 13px/1 -apple-system,"Hiragino Sans",sans-serif}
.srow .txt{flex:1;min-width:0;padding:10px 0;border-bottom:1px solid var(--rule);align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.srow.last .txt,.srow:last-child .txt{border-bottom:0}
.srow .nm{font-weight:600;line-height:1.35}
.srow .ad{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .side{font:700 17px/1 var(--num);color:var(--ink2);flex:none}
.grip{color:var(--ink3);display:flex;flex:none}
.grip svg{width:20px;height:20px}
.flag{border:0;background:transparent;color:var(--ink3);padding:8px 4px;display:flex;flex:none}
.flag.on{color:var(--amber)}
.flag.on svg{fill:currentColor}
.srow.sortable-chosen .row-body{box-shadow:0 8px 24px rgba(0,0,0,.25);border-radius:12px;transform:scale(1.02)}
.srow.sortable-ghost{opacity:.25}
.sortable-fallback{border-radius:12px;overflow:hidden}

/* 青い案内標識のパネル：いま一番大事なこと */
.sign{background:var(--blue);color:var(--on-blue);border-radius:20px;padding:18px 18px 16px;position:relative}
.sign .eyebrow{font-size:13px;opacity:.85;display:flex;justify-content:space-between;gap:8px}
.sign .name{font-size:30px;font-weight:800;line-height:1.25;margin:6px 0 4px;letter-spacing:.01em;word-break:break-all}
.sign .addr{font-size:14px;opacity:.9}
.sign .figs{display:flex;gap:22px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.28)}
.sign .fig small{display:block;font-size:12px;opacity:.85}
.sign .fig b{font:700 30px/1.15 var(--num)}
.sign .fig b span{font:600 14px/1 -apple-system,"Hiragino Sans",sans-serif;margin-left:2px}
.sign{border:1px solid rgba(255,255,255,.22);background:linear-gradient(165deg,color-mix(in srgb,var(--blue) 86%,#fff) 0%,var(--blue) 46%,var(--blue-deep) 100%)}
.sign.now{animation:glowBlue 2.4s ease-in-out infinite}
.sign.going{background:linear-gradient(165deg,color-mix(in srgb,var(--green) 84%,#fff) 0%,var(--green) 46%,#1B6B30 100%);animation:glowGreen 2.4s ease-in-out infinite}
@keyframes glowBlue{0%,100%{box-shadow:0 0 0 2px rgba(0,122,255,.30),0 0 16px 2px rgba(0,122,255,.30)}50%{box-shadow:0 0 0 5px rgba(0,122,255,.16),0 0 34px 8px rgba(0,122,255,.55)}}
@keyframes glowGreen{0%,100%{box-shadow:0 0 0 2px rgba(36,138,61,.30),0 0 16px 2px rgba(36,138,61,.30)}50%{box-shadow:0 0 0 5px rgba(36,138,61,.16),0 0 34px 8px rgba(36,138,61,.55)}}
.state{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.2);border-radius:999px;padding:5px 12px 5px 10px;font-size:13px;font-weight:800;letter-spacing:.02em}
.live{width:9px;height:9px;border-radius:50%;background:#fff;animation:live 1.4s ease-in-out infinite}
@keyframes live{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.sign-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.sa{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:11px 6px;font-size:16px;font-weight:800}
.sa svg{width:18px;height:18px;stroke-width:2.6}
.sa.cur{background:#fff;border-color:#fff;color:var(--blue-deep)}
.sign.going .sa.cur{color:#1B6B30}
.sa:active{transform:scale(.97)}
.mini-row .row-body{min-height:44px}
.mini-row .txt{padding:6px 0}
.mini-row .nm{font-weight:500;color:var(--ink2);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-row .node{width:24px;height:24px}
.mini-row .node svg{width:14px;height:14px;stroke-width:3}
.mini-row .side{font:500 13px/1 -apple-system,"Hiragino Sans",sans-serif;color:var(--ink3)}
.mini-row .undo{border:0;background:var(--green-soft);color:var(--green);font-weight:700;font-size:13px;border-radius:8px;padding:7px 10px;flex:none}
.done-card{margin-bottom:0}
.link-rail{width:4px;height:12px;background:var(--green);margin-left:26px}
@media (prefers-reduced-motion:reduce){.sign.now,.sign.going,.live{animation:none}}
.exit{margin-top:10px;padding:14px 14px 12px}
.exit-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2);margin-bottom:10px}
.exit-h b{font-size:15px;color:var(--ink)}
.exit-b{display:flex;align-items:center;gap:16px;margin-bottom:12px}
#dial{display:block;position:relative;width:96px;height:96px;flex:none;border:0;background:transparent;padding:0}
.d-ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--rule)}
.d-ring span{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;color:var(--red);background:var(--card);padding:0 4px;line-height:16px}
.d-arrow{position:absolute;inset:12px;display:flex;align-items:center;justify-content:center}
.d-arrow svg{width:100%;height:100%;fill:var(--blue);stroke:var(--card);stroke-width:1;stroke-linejoin:round;filter:drop-shadow(0 2px 4px rgba(0,122,255,.35))}
#dial.live .d-ring{border-color:var(--blue-soft)}
.exit-t .big{font-size:26px;font-weight:800;line-height:1.2}
.exit-t .sub{font-size:13px;color:var(--ink2);line-height:1.45;margin-top:2px}
.exit-t .on{color:var(--green);font-weight:700}
#exitmap{height:200px;border-radius:12px;background:var(--rule);z-index:0}
.exit-cap{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--ink2);margin-top:8px;flex-wrap:wrap}
.exit-cap i{display:inline-block;vertical-align:-1px;margin-right:5px}
.exit-cap .c-me{width:11px;height:11px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 1px var(--blue)}
.exit-cap .c-ln{width:20px;height:5px;border-radius:3px;background:var(--blue);vertical-align:2px}
.me{position:relative;width:22px;height:22px}
.me .dot{position:absolute;inset:3px;border-radius:50%;background:#007AFF;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,122,255,.6),0 1px 4px rgba(0,0,0,.4)}
.me .halo{position:absolute;inset:-9px;border-radius:50%;background:rgba(0,122,255,.22);animation:live 1.8s ease-in-out infinite}
.me .beam{position:absolute;left:50%;top:50%;width:0;height:0;margin:-46px 0 0 -22px;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:46px solid rgba(0,122,255,.28);transform-origin:50% 100%;display:none}
.me.has-h .beam{display:block}
.arw{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid #fff;filter:drop-shadow(0 0 2px rgba(0,60,140,.9))}
.exit-t .rel{font-size:15px;font-weight:800;color:var(--blue);margin-bottom:2px}
.exit-t .rel:empty{display:none}

/* ===== 横向き（ホルダーに横で置いた時）===== */
html.land{--tab:42px}
html.land body{padding-bottom:calc(var(--tab) + 16px + env(safe-area-inset-bottom))}
html.land main.two>*:not(.col2):last-of-type{margin-bottom:120px}
html.land body.fit{padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom));overflow:hidden}
html.land main{max-width:none;padding:6px max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
html.land .title{margin:4px 2px 8px}
html.land .title h1{font-size:20px}
html.land .tabbar{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
html.land .tabbar button{flex-direction:row;gap:7px;font-size:13px}
html.land .tabbar svg.ic{width:19px;height:19px}
html.land .bar{padding:8px max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left))}
html.land .bar{right:auto;width:calc(47.6% + 6px);padding-right:0;background:var(--paper)}
html.land .bar>div{max-width:none}
html.land .bar .btn.primary,html.land .bar .btn.go{min-height:50px;border-radius:14px}
html.land .bar .more{margin-top:6px}
html.land .bar .more .btn{min-height:40px;font-size:13px;padding:6px 2px;white-space:nowrap}
html.land .bar .nextmemo{display:none}
html.land .bt b{font-size:17px}
html.land .toast{bottom:calc(var(--tab) + 14px + env(safe-area-inset-bottom))}
html.land .sheet{max-width:620px;max-height:94vh}
/* 登録・出発前：左に操作、右に一覧 */
html.land main.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);column-gap:14px;grid-template-rows:repeat(7,max-content) 1fr;align-items:start}
html.land main.two>*{grid-column:1}
html.land main.two>.col2{grid-column:2;grid-row:1/-1;min-width:0}
html.land main.two #map.tall{height:calc(100dvh - var(--tab) - 110px - env(safe-area-inset-bottom))}
html.land main.two .label{margin-top:8px}
html.land main.two .sign.compact{gap:14px;padding:10px 14px}
/* 配達中：左に今の配達先とボタン、右に地図1枚 */
.lrun{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:10px;height:calc(100dvh - var(--tab) - 14px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.l-left{display:flex;flex-direction:column;gap:7px;min-width:0;min-height:0}
.l-head{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--ink2);white-space:nowrap}
.l-head b{font:700 19px/1 var(--num);color:var(--ink)}
.l-head .undo{margin-left:auto;margin-right:auto;border:0;background:var(--green-soft);color:var(--green);font-weight:700;font-size:12px;border-radius:8px;padding:5px 9px;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.l-head .end{margin-left:auto}
.l-head .undo+.end{margin-left:0}
.l-sign{flex:1;min-height:0;border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.l-sign .state{align-self:flex-start;font-size:12px;padding:3px 10px 3px 8px}
.l-sign .name{margin:4px 0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.l-sign .addr{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-figs{display:flex;gap:18px;margin-top:6px;white-space:nowrap}

<body>
<main id="main"></main>
<div class="bar" id="bar" hidden></div>
<nav class="tabbar" id="tabs"></nav>
<div id="overlay"></div>
<script src="vendor/sortable.min.js" defer></script>

<script>
'use strict';
/* =========================================================
   配達ルートアプリ
   データは端末（localStorage）に保存し、スプレッドシートとは Apps Script 経由で裏で同期する
   ========================================================= */
const VERSION = 'v31';
const AUTO_DONE_METERS = 250;       // アプリに戻った時、この距離以内なら自動で完了
const MAX_WP = 25;                  // Routes API で1回に扱える経由地の上限
const TAG_LIST = ['裏口','右側','左側','駐車しにくい','駐車場あり','昼休みあり','受付に時間がかかる'];
const ROUTE_MASK = 'routes.optimizedIntermediateWaypointIndex,routes.legs.duration,routes.legs.distanceMeters,routes.legs.polyline.encodedPolyline';
const svg = d => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const IC = {
  search: svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  x: svg('<path d="M6 6l12 12M18 6 6 18"/>'),
  check: svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>'),
  grip: svg('<path d="M5 9h14M5 15h14"/>'),
  flag: svg('<path d="M6 21V4h11l-2 4 2 4H6"/>'),
  chev: svg('<path d="m9 6 6 6-6 6"/>'),
  nav: svg('<path d="M12 3 5 20l7-4 7 4z"/>'),
  list: svg('<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>'),
  note: svg('<path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6"/>'),
  gear: svg('<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'),
  here: svg('<circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>'),
  up: svg('<path d="M12 19V5M6 11l6-6 6 6"/>'),
  ban: svg('<circle cx="12" cy="12" r="8"/><path d="m6.5 6.5 11 11"/>')
};

/* ---------- 保存 ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const todayStr = () => new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
function newTrip(s){ return { shift:s, stops:[], order:null, legs:null, legBase:0, idx:0, status:'plan', manual:false, changes:0, startAt:null, endAt:null, predEnd:null, km:null, id:null, navAt:null, pending:null }; }
function newDay(){ return { date: todayStr(), trips: { am: newTrip('am'), pm: newTrip('pm') }, active: null, history: [] }; }
const S = {
  view: 'reg',
  cfg: LS.get('cfg', { url:'', t:'', depot:null }),
  master: LS.get('master', []),
  day: LS.get('day', null) || newDay(),
  queue: LS.get('queue', []),
  shift: new Date().getHours() >= 13 ? 'pm' : 'am',   // 登録画面で選んでいる便
  q: '', sheet: null, showAll: false, showMap: false, revDay: 'today', revOpen: null
};
if (!S.day.history) S.day.history = [];
['am','pm'].forEach(k => { const t = S.day.trips[k]; if (t.status === 'done'){ t.legs = null; S.day.history.push(t); S.day.trips[k] = newTrip(k); if (S.day.active === k) S.day.active = null; } });   // 前の版のデータを引き継ぐ
function applyTheme(){ const th = S.cfg.theme || 'light'; document.documentElement.dataset.theme = th; const dark = th === 'dark' || (th === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); const m = document.getElementById('themeColor'); if (m) m.content = dark ? '#000000' : '#F2F2F7'; }
applyTheme();
let flushing = false, returning = false, IDX = null, mapObj = null, mapSeq = 0, leaflet = null, sorters = [], sorting = false, swipedAt = 0;
const save = () => { LS.set('day', S.day); LS.set('cfg', S.cfg); };
const saveMaster = () => { IDX = null; LS.set('master', S.master); };
const byId = id => { if (!IDX) IDX = new Map(S.master.map(p => [p.id, p])); return IDX.get(id); };
const goShift = () => S.day.active || ['am','pm'].find(k => ['ready','run'].includes(S.day.trips[k].status)) || S.shift;
const curTrip = () => S.day.trips[goShift()];
const live = t => t.stops.filter(s => s.state !== 'drop');
const shiftName = k => k === 'am' ? '午前' : '午後';
const dateLabel = s => { const d = new Date(s + 'T12:00:00+09:00'); return `${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`; };

/* 日付が変わったら新しい日にする（前の日は振り返り用に残す） */
function ensureToday(){
  if (S.day.date === todayStr()) return false;
  ['am','pm'].forEach(k => { if (S.day.trips[k].status === 'run') closeTrip(S.day.trips[k], true); });
  if (S.day.history.length) LS.set('prevDay', S.day);
  S.day = newDay(); S.revDay = 'today'; S.sheet = null; save();
  return true;
}

/* 設定はアドレスの #setup= に入れて持ち運ぶ（ホーム画面に追加したアプリは保存場所が別なので、追加する時に一緒に渡す） */
function readSetup(text){
  const m = String(text || '').match(/setup=([^&\s]+)/);
  if (!m) return false;
  try{
    const o = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    if (!o.u || !o.t) return false;
    const fresh = S.cfg.url !== o.u || S.cfg.t !== o.t;
    S.cfg.url = o.u; S.cfg.t = o.t;
    if (o.x) S.cfg.test = true;
    if (o.d && !S.cfg.depot) S.cfg.depot = o.d;
    save();
    return fresh ? 'new' : 'same';
  }catch(e){ return false; }
}
function setupHash(){
  if (!S.cfg.url) return '';
  const o = { u: S.cfg.url, t: S.cfg.t }; if (S.cfg.depot) o.d = S.cfg.depot; if (S.cfg.test) o.x = 1;
  return '#setup=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(o)))));
}
function keepSetupInUrl(){ try{ if (S.cfg.url) history.replaceState(null, '', location.pathname + setupHash()); }catch(e){} }
(function(){
  if (!/setup=/.test(location.hash)) return;
  const r = readSetup(location.hash);

/* 記録は裏で送る。送れなかった分は端末に貯めて、次の機会にまとめて送る */
function enqueue(item){ if (S.cfg.test) return;   /* テストモードでは何も送らない */
  S.queue.push(item); LS.set('queue', S.queue); flush(); }
async function flush(){

/* ---------- 検索 ---------- */
/* ひらがな・カタカナ・漢字・住所・電話のどれでも探せるようにする。変換前のひらがなでも当たるよう、読みを併せ持つ */
const kata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const norm = s => kata(String(s||'').normalize('NFKC')).replace(/[\s・\-ー－―（）()「」、。,.]/g,'').replace(/ヶ/g,'ケ').replace(/髙/g,'高').replace(/﨑/g,'崎').replace(/藥/g,'薬').toLowerCase();
const slim = s => s.replace(/薬局|調剤|ヤツキヨク|ヤッキョク|チョウザイ|店$|テン$/g, '');
let NORM = new WeakMap(), YOMI = LS.get('yomi', {});
function keys(p){
  let k = NORM.get(p);
  if (!k){
    const y = String(YOMI[p.id] || ''), yn = y.includes('|') ? y.split('|')[0] : '', ya = y.includes('|') ? y.split('|')[1] : y;
    const n = norm(p.name), kn = norm(p.kana) || norm(yn);
    k = { names: [n, slim(n), kn, slim(kn)].filter(Boolean), addr: norm(p.addr) + '|' + norm(ya), tel: String(p.tel||'').replace(/\D/g,'') };
    NORM.set(p, k);
  }
  return k;
}
function scoreTerm(k, raw){
  const q = slim(norm(raw)) || norm(raw);
  const digits = String(raw).normalize('NFKC').replace(/\D/g,'');
  let sc = 0;
  if (q){
    if (k.names.some(x => x.startsWith(q))) sc = 100;
    else if (k.names.some(x => x.includes(q))) sc = 60;
    else if (q.length >= 2 && k.addr.includes(q)) sc = 25;
  }
  if (digits.length >= 4 && k.tel.includes(digits)) sc = Math.max(sc, 90);
  return sc;
}
/* 空白で区切った言葉は「全部に当てはまる薬局」を探す（例：とまと うらそえ） */
function searchOne(raw, skip){
  const terms = String(raw||'').trim().split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  const usage = LS.get('usage', {});
  const res = [];
  for (const p of S.master){
    if (skip && skip.has(p.id)) continue;
    const k = keys(p);
    let sum = 0, ok = true;
    for (const t of terms){ const sc = scoreTerm(k, t); if (!sc){ ok = false; break; } sum += sc; }
    if (!ok) continue;
    res.push([sum / terms.length + Math.min(40, (usage[p.id]||0) * 8) + Math.min(10, p.visits||0), p]);
  }
  return res.sort((a,b) => b[0]-a[0]).slice(0, 8).map(x => x[1]);
}
/* 「、」や空白で区切って複数まとめて探す（音声入力向け） */
function tokens(q){
  const out = [];
  for (const c of String(q).split(/[、,，。\n]+/).map(x => x.trim()).filter(Boolean)){
    if (searchOne(c).length){ out.push(c); continue; }
    const parts = c.split(/\s+/).flatMap(x => x.replace(/薬局(?=.)/g, '薬局\u0000').split('\u0000')).map(x => x.trim()).filter(Boolean);
    out.push(...(parts.length ? parts : [c]));
  }
  return out;
}

/* ---------- 距離・時刻・現在地 ---------- */
function meters(a, b){
  const R = 6371000, r = x => x*Math.PI/180;
  const dLat = r(b.lat-a.lat), dLng = r(b.lng-a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const pt = p => (p.plat && p.plng) ? {lat:p.plat, lng:p.plng} : {lat:p.lat, lng:p.lng};
const hm = d => d ? new Date(d).toLocaleTimeString('ja-JP',{hour:'numeric',minute:'2-digit',timeZone:'Asia/Tokyo'}) : '--:--';
const secs = s => Number(String(s||'0s').replace('s','')) || 0;
const mins = sec => Math.max(1, Math.round(sec/60));
function here(){
  return new Promise((ok, ng) => {
    if (!navigator.geolocation) return ng(new Error('位置情報が使えません'));
    navigator.geolocation.getCurrentPosition(p => ok({lat:p.coords.latitude, lng:p.coords.longitude}),
      () => ng(new Error('現在地が取れません（位置情報を許可してください）')), { enableHighAccuracy:true, timeout:10000, maximumAge:20000 });
  });
}

/* ---------- ルート計算 ---------- */
const wp = p => ({ location:{ latLng:{ latitude:p.lat, longitude:p.lng } } });
async function routeCall(origin, list, dest, optimize){
  const body = {
    origin: wp(origin), destination: wp(dest), intermediates: list.map(wp),
    travelMode:'DRIVE', routingPreference:'TRAFFIC_AWARE',
    routeModifiers:{ avoidHighways:true, avoidTolls:true },
    languageCode:'ja-JP', units:'METRIC'
  };
  if (optimize && list.length > 1) body.optimizeWaypointOrder = true;
  const j = await api({ a:'routes', body, mask: ROUTE_MASK });
  const r = j.data.routes && j.data.routes[0];
  if (!r) throw new Error('ルートが見つかりませんでした');
  let ord = list.map((_,i) => i);
  if (body.optimizeWaypointOrder && r.optimizedIntermediateWaypointIndex) ord = r.optimizedIntermediateWaypointIndex;
  return { ord, legs: r.legs || [] };
}
/* 決まった順番のまま道のりを計算する（25件を超えたら分けて呼ぶ） */
async function routeFixed(origin, pts, dest){
  const legs = []; let cur = origin, i = 0;
  for (;;){
    const inter = pts.slice(i, i + MAX_WP); i += inter.length;
    const more = i < pts.length, d = more ? pts[i] : dest;
    if (more) i++;
    const r = await routeCall(cur, inter, d, false);
    legs.push(...r.legs); cur = d;
    if (!more) return legs;
  }
}
/* 直線距離での大まかな巡回順（25件を超える時に、近いもの同士で分けるために使う） */
function roughTour(origin, items){
  const left = items.slice(), out = []; let cur = origin;
  while (left.length){
    let bi = 0, bd = Infinity;
    left.forEach((p,i) => { const d = meters(cur, pt(p)); if (d < bd){ bd = d; bi = i; } });
    cur = pt(left[bi]); out.push(left.splice(bi,1)[0]);
  }
  for (let pass = 0; pass < 3; pass++){
    for (let i = 0; i < out.length-1; i++) for (let k = i+1; k < out.length; k++){
      const a = i ? pt(out[i-1]) : origin, b = pt(out[i]), c = pt(out[k]), d = k+1 < out.length ? pt(out[k+1]) : origin;
      if (meters(a,c) + meters(b,d) < meters(a,b) + meters(c,d) - 1) out.splice(i, k-i+1, ...out.slice(i,k+1).reverse());
    }
  }
  return out;
}
/* origin を出て items（[{id,pin}]）を回り dest へ。fixed なら渡した順のまま。pin は先頭に固定 */
async function planRoute(origin, items, dest, fixed){
  const ps = items.map(s => ({ s, p: byId(s.id) })).filter(x => x.p && x.p.lat);
  const pinned = fixed ? ps : ps.filter(x => x.s.pin), free = fixed ? [] : ps.filter(x => !x.s.pin);
  const seq = [], legs = []; let start = origin;
  if (pinned.length && free.length){
    const last = pt(pinned[pinned.length-1].p);
    legs.push(...await routeFixed(start, pinned.slice(0,-1).map(x => pt(x.p)), last));
    seq.push(...pinned); start = last;
  }
  if (!free.length){
    legs.push(...await routeFixed(start, pinned.map(x => pt(x.p)), dest)); seq.push(...pinned);
  } else if (free.length <= MAX_WP){
    const r = await routeCall(start, free.map(x => pt(x.p)), dest, true);
    seq.push(...r.ord.map(i => free[i])); legs.push(...r.legs);
  } else {
    const back = new Map(free.map(x => [x.p, x]));
    const tour = roughTour(start, free.map(x => x.p));
    const n = Math.ceil(tour.length / MAX_WP), size = Math.ceil(tour.length / n);
    const groups = []; for (let i = 0; i < tour.length; i += size) groups.push(tour.slice(i, i + size));
    for (let g = 0; g < groups.length; g++){
      const isLast = g === groups.length - 1;
      const r = await routeCall(start, groups[g].map(pt), isLast ? dest : pt(groups[g+1][0]), true);
      const ordered = r.ord.map(i => groups[g][i]);
      seq.push(...ordered.map(p => back.get(p)));
      legs.push(...(isLast ? r.legs : r.legs.slice(0, -1)));   // 次の組への区間は、次の計算で引き直す
      start = pt(ordered[ordered.length-1]);
    }
  }
  return { order: seq.map(x => x.s.id), legs: legs.map(l => ({ sec: secs(l.duration), m: l.distanceMeters || 0, poly: (l.polyline && l.polyline.encodedPolyline) || null })) };
}
/* 今の順番を崩さずに、いちばん遠回りにならない位置へ1件はさむ */
function insertBest(ids, id, origin, dest){
  const P = x => { const p = byId(x); return p && p.lat ? pt(p) : null; };
  const c = P(id); if (!c) return ids.concat(id);
  let best = ids.length, bd = Infinity;
  for (let i = 0; i <= ids.length; i++){
    const a = i ? P(ids[i-1]) : origin, b = i < ids.length ? P(ids[i]) : dest;
    if (!a || !b) continue;
    const d = meters(a, c) + meters(c, b) - meters(a, b);
    if (d < bd){ bd = d; best = i; }
  }
  return [...ids.slice(0, best), id, ...ids.slice(best)];
}
const curLeg = (t, i) => (t.legs || [])[i - (t.legBase || 0)];
/* 各配達先の到着予定と、営業所に戻る予定 */
function etas(t){
  const out = [], now = Date.now(); let tm = now;
  for (let i = 0; i < t.order.length; i++){
    if (i < t.idx){ out.push(null); continue; }
    const leg = curLeg(t, i), sec = leg ? leg.sec : 600;
    tm = (i === t.idx && t.navAt) ? Math.max(now, t.navAt + sec*1000) : tm + sec*1000;
    out.push(tm);
    tm += dwellOf(byId(t.order[i])) * 60000;
  }
  const back = curLeg(t, t.order.length), bsec = back ? back.sec : 600;
  const end = (t.idx >= t.order.length && t.navAt) ? Math.max(now, t.navAt + bsec*1000) : tm + bsec*1000;
  return { list: out, end, backSec: bsec };
}
const legSum = legs => ({ sec: legs.reduce((a, l) => a + l.sec, 0), km: Math.round(legs.reduce((a, l) => a + l.m, 0) / 100) / 10 });
const fmtDur = sec => { const m = Math.round(sec / 60); return m >= 60 ? `${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + '分' : ''}` : m + '分'; };
/* ---------- 「○時まで」に間に合う順番にする ----------
   最短の順番のままで間に合うなら、何も動かさない。
   間に合わない所だけを、間に合う位置の中でいちばん遠回りが少ない所へ前に出す。
   lock = 先頭から動かしてはいけない件数（「最初に行く」や、もうナビで向かっている所） */
const DUE_SAFE = 5 * 60000;
function dueFit(t, origin, order, legs, lock, T0){
  const P = id => { const p = byId(id); return p && p.lat ? pt(p) : null; };
  const due = {}; order.forEach(id => { const a = dueAt(t, t.stops.find(s => s.id === id)); if (a) due[id] = a; });
  if (!Object.keys(due).length) return null;
  /* まだ走っていない区間の見積り：このルートの「直線1mあたり何秒」を使う */
  let sm = 0, ss = 0;
  order.forEach((id, i) => { const a = i ? P(order[i-1]) : origin, b = P(id), l = legs[i]; if (a && b && l){ sm += meters(a, b); ss += l.sec; } });
  const k = sm > 500 ? Math.min(0.5, Math.max(0.06, ss / sm)) : 0.15;
  const est = (a, b) => (a && b ? meters(a, b) * k + 60 : 600);
  let seq = order.map((id, i) => ({ id, sec: legs[i] ? legs[i].sec : null }));
  const legSec = (x, i, list) => x.sec != null ? x.sec : est(i ? P(list[i-1].id) : origin, P(x.id));
  const stay = id => dwellOf(byId(id)) * 60000;
  const moved = [], miss = [];
  Object.keys(due).forEach(id => { if (due[id] <= T0) miss.push(id); });   // もう時刻を過ぎている指定は、順番を動かさない
  for (let n = 0; n < 10; n++){
    let tm = T0; const at = seq.map((x, i) => { tm += legSec(x, i, seq) * 1000; const a = tm; tm += stay(x.id); return a; });
    const late = seq.map((x, i) => ({ x, i, d: due[x.id] })).filter(o => o.d && at[o.i] > o.d - DUE_SAFE && !miss.includes(o.x.id)).sort((a, b) => a.d - b.d)[0];
    if (!late) break;
    if (late.i <= lock){ miss.push(late.x.id); continue; }   // もうこれ以上前に出せない
    const rest = seq.filter(x => x !== late.x), c = P(late.x.id);
    let best = -1, bd = Infinity; tm = T0;
    for (let j = lock; j < late.i; j++){
      const a = j ? P(rest[j-1].id) : origin, b = rest[j] ? P(rest[j].id) : null;
      if (tm + est(a, c) * 1000 <= late.d - DUE_SAFE){
        const det = (a && c ? meters(a, c) : 0) + (b && c ? meters(c, b) : 0) - (a && b ? meters(a, b) : 0);
        if (det < bd){ bd = det; best = j; }
      }
      tm += legSec(rest[j], j, rest) * 1000 + stay(rest[j].id);
    }
    if (best < 0){ best = lock; miss.push(late.x.id); }      // どこに入れても間に合わない → いちばん前へ
    const after = seq[late.i + 1]; if (after) after.sec = null;
    if (rest[best]) rest[best].sec = null;
    late.x.sec = null; rest.splice(best, 0, late.x); seq = rest; moved.push(late.x.id);
  }
  const out = seq.map(x => x.id);
  return { order: out, changed: out.join() !== order.join(), moved: [...new Set(moved)], miss };
}
/* 最短で出した結果 r に時間指定を当てはめ、動かした時は実際の道でもう一度確かめる */
async function dueApply(t, origin, r, dest, lock){
  let cur = r, moved = [], miss = [];
  for (let round = 0; round < 4; round++){
    const f = dueFit(t, origin, cur.order, cur.legs, lock || 0, Date.now());
    if (!f) break;
    miss = f.miss;
    if (!f.changed || round === 3) break;
    /* 前に出した所までは順番を固定し、その先は、そこからの最短をもう一度出す（行って戻る無駄を減らす） */
    const last = Math.max(...f.moved.map(id => f.order.indexOf(id)));
    try{ cur = await planRoute(origin, f.order.map((id, i) => ({ id, pin: i <= last })), dest, false); moved.push(...f.moved); }catch(e){ break; }
  }
  cur.moved = [...new Set(moved)].filter(id => cur.order.indexOf(id) < r.order.indexOf(id)); cur.miss = miss;
  return cur;
}
const dueNames = ids => ids.map(id => (byId(id) || {}).name || '').filter(Boolean).join('、');
/* 配達中：時間が押してきて「○時まで」に間に合わなくなりそうなら、裏で組み直す（同じ状況では1回だけ） */
function dueWatch(t){
  if (!t || t.status !== 'run' || !t.order) return;
  const e = etas(t);
  for (let i = t.idx + 1; i < t.order.length; i++){
    const id = t.order[i], st = t.stops.find(s => s.id === id), at = dueAt(t, st);
    if (!at || e.list[i] <= at - 120000) continue;
    const sig = t.idx + ':' + id; if (t.dueSig === sig) return;
    t.dueSig = sig; save();
    if (t.manual) toast(((byId(id) || {}).name || '') + ' が ' + dueHour(t, st) + '時に間に合わなくなりそうです');
    else rerouteSoon('時間指定', id);
    return;
  }
}
/* 出発前のルートを作る。ids を渡すとその順番のまま（手で並べた順）。
   最短を作る時は、3通りの回り方を実際の道路（今の混み具合）で計算して、走る時間がいちばん短いものを選ぶ */
async function buildRoute(shift, ids){
  const t = S.day.trips[shift];
  let items = live(t);
  if (!items.length){ toast('配達先を登録してください'); return; }
  if (!S.cfg.depot){ toast('先に営業所の場所を登録してください'); S.view = 'set'; render(); return; }
  const other = S.day.trips[shift === 'am' ? 'pm' : 'am'];
  if (other.status === 'run') closeTrip(other, false);
  const fixed = !!ids;
  if (fixed) items = ids.map(id => items.find(s => s.id === id)).filter(Boolean);
  const noPos = items.filter(s => { const p = byId(s.id); return !p || !p.lat; });
  if (noPos.length) toast(noPos.length + '件は場所が分からないので外しました');
  items = items.filter(s => !noPos.includes(s));
  if (toastEl) toastEl.remove();
  busy(fixed ? '時間を計算中…' : '回り方を比べています…');
  try{
    const dep = S.cfg.depot;
    let best, proof = null;
    if (fixed || items.length < 3){
      best = await planRoute(dep, items, dep, fixed);
    } else {
      const pins = items.filter(s => s.pin), free = items.filter(s => !s.pin);
      const from = pins.length ? pt(byId(pins[pins.length-1].id)) : dep;
      const near = [...pins, ...roughTour(from, free.map(s => byId(s.id))).map(p => free.find(s => s.id === p.id))];
      const tries = await Promise.all([
        planRoute(dep, items, dep, false),
        planRoute(dep, near, dep, true).catch(() => null),
        planRoute(dep, items, dep, true).catch(() => null)
      ]);
      const labels = ['Googleが並べた順', '近い所から回る順', '登録した順'];
      proof = tries.map((r, i) => r ? Object.assign({ label: labels[i], usable: i < 2 || !pins.length }, legSum(r.legs)) : null);
      let bi = 0;
      tries.forEach((r, i) => { if (r && proof[i].usable && proof[i].sec < proof[bi].sec) bi = i; });
      best = tries[bi]; proof = proof.map((x, i) => x && Object.assign(x, { chosen: i === bi })).filter(Boolean);
    }
    if (!fixed) best = await dueApply(t, dep, best, dep, items.filter(s => s.pin).length);
    Object.assign(t, { order: best.order, legs: best.legs, legBase: 0, idx: 0, status: 'ready', navAt: null, manual: fixed, proof, km: legSum(best.legs).km, dueMoved: best.moved || [], dueMiss: best.miss || [], dueSig: null });
    S.day.active = shift; S.view = 'go'; S.goTab = 'list'; S.sheet = null; save();
  }catch(e){ toast(e.message === 'Failed to fetch' ? '通信できませんでした。電波を確認してね' : e.message); }
  busy(false); render();
}
/* 配達中に残りを組み直す。opt: {ids, firstId, lastId, fixed, target} */
async function reroute(kind, opt){
  opt = opt || {};
  const t = curTrip();
  const ids = (opt.ids || t.order.slice(t.idx)).slice();
  const lastId = (opt.lastId && ids.length > 1) ? opt.lastId : null;
  let fallback = ids.slice();
  if (opt.firstId) fallback = [opt.firstId, ...fallback.filter(x => x !== opt.firstId)];
  if (lastId) fallback = [...fallback.filter(x => x !== lastId), lastId];
  reSeq++; clearTimeout(reTimer);   // 裏で予定していた組み直しは、こちらに任せる
  busy('組み直し中…');
  let pos = null;
  try{
    pos = await here().catch(() => null);
    const origin = pos || (t.idx ? pt(byId(t.order[t.idx-1])) : S.cfg.depot);
    const r = await planRoute(origin, fallback.filter(id => id !== lastId).map(id => ({ id, pin: id === opt.firstId })), lastId ? pt(byId(lastId)) : S.cfg.depot, !!opt.fixed);
    let order = r.order, legs = r.legs;
    if (!opt.fixed && !lastId){
      const f = await dueApply(t, origin, r, S.cfg.depot, opt.firstId ? 1 : 0); order = f.order; legs = f.legs;
      t.dueMoved = f.moved || []; t.dueMiss = f.miss || [];
      if (f.moved && f.moved.length) setTimeout(() => toast(dueNames(f.moved) + ' を前に動かしました（時間指定）'), 50);
    }
    if (lastId){ const b = await planRoute(pt(byId(lastId)), [], S.cfg.depot, true); order = order.concat(lastId); legs = legs.concat(b.legs); }
    fallback.forEach(id => { if (!order.includes(id)) order.push(id); });
    t.order = t.order.slice(0, t.idx).concat(order); t.legs = legs;
  }catch(e){
    t.order = t.order.slice(0, t.idx).concat(fallback); t.legs = [];
    toast('通信できないので、順番だけ変えました');
  }
  if (opt.manual !== undefined) t.manual = opt.manual;
  t.legBase = t.idx; t.changes++; t.navAt = null;
  logChange(kind, opt.target || opt.firstId || lastId || '', pos);

}
/* 配達先を1件足す（登録中・出発前・配達中のどれでも） */
function addToTrip(t, id){
  const other = S.day.trips[t.shift === 'am' ? 'pm' : 'am'];
  const old = t.stops.find(s => s.id === id);
  if ((old && old.state !== 'drop') || other.stops.some(s => s.id === id && s.state !== 'drop')){ toast('もう入っています'); return false; }
  const u = LS.get('usage', {}); u[id] = (u[id]||0) + 1; LS.set('usage', u);
  if (old){ old.state = 'todo'; old.added = true; } else t.stops.push({ id, pin:false, state:'todo', added: t.status === 'run' });
  save();
  if (t.status === 'run'){
    /* 配達中：まず順番に入れて画面はすぐ返し、道の計算は裏でまとめて1回だけ */
    const rest = t.order.slice(t.idx);
    const next = t.manual ? insertBest(rest, id, null, S.cfg.depot) : rest.concat(id);
    const k = t.idx + next.indexOf(id) - (t.legBase || 0);
    if (t.legs && k >= 0 && k <= t.legs.length) t.legs.splice(Math.min(k, Math.max(0, t.legs.length - 1)), 0, { sec: 480, m: 2500 });
    t.order = t.order.slice(0, t.idx).concat(next); save();
    rerouteSoon('追加', id);
  } else if (t.status === 'ready' && S.view === 'reg'){
    t.order = null; t.status = 'plan'; save();   // 登録の画面で足している間は、作り直さない（足し終わってから「ルートを作る」）
  } else if (t.status === 'ready'){
    buildRoute(t.shift, t.manual ? insertBest(t.order, id, S.cfg.depot, S.cfg.depot) : null);
  } else { t.order = null; save(); }
  return true;
}

/* ---------- 配達の進行 ---------- */
function startTrip(){
  const t = curTrip();
  const n = S.day.history.filter(h => h.shift === t.shift).length;
  Object.assign(t, { status:'run', startAt: Date.now(), idx: 0, legBase: 0, navAt: null, pending: null, id: S.day.date + '-' + t.shift + (n ? '-' + (n + 1) : '') });
  const e = etas(t);
  t.predEnd = e.end;
  t.order.forEach((id, i) => { const st = t.stops.find(s => s.id === id); if (st){ st.plan = i + 1; st.eta0 = e.list[i]; } });
  S.day.active = t.shift; S.showAll = false; save(); render(); window.scrollTo(0, 0); dueWatch(t);
}
/* Googleマップへ渡す行き先。名前と住所で渡すと、マップ側にも名前が出る。
   駐車位置を登録してある所は、その場所へ正確に案内するために緯度・経度で渡す */
const destText = p => (p.plat && p.plng) ? p.plat + ',' + p.plng : encodeURIComponent(String(p.name).replace(/\s+/g, ' ') + ' ' + p.addr);
const mapsUrl = dest => 'https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination=' + dest;
function navTo(dest){
  const t = curTrip();
  if (t.breakAt){ const m = Math.max(1, Math.round((Date.now() - t.breakAt) / 60000)); t.breakMin = (t.breakMin || 0) + m; t.breakAt = null; logChange('休憩 ' + m + '分', '', null); }
  settle(t, Date.now()); commitWent(t);
  if (!t.navAt) t.navAt = Date.now();
  save(); render();
  location.href = mapsUrl(dest);   // dest は destText(p) か「緯度,経度」
}
/* 完了にする。記録の確定（滞在時間）は「次へ出発した時」に行う（settle） */
function complete(auto){
  const t = curTrip(); const id = t.order[t.idx]; if (!id) return;
  settle(t, null);
  const now = Date.now(), leg = curLeg(t, t.idx);
  const st = t.stops.find(s => s.id === id);
  Object.assign(st, { state:'done', doneAt: now, seq: t.idx + 1, auto: !!auto,
                      arrAt: (t.navAt && leg) ? Math.min(now, t.navAt + leg.sec*1000) : now });
  t.pending = id; t.idx++; t.navAt = null; S.sheet = null; save();
  const p = byId(id);
  if (p){ p.visits = (p.visits||0) + 1; p.last = S.day.date; saveMaster(); }
  render(); toHero(); dueWatch(t);
}
/* まちがえて完了になった時に、ひとつ戻す（次へ出発する前だけ） */
function undoDone(){
  const t = curTrip(); if (!t.pending || t.idx < 1 || t.order[t.idx-1] !== t.pending) return;
  const st = t.stops.find(s => s.id === t.pending);
  Object.assign(st, { state:'todo', doneAt:null, seq:null, arrAt:null, auto:false });
  const p = byId(st.id); if (p && p.visits){ p.visits--; saveMaster(); }
  t.pending = null; t.idx--; t.navAt = null; save(); render();
}
function settle(t, departAt){
  if (!t.pending) return;
  const st = t.stops.find(s => s.id === t.pending); t.pending = null;
  if (!st) return;
  const d = Math.round(((departAt || st.doneAt) - st.arrAt) / 60000);
  st.dwell = (d >= 1 && d <= 90) ? d : null;
  const p = byId(st.id);
  enqueue({ a:'log', sheet:'配達記録', row:[t.id, S.day.date, st.id, p ? p.name : '', st.plan || '', st.seq, st.eta0 ? hm(st.eta0) : '', hm(st.doneAt), st.dwell === null ? '' : st.dwell, (st.auto ? '完了(自動)' : '完了') + (st.added ? '・追加' : ''), [st.pin ? '優先' : '', dueHour(t, st) ? dueHour(t, st) + '時まで' : ''].filter(Boolean).join('・')] });
  enqueue({ a:'visit', id: st.id, dwell: st.dwell, date: S.day.date });

}
/* 今の配達先を後ろへ動かす。ふつうは「1つ後」（次の所を先に済ませて、すぐ戻ってくる）。toLast なら一番最後へ */
async function moveCurrent(kind, toLast){
  const t = curTrip(), ids = t.order.slice(t.idx), id = ids[0], p = byId(id);
  S.sheet = null;
  if (ids.length < 2){ toast('これが最後の1件です'); renderSheet(); return false; }
  if (toLast || ids.length === 2) await reroute(kind, { ids: [...ids.slice(1), id], fixed:true, target:id });
  else await reroute(kind, { ids: [ids[1], id, ...ids.slice(2)], fixed:true, target:id });
  const nm = p ? p.name : '';
  if (toLast || ids.length === 2) toast(nm + ' を最後に回しました');
  else toast(nm + ' を1つ後に回しました', { label:'最後に回す', fn: () => {
    const rest = t.order.slice(t.idx); if (!rest.includes(id) || rest[0] === id) return;
    reroute('最後に回す', { ids: [...rest.filter(x => x !== id), id], fixed:true, target:id }).then(() => toast(nm + ' を最後に回しました'));
  } });

}
/* 行ったら閉まっていた：時刻を記録して1つ後に回し、次の配達先へ進む */
function closedNow(){
  const t = curTrip(), id = t.order[t.idx], st = t.stops.find(x => x.id === id); if (!id || !st) return;
  st.closedAt = Date.now(); st.closedCount = (st.closedCount || 0) + 1;
  if (t.order.length - t.idx < 2){ S.sheet = null; t.navAt = null; logChange('閉まっていた', id, null); save(); render(); toast('記録しました。これが最後の1件です'); return; }
  moveCurrent('閉まっていた', false);
}
/* 閉まっていた時刻が午後で、その曜日をまだ覚えていなければ、覚えるかを聞くボタンを出す */
function closedOffer(p, st){
  if (!st || !st.closedAt) return '';
  const d = new Date(new Date(st.closedAt).toLocaleString('en-US', { timeZone:'Asia/Tokyo' })), wd = '日月火水木金土'[d.getDay()];
  const ask = d.getHours() >= 12 && wd !== '日' && !closedDays(p).includes(wd);
  return `<div class="memo closed" style="display:flex;align-items:center;gap:10px"><span class="grow">さっき ${hm(st.closedAt)} に行った時は閉まっていました</span>${ask ? `<button class="mini" style="background:#fff;color:var(--red)" data-a="rememberClosed" data-id="${p.id}" data-wd="${wd}">${wd}曜午後は休診</button>` : ''}</div>`;
}
function dropStop(id){
  const t = curTrip();
  const st = t.stops.find(s => s.id === id); if (!st) return;
  st.state = 'drop';
  const p = byId(id);
  enqueue({ a:'log', sheet:'配達記録', row:[t.id, S.day.date, id, p ? p.name : '', st.plan || '', '', st.eta0 ? hm(st.eta0) : '', '', '', '今日は行かない', ''] });
  const j = t.order.indexOf(id, t.idx);
  if (j >= 0){ cutLeg(t, j); t.order.splice(j, 1); if (j === t.idx) t.navAt = null; }
  save(); render();
  toast((p ? p.name : '') + ' を外しました');
  rerouteSoon('今日は行かない', id);
}
/* ---------- ナビを使わずに寄った所を「行った」にする ---------- */
const cutLeg = (t, j) => { const k = j - (t.legBase || 0); if (t.legs && k >= 0 && k < t.legs.length) t.legs.splice(k, 1); };
/* 「行った」の記録は、取り消せるように少しだけ待ってから送る */
function commitWent(t){
  if (!t || !t.wentPend) return;
  const st = t.stops.find(s => s.id === t.wentPend); t.wentPend = null;
  if (!st || st.state !== 'done') return;
  const p = byId(st.id);
  enqueue({ a:'log', sheet:'配達記録', row:[t.id, S.day.date, st.id, p ? p.name : '', st.plan || '', st.seq, st.eta0 ? hm(st.eta0) : '', hm(st.doneAt), '', '完了(ついでに)' + (st.added ? '・追加' : ''), [st.pin ? '優先' : '', dueHour(t, st) ? dueHour(t, st) + '時まで' : ''].filter(Boolean).join('・')] });
  enqueue({ a:'visit', id: st.id, dwell: null, date: S.day.date });
  save();
}
function wentStop(id){
  const t = curTrip(), j = t.order.indexOf(id, t.idx), st = t.stops.find(s => s.id === id);
  if (j < 0 || !st) return;
  if (j === t.idx){ complete(false); return; }
  commitWent(t);
  const now = Date.now(), keep = t.pending && t.idx > 0 && t.order[t.idx - 1] === t.pending;   // 「まだだった」で戻せる所は、そのまま残す
  Object.assign(st, { state:'done', doneAt: now, arrAt: now, seq: t.idx + 1, auto: false, went: true, dwell: null });
  cutLeg(t, j);
  t.order.splice(j, 1); t.order.splice(keep ? t.idx - 1 : t.idx, 0, id);
  t.idx++; t.legBase = (t.legBase || 0) + 1; t.wentPend = id;
  const p = byId(id);
  if (p){ p.visits = (p.visits||0) + 1; p.last = S.day.date; saveMaster(); }
  save(); render();
  toast((p ? p.name : '') + ' を配達済みにしました', { label:'取り消す', fn: () => undoWent(id) });
  rerouteSoon('ついでに配達', id);
}
function undoWent(id){
  const t = curTrip(), st = t.stops.find(s => s.id === id), at = t.order.indexOf(id);
  if (t.wentPend !== id || !st || at < 0 || at >= t.idx) return;
  t.wentPend = null;
  Object.assign(st, { state:'todo', doneAt: null, arrAt: null, seq: null, went: false });
  const p = byId(id); if (p && p.visits){ p.visits--; saveMaster(); }
  t.order.splice(at, 1); t.idx--; t.legBase = Math.max(0, (t.legBase || 0) - 1);
  const to = Math.min(t.order.length, t.idx + 1);
  t.order.splice(to, 0, id);
  const k = to - (t.legBase || 0); if (t.legs && k >= 0 && k <= t.legs.length) t.legs.splice(k, 0, { sec: 300, m: 1000 });
  save(); render();
  rerouteSoon('取り消し', id);
}
/* 残りの順番を、今いる場所から裏で組み直す。画面は止めない。続けて押した時は、最後の1回だけ動く */
let reTimer = null, reSeq = 0;
function rerouteSoon(kind, target){ clearTimeout(reTimer); const seq = ++reSeq; reTimer = setTimeout(() => bgReroute(kind, target, seq), 1500); }
async function bgReroute(kind, target, seq){
  const t = curTrip(); if (!t || t.status !== 'run') return;
  const ids = t.order.slice(t.idx), idx0 = t.idx, key = ids.slice().sort().join();
  const same = () => curTrip() === t && t.status === 'run' && t.idx === idx0 && t.order.slice(t.idx).sort().join() === key;
  try{
    const pos = await here().catch(() => null);
    const origin = pos || (t.idx ? pt(byId(t.order[t.idx-1])) : S.cfg.depot);
    const head = t.navAt ? ids[0] : null;   // もうナビで向かっている所は、行き先を変えない
    let r = await planRoute(origin, ids.map(id => ({ id, pin: id === head })), S.cfg.depot, !!t.manual);
    if (!t.manual) r = await dueApply(t, origin, r, S.cfg.depot, head ? 1 : 0);
    if (seq !== reSeq) return;
    if (!same()){ rerouteSoon(kind, target); return; }
    const order = r.order.slice(); ids.forEach(id => { if (!order.includes(id)) order.push(id); });
    const moved = order.join() !== ids.join();
    t.order = t.order.slice(0, t.idx).concat(order); t.legs = r.legs; t.legBase = t.idx; t.changes++;
    if (t.navAt) t.navAt = Date.now();
    logChange(kind, target || '', pos); save();
    if (S.sheet === 'add') S.added = (S.added || 0) + 1;   // 追加の途中は入力を消さない。閉じた時に描き直す
    else if (S.view === 'reg'){ if (!$('#q') || document.activeElement !== $('#q')) refreshReg(); }
    else if (!sorting && !(sw && sw.on) && !document.querySelector('.srow.open')) render();
    if (!t.manual){ t.dueMoved = r.moved || []; t.dueMiss = r.miss || []; save(); }
    if (r.moved && r.moved.length) toast(dueNames(r.moved) + ' を前に動かしました（時間指定）');
    else if (moved) toast('残りの順番を組み直しました');
  }catch(e){ /* 通信できない時は、今の順番のまま進める */ }
}
/* 便を終える：記録を送り、履歴に移して、同じ枠で次の便を登録できるようにする */
function closeTrip(t, stale){
  settle(t, stale ? null : Date.now()); commitWent(t);
  const lastDone = Math.max(0, ...t.stops.map(s => s.doneAt || 0));
  t.status = 'done'; t.endAt = stale ? (lastDone || t.startAt) : Date.now(); t.navAt = null;
  enqueue({ a:'log', sheet:'便の記録', row:[t.id, S.day.date, shiftName(t.shift), hm(t.startAt), stale ? '(終了を押し忘れ)' : hm(t.endAt), t.stops.filter(s => s.state === 'done').length, hm(t.predEnd), hm(t.endAt), t.km || '', t.changes] });
  t.legs = null;
  S.day.history.push(t);
  S.day.trips[t.shift] = newTrip(t.shift);
  if (S.day.active === t.shift) S.day.active = null;
  save();
}
function finishTrip(){
  closeTrip(curTrip(), false);
  S.view = 'rev'; S.revDay = 'today'; S.sheet = null; S.goTab = 'list'; render(); window.scrollTo(0, 0);
  toast('おつかれさまでした');
}
function logChange(kind, id, pos){
  const t = curTrip();
  enqueue({ a:'log', sheet:'変更の記録', row:[t.id || '', new Date().toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}), kind, id || '', pos ? pos.lat : '', pos ? pos.lng : ''] });
}
/* アプリに戻ってきた時：ナビ中の行き先の近くにいれば自動で完了にする */
async function onReturn(){
  if (returning) return; returning = true;
  try{
    const changed = ensureToday(); flush();
    const t = S.day.active && S.day.trips[S.day.active];
    if (t && t.status === 'run' && t.navAt){
      const pos = await here().catch(() => null);
      const id = t.order[t.idx], p = id && byId(id);
      if (pos && p && meters(pos, pt(p)) <= AUTO_DONE_METERS){ complete(true); return; }
      if (pos && !id && S.cfg.depot && meters(pos, S.cfg.depot) <= AUTO_DONE_METERS){ finishTrip(); return; }
    }

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') onReturn(); });
window.addEventListener('pageshow', ev => { if (ev.persisted) onReturn(); });

/* ---------- 地図（Leaflet + OpenStreetMap。使う時だけ読み込む） ---------- */
function loadLeaflet(){
  if (leaflet) return leaflet;
  leaflet = new Promise((ok, ng) => {
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'vendor/leaflet.css';
    const js = document.createElement('script'); js.src = 'vendor/leaflet.js';
    let n = 0; const done = () => { if (++n === 2) ok(); };
    css.onload = done; js.onload = done;
    css.onerror = js.onerror = () => { leaflet = null; ng(new Error('map')); };
    document.head.append(css, js);
  });
  return leaflet;
}
function decodePoly(str){
  const out = []; let i = 0, lat = 0, lng = 0;
  while (i < str.length){
    for (const k of [0, 1]){
      let b, shift = 0, r = 0;
      do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << shift; shift += 5; } while (b >= 32);
      const d = (r & 1) ? ~(r >> 1) : (r >> 1);
      if (k === 0) lat += d; else lng += d;
    }
    out.push([lat / 1e5, lng / 1e5]);
  }
  return out;
}
async function drawMap(){
  const my = ++mapSeq;
  try{ await loadLeaflet(); }catch(e){ const el = document.getElementById('map'); if (el) el.outerHTML = '<p class="hint">地図を読み込めませんでした</p>'; return; }
  const el = document.getElementById('map');
  if (my !== mapSeq || !el) return;
  if (mapObj){ try{ mapObj.remove(); }catch(e){} mapObj = null; }
  const t = curTrip(); if (!t.order) return;
  const L = window.L, e = etas(t), dep = S.cfg.depot;
  const m = mapObj = L.map(el, { zoomControl:false });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap' }).addTo(m);
  const icon = (cls, txt) => L.divIcon({ className:'', html:`<div class="mk ${cls}">${txt}</div>`, iconSize:[26,26], iconAnchor:[13,13] });
  const at = i => { if (i < 0 || i >= t.order.length) return dep; const p = byId(t.order[i]); return p && p.lat ? pt(p) : null; };
  const all = [];
  for (let i = t.idx; i <= t.order.length; i++){
    const leg = curLeg(t, i), a = at(i - 1), b = at(i);
    const line = (leg && leg.poly) ? decodePoly(leg.poly) : (a && b && (i > t.idx || t.status !== 'run')) ? [[a.lat,a.lng],[b.lat,b.lng]] : null;
    if (line) L.polyline(line, { color:'#007AFF', weight:4, opacity:.85, dashArray: (leg && leg.poly) ? null : '6 8' }).addTo(m);
  }
  if (dep){ L.marker([dep.lat, dep.lng], { icon: icon('dep','営') }).addTo(m).bindPopup('営業所'); all.push([dep.lat, dep.lng]); }
  t.order.forEach((id, i) => {
    const p = byId(id), c = at(i); if (!c) return;
    const cls = i < t.idx ? 'done' : (i === t.idx && t.status === 'run') ? 'cur' : '';
    L.marker([c.lat, c.lng], { icon: icon(cls, i + 1), zIndexOffset: cls === 'cur' ? 1000 : cls === 'done' ? -500 : 0 }).addTo(m)
      .bindPopup(`${i + 1}. ${esc(p.name)}${e.list[i] ? '<br>着く予定 ' + hm(e.list[i]) : '<br>完了'}`);
    if (i >= t.idx || t.status !== 'run') all.push([c.lat, c.lng]);
  });
  if (all.length) m.fitBounds(all, { padding:[28,28], maxZoom:16 });
}

/* ---------- 出る方向（コンパスの矢印と小さな地図） ----------
   配達を終えて駐車場を出る時、「右か左か」ではなく、進む方向そのものを見せる。
   矢印は iPhone の方位センサーで実際の方向を指す。地図は、今いる場所と、そこから出ていく道の線 */
let heading = null, compassOn = false, exitMap = null, exitSeq = 0;
function bearing(a, b){
  const r = x => x * Math.PI / 180;
  const y = Math.sin(r(b.lng - a.lng)) * Math.cos(r(b.lat));
  const x = Math.cos(r(a.lat)) * Math.sin(r(b.lat)) - Math.sin(r(a.lat)) * Math.cos(r(b.lat)) * Math.cos(r(b.lng - a.lng));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
/* 今の区間の「出てすぐの道」。道の線があればその最初の150mの向き、なければ次の所への直線の向き */
function exitInfo(t){
  const leg = curLeg(t, t.idx), dep = S.cfg.depot;
  const prevP = t.idx ? byId(t.order[t.idx - 1]) : null, nextP = byId(t.order[t.idx]);

  if (leg && leg.poly){

      return { road:true, line, start: line[0], deg: bearing(line[0], line[k]) };

function onOrient(e){

  else if (e.absolute && typeof e.alpha === 'number') h = (360 - e.alpha) % 360;                                // Android

}
/* 方位センサーを使い始める。iPhone では、ボタンを押した時にしか許可を求められない */

  try{
    if (typeof DeviceOrientationEvent.requestPermission === 'function') DeviceOrientationEvent.requestPermission().then(r => { if (r === 'granted') go(); else toast('向きを使えないので、円の上が北です'); }).catch(() => {});

}
async function drawExit(){

  const t = curTrip(), x = t.order ? exitInfo(t) : null;

  const el = find();

  if (exitMap){ try{ exitMap.remove(); }catch(e){} exitMap = null; }
  const full = el.id === 'lmap', all = full && S.lmapMode === 'all';

  const ll = p => [p.lat, p.lng], everything = [];
  if (full){   /* 横向き：このあとの道と配達先も薄く描いておく（「全体を見る」で使う） */
    const dep = S.cfg.depot, icon = (cls, txt) => L.divIcon({ className:'', html:`<div class="mk ${cls}">${txt}</div>`, iconSize:[26,26], iconAnchor:[13,13] });
    for (let i = t.idx + 1; i <= t.order.length; i++){ const leg = curLeg(t, i); if (leg && leg.poly) L.polyline(decodePoly(leg.poly), { color:'#007AFF', weight:4, opacity:.45 }).addTo(m); }
    t.order.forEach((id, i) => { if (i < t.idx) return; const sp = byId(id); if (!sp || !sp.lat) return; const c = pt(sp);
      L.marker(ll(c), { icon: icon(i === t.idx ? 'cur' : '', i + 1), zIndexOffset: i === t.idx ? 900 : 0 }).addTo(m).bindPopup(`${i + 1}. ${esc(sp.name)}`); everything.push(ll(c)); });
    if (dep){ L.marker(ll(dep), { icon: icon('dep', '営') }).addTo(m).bindPopup(esc(dep.name || '営業所')); everything.push(ll(dep)); }
  }

  /* 進む向きが分かるように、線の上に矢じりを置く。寄せて見せる範囲は、出てから200mくらいまで */
  const near = [ll(x.start)];
  if (x.road){
    let d = 0, next = 45;
    for (let i = 1; i < x.line.length && d < 520; i++){

        L.marker(ll(x.line[i]), { interactive:false, icon: L.divIcon({ className:'', html:`<div class="arw" style="transform:rotate(${Math.round(bearing(x.line[i-1], x.line[i]))}deg)"></div>`, iconSize:[18,16], iconAnchor:[9,8] }) }).addTo(m);
        next += 110;

      if (d <= 200) near.push(ll(x.line[i]));

  /* 今いる場所（分からない時は、区間の出発点）。扇は iPhone が向いている方向 */
  const me = (pos && meters(pos, x.start) < 600) ? pos : x.start;
  L.marker(ll(me), { interactive:false, zIndexOffset:1000, icon: L.divIcon({ className:'', html:'<div class="me"><div class="beam"></div><div class="halo"></div><div class="dot"></div></div>', iconSize:[22,22], iconAnchor:[11,11] }) }).addTo(m);
  near.push(ll(me)); everything.push(ll(me));

  else {
    const b = L.latLngBounds(near);
    m.fitBounds(b, { paddingTopLeft:[24, full ? 70 : 24], paddingBottomRight:[24, full ? 50 : 24], maxZoom:18 });
    if (m.getZoom() < 17) m.setView(b.getCenter(), 17);     // まわりの店や道の名前が読める大きさを下限にする
  }
  updateDial();
}

  return wide && innerWidth > innerHeight && innerHeight < 520;
}

/* 住所から、地元の人が使う「○○方面」の地名を取り出す（東西南北は使わない） */
function areaOf(addr){
  const a = String(addr || '').normalize('NFKC').replace(/^沖縄県/, '').replace(/^(島尻郡|中頭郡|国頭郡)/, '');
  const m = a.match(/^(.+?[市町村])(?:大字|字)?([^0-9]*)/);
  if (!m) return '';
  const aza = m[2].replace(/[一二三四五六七八九十]+丁目.*$/, '').replace(/(番地|番|丁目|の)$/, '').trim();
  return aza || m[1];
}
function dirTarget(t){
  const np = byId(t.order[t.idx]), dep = S.cfg.depot || {};
  if (np){ const ar = areaOf(np.addr); return ar ? ar + ' 方面へ' : np.name + 'へ'; }
  const ar = areaOf(dep.addr); return ar ? ar + ' 方面へ（戻る）' : '営業所へ戻る';
}
/* iPhone が向いている方向から見て、どちらへ出るか（設定で選んだ時だけ使う） */
function relWord(deg){
  if (!S.cfg.relWords || heading === null) return '';
  const d = ((deg - heading) % 360 + 360) % 360;
  return d < 35 || d > 325 ? 'このまま前へ' : d < 150 ? '右へ出る' : d <= 210 ? '後ろへ（向きを変える）' : '左へ出る';
}

const DWELL_CHOICES = [3, 5, 8, 10, 15], DAYS = ['月','火','水','木','金','土'];

/* 「○時まで」に届ける：今日だけの指定は便の中（st.by）、「いつも」はメモのタグ（○時まで）に持つ */

const dueTag = p => { const m = tagsOf(p).map(x => x.match(/^(\d{1,2})時まで$/)).find(Boolean); return m ? Number(m[1]) : null; };

  if (!t || !st) return null;
