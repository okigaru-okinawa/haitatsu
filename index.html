<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="配達ルート">
<meta name="theme-color" id="themeColor" content="#F3F5F1">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>配達ルート</title>
<style>
:root{
  --paper:#F3F5F1;--card:#FFFFFF;--ink:#101820;--ink2:#55606B;--ink3:#8E98A2;--rule:#E1E5DF;
  --blue:#0A5FB4;--blue-deep:#084C91;--blue-soft:#E3EEF9;--on-blue:#FFFFFF;
  --green:#0E8A5F;--green-soft:#DDF2E9;--amber:#8A5300;--amber-soft:#FFF1CF;--red:#D93A2B;
  --tab:58px;--num:"DIN Alternate","Avenir Next Condensed","Helvetica Neue",system-ui,sans-serif;
}
html[data-theme=dark]{
  --paper:#0D1217;--card:#171E26;--ink:#F2F5F7;--ink2:#A7B1BB;--ink3:#6C7782;--rule:#27313B;
  --blue:#2F86DD;--blue-deep:#1B5FA8;--blue-soft:#12304D;--on-blue:#FFFFFF;
  --green:#3CC08F;--green-soft:#103527;--amber:#F5C04E;--amber-soft:#3A2C0B;--red:#FF6B5C;
}
@media (prefers-color-scheme:dark){html[data-theme=auto]{
  --paper:#0D1217;--card:#171E26;--ink:#F2F5F7;--ink2:#A7B1BB;--ink3:#6C7782;--rule:#27313B;
  --blue:#2F86DD;--blue-deep:#1B5FA8;--blue-soft:#12304D;--on-blue:#FFFFFF;
  --green:#3CC08F;--green-soft:#103527;--amber:#F5C04E;--amber-soft:#3A2C0B;--red:#FF6B5C;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(var(--tab) + 170px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
[data-a]{cursor:pointer}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

main{padding:10px 16px 0;max-width:560px;margin:0 auto}
.title{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:10px 2px 14px}
.title h1{font-size:28px;font-weight:800;line-height:1.2;margin:0;letter-spacing:.01em}
.title .aside{font-size:13px;color:var(--ink2);padding-bottom:5px;text-align:right}
.label{font-size:13px;color:var(--ink2);margin:18px 4px 6px;display:flex;justify-content:space-between;gap:8px}
.hint{font-size:12px;color:var(--ink3);margin:6px 4px 0}
.card{background:var(--card);border-radius:16px;overflow:hidden}
.pad{padding:14px 16px}
.empty{text-align:center;color:var(--ink2);padding:34px 16px;font-size:15px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* 便の切り替え */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--rule);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-size:15px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.shift{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.shift button{border:2px solid var(--rule);background:var(--card);border-radius:14px;padding:10px 14px;text-align:left;display:flex;align-items:center;gap:8px;color:var(--ink2)}
.shift button b{font-size:18px;font-weight:800;color:var(--ink)}
.shift button .n{font-size:20px;font-weight:700;margin-left:auto}
.shift button small{font-size:12px}
.shift button.on{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.shift button.on b{color:var(--on-blue)}
.shift .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink3);flex:none;display:flex;align-items:center;justify-content:center}
.shift .on .dot{border-color:var(--on-blue);background:var(--on-blue);color:var(--blue)}
.shift .dot svg{width:14px;height:14px;stroke-width:3;display:none}
.shift .on .dot svg{display:block}

/* 検索 */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 6px 0 14px;height:54px;border:2px solid transparent}
.search:focus-within{border-color:var(--blue)}
.search svg{color:var(--ink3)}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:18px;color:var(--ink);outline:none;height:100%}
.search input::placeholder{color:var(--ink3);font-size:16px}
.clear{border:0;background:var(--rule);color:var(--ink2);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-right:6px}
.clear svg{width:14px;height:14px;color:inherit}
.quick{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:0;background:var(--card);border-radius:999px;padding:8px 14px 8px 10px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap}
.quick svg{width:16px;height:16px;color:var(--blue)}
.cand{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;border-top:1px solid var(--rule)}
.cand:first-child{border-top:0}
.cand .nm{font-weight:700;line-height:1.35}
.cand .ad{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plus{width:34px;height:34px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:flex;align-items:center;justify-content:center;flex:none}
.plus svg{width:18px;height:18px}
.chip{display:inline-block;font-size:12px;line-height:1;padding:4px 8px;border-radius:6px;background:var(--blue-soft);color:var(--blue);white-space:nowrap;vertical-align:2px;font-weight:600}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.green{background:var(--green-soft);color:var(--green)}
.grow{flex:1;min-width:0}

/* 配達先の行（路線図ふう）。左スワイプで削除、長押しで並べ替え */
.srow{position:relative;background:var(--red);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.srow .row-del{position:absolute;right:0;top:0;bottom:0;width:88px;border:0;background:var(--red);color:#fff;font-size:15px;font-weight:700}
.row-body{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);padding:0 12px 0 0;min-height:62px;touch-action:pan-y;transition:transform .18s ease}
.rail{position:relative;align-self:stretch;width:56px;flex:none;display:flex;align-items:center;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;background:var(--blue)}
.noline .rail::before{display:none}
.srow.first .rail::before{top:50%}
.srow.last .rail::before{bottom:50%}
.srow.done .rail::before{background:var(--green)}
.node{position:relative;width:30px;height:30px;border-radius:50%;background:var(--card);border:3px solid var(--blue);color:var(--blue);display:flex;align-items:center;justify-content:center;font:700 15px/1 var(--num)}
.srow.done .node{border-color:var(--green);background:var(--green);color:#fff}
.srow.term .node{border-radius:8px;background:var(--ink);border-color:var(--ink);color:var(--paper);font:700 13px/1 -apple-system,"Hiragino Sans",sans-serif}
.srow .txt{flex:1;min-width:0;padding:10px 0;border-bottom:1px solid var(--rule);align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.srow.last .txt,.srow:last-child .txt{border-bottom:0}
.srow .nm{font-weight:600;line-height:1.35}
.srow .ad{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .side{font:700 17px/1 var(--num);color:var(--ink2);flex:none}
.grip{color:var(--ink3);display:flex;flex:none}
.grip svg{width:20px;height:20px}
.flag{border:0;background:transparent;color:var(--ink3);padding:8px 4px;display:flex;flex:none}
.flag.on{color:var(--amber)}
.flag.on svg{fill:currentColor}
.srow.sortable-chosen .row-body{box-shadow:0 8px 24px rgba(0,0,0,.25);border-radius:12px;transform:scale(1.02)}
.srow.sortable-ghost{opacity:.25}
.sortable-fallback{border-radius:12px;overflow:hidden}

/* 青い案内標識のパネル：いま一番大事なこと */
.sign{background:var(--blue);color:var(--on-blue);border-radius:20px;padding:18px 18px 16px;position:relative}
.sign .eyebrow{font-size:13px;opacity:.85;display:flex;justify-content:space-between;gap:8px}
.sign .name{font-size:30px;font-weight:800;line-height:1.25;margin:6px 0 4px;letter-spacing:.01em;word-break:break-all}
.sign .addr{font-size:14px;opacity:.9}
.sign .figs{display:flex;gap:22px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.28)}
.sign .fig small{display:block;font-size:12px;opacity:.85}
.sign .fig b{font:700 30px/1.15 var(--num)}
.sign .fig b span{font:600 14px/1 -apple-system,"Hiragino Sans",sans-serif;margin-left:2px}
.steps{display:flex;gap:3px;margin:0 2px 12px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--rule)}
.steps i.d{background:var(--green)}
.steps i.c{background:var(--blue)}
.memo{background:var(--amber-soft);color:var(--amber);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:16px;font-weight:600;line-height:1.5}
.memo .tg{display:inline-block;border:1.5px solid currentColor;border-radius:6px;padding:0 7px;margin:0 6px 4px 0;font-size:14px}
.memo .nt{font-weight:500}
.prevbar{display:flex;align-items:center;gap:10px;background:var(--green-soft);color:var(--green);border-radius:12px;padding:8px 8px 8px 12px;margin-bottom:10px;font-size:14px;font-weight:600}
.prevbar button{border:0;background:var(--card);color:var(--ink2);border-radius:8px;padding:6px 10px;font-size:13px;flex:none}

#map{height:240px;border-radius:16px;margin-top:10px;z-index:0;background:var(--rule)}
.mk{width:26px;height:26px;border-radius:50%;background:#0A5FB4;color:#fff;font:700 13px/1 var(--num);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.45)}
.mk.done{background:#8a919c}.mk.cur{background:#D93A2B}.mk.dep{background:#101820;border-radius:7px;font-size:12px}

/* 下の操作バーとタブ */
.bar{position:fixed;left:0;right:0;bottom:calc(var(--tab) + env(safe-area-inset-bottom));z-index:6;padding:10px 16px 10px;background:linear-gradient(to top,var(--paper) 78%,transparent)}
.bar>div{max-width:528px;margin:0 auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;background:var(--card);color:var(--ink);font-weight:700;font-size:16px;padding:14px 8px;min-height:50px}
.btn.primary{background:var(--blue);color:var(--on-blue);font-size:20px;min-height:62px;border-radius:18px}
.btn.go{background:var(--green);color:#fff;font-size:20px;min-height:62px;border-radius:18px}
.btn.quiet{background:transparent;color:var(--ink2);font-weight:600}
.btn.danger{color:var(--red)}
.btn:active{transform:scale(.98);filter:brightness(.96)}
.more{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:8px}
.more .btn{font-size:15px;font-weight:600;min-height:46px;padding:10px 4px;border:1px solid var(--rule)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:7;height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{border:0;background:transparent;color:var(--ink3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600}
.tabbar button.on{color:var(--blue)}
.tabbar svg.ic{width:24px;height:24px}

/* シート・トースト */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--paper);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto 12px}
.sheet h2{font-size:20px;font-weight:800;margin:0 2px 12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:0;padding:14px 16px;border-top:1px solid var(--rule)}
.opt:first-child{border-top:0}
.opt b{display:block;font-size:17px;font-weight:700}.opt span{font-size:13px;color:var(--ink2)}
.opt svg{color:var(--blue)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + 150px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:15px;font-weight:600;z-index:30;max-width:92%;display:flex;align-items:center;gap:12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{border:0;background:transparent;color:inherit;font-weight:800;text-decoration:underline;padding:0}
.loading{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700}

/* 振り返り・設定 */
.rv{border-top:1px solid var(--rule)}
.rv:first-child{border-top:0}
.rv-h{display:flex;align-items:center;gap:10px;padding:13px 14px 13px 16px}
.rv-h .nm{font-weight:600;line-height:1.35}
.rv-h .side{font-size:13px;color:var(--ink2);flex:none}
.rv-h svg{color:var(--ink3);transition:transform .15s}
.rv.open .rv-h svg{transform:rotate(90deg)}
.rv-b{padding:0 16px 16px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tag{border:1.5px solid var(--rule);background:transparent;color:var(--ink2);font-size:14px;font-weight:600;padding:7px 12px;border-radius:999px}
.tag.on{background:var(--amber-soft);color:var(--amber);border-color:transparent}
textarea,.field{font:inherit;font-size:16px;width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);outline:none}
textarea{min-height:76px;resize:none}
textarea:focus,.field:focus{border-color:var(--blue)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule)}
.sum div{background:var(--card);padding:12px 14px}
.sum small{display:block;font-size:12px;color:var(--ink2)}
.sum b{font:700 24px/1.2 var(--num)}
.sum b span{font:600 13px/1 -apple-system,"Hiragino Sans",sans-serif;margin-left:2px}
.set{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--rule)}
.set:first-child{border-top:0}
.set .k{font-weight:600}.set .v{font-size:13px;color:var(--ink2)}
.mini{border:0;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:14px;border-radius:10px;padding:9px 12px;flex:none}
details{margin-top:16px}
summary{font-size:14px;color:var(--ink2);padding:8px 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="main"></main>
<div class="bar" id="bar" hidden></div>
<nav class="tabbar" id="tabs"></nav>
<div id="overlay"></div>
<script src="vendor/sortable.min.js" defer></script>

<script>
'use strict';
/* =========================================================
   配達ルートアプリ
   データは端末（localStorage）に保存し、スプレッドシートとは Apps Script 経由で裏で同期する
   ========================================================= */
const VERSION = 'v6';
const DWELL_DEFAULT = 6;            // 1件あたりの標準滞在（分）
const AUTO_DONE_METERS = 250;       // アプリに戻った時、この距離以内なら自動で完了
const MAX_WP = 25;                  // Routes API で1回に扱える経由地の上限
const TAG_LIST = ['裏口','右側','左側','駐車しにくい','駐車場あり','昼休みあり','受付に時間がかかる'];
const ROUTE_MASK = 'routes.optimizedIntermediateWaypointIndex,routes.legs.duration,routes.legs.distanceMeters,routes.legs.polyline.encodedPolyline';
const svg = d => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const IC = {
  search: svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  x: svg('<path d="M6 6l12 12M18 6 6 18"/>'),
  check: svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>'),
  grip: svg('<path d="M5 9h14M5 15h14"/>'),
  flag: svg('<path d="M6 21V4h11l-2 4 2 4H6"/>'),
  chev: svg('<path d="m9 6 6 6-6 6"/>'),
  nav: svg('<path d="M12 3 5 20l7-4 7 4z"/>'),
  list: svg('<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>'),
  note: svg('<path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6"/>'),
  gear: svg('<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'),
  here: svg('<circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>'),
  up: svg('<path d="M12 19V5M6 11l6-6 6 6"/>'),
  ban: svg('<circle cx="12" cy="12" r="8"/><path d="m6.5 6.5 11 11"/>')
};

/* ---------- 保存 ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const todayStr = () => new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
function newTrip(s){ return { shift:s, stops:[], order:null, legs:null, legBase:0, idx:0, status:'plan', manual:false, changes:0, startAt:null, endAt:null, predEnd:null, km:null, id:null, navAt:null, pending:null }; }
function newDay(){ return { date: todayStr(), trips: { am: newTrip('am'), pm: newTrip('pm') }, active: null, history: [] }; }
const S = {
  view: 'reg',
  cfg: LS.get('cfg', { url:'', t:'', depot:null }),
  master: LS.get('master', []),
  day: LS.get('day', null) || newDay(),
  queue: LS.get('queue', []),
  shift: new Date().getHours() >= 13 ? 'pm' : 'am',   // 登録画面で選んでいる便
  q: '', sheet: null, showAll: false, showMap: false, revDay: 'today', revOpen: null
};
if (!S.day.history) S.day.history = [];
['am','pm'].forEach(k => { const t = S.day.trips[k]; if (t.status === 'done'){ t.legs = null; S.day.history.push(t); S.day.trips[k] = newTrip(k); if (S.day.active === k) S.day.active = null; } });   // 前の版のデータを引き継ぐ
function applyTheme(){ const th = S.cfg.theme || 'light'; document.documentElement.dataset.theme = th; const dark = th === 'dark' || (th === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); const m = document.getElementById('themeColor'); if (m) m.content = dark ? '#0D1217' : '#F3F5F1'; }
applyTheme();
let flushing = false, returning = false, IDX = null, mapObj = null, mapSeq = 0, leaflet = null, sorters = [], sorting = false, swipedAt = 0;
const save = () => { LS.set('day', S.day); LS.set('cfg', S.cfg); };
const saveMaster = () => { IDX = null; LS.set('master', S.master); };
const byId = id => { if (!IDX) IDX = new Map(S.master.map(p => [p.id, p])); return IDX.get(id); };
const goShift = () => S.day.active || ['am','pm'].find(k => ['ready','run'].includes(S.day.trips[k].status)) || S.shift;
const curTrip = () => S.day.trips[goShift()];
const live = t => t.stops.filter(s => s.state !== 'drop');
const shiftName = k => k === 'am' ? '午前' : '午後';
const dateLabel = s => { const d = new Date(s + 'T12:00:00+09:00'); return `${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`; };

/* 日付が変わったら新しい日にする（前の日は振り返り用に残す） */
function ensureToday(){
  if (S.day.date === todayStr()) return false;
  ['am','pm'].forEach(k => { if (S.day.trips[k].status === 'run') closeTrip(S.day.trips[k], true); });
  if (S.day.history.length) LS.set('prevDay', S.day);
  S.day = newDay(); S.revDay = 'today'; S.sheet = null; save();
  return true;
}

/* 設定はアドレスの #setup= に入れて持ち運ぶ（ホーム画面に追加したアプリは保存場所が別なので、追加する時に一緒に渡す） */
function readSetup(text){
  const m = String(text || '').match(/setup=([^&\s]+)/);
  if (!m) return false;
  try{
    const o = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    if (!o.u || !o.t) return false;
    const fresh = S.cfg.url !== o.u || S.cfg.t !== o.t;
    S.cfg.url = o.u; S.cfg.t = o.t;
    if (o.d && !S.cfg.depot) S.cfg.depot = o.d;
    save();
    return fresh ? 'new' : 'same';
  }catch(e){ return false; }
}
function setupHash(){
  if (!S.cfg.url) return '';
  const o = { u: S.cfg.url, t: S.cfg.t }; if (S.cfg.depot) o.d = S.cfg.depot;
  return '#setup=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(o)))));
}
function keepSetupInUrl(){ try{ if (S.cfg.url) history.replaceState(null, '', location.pathname + setupHash()); }catch(e){} }
(function(){
  if (!/setup=/.test(location.hash)) return;
  const r = readSetup(location.hash);
  if (r === 'new') setTimeout(() => toast('設定を読み込みました'), 300);
  if (r === false) setTimeout(() => toast('設定リンクが読めませんでした'), 300);
})();

/* ---------- 通信（Apps Script） ---------- */
async function api(body){

  const j = await res.json();

async function loadMaster(silent){

  if (!silent) busy('薬局リストを更新中…');

/* 記録は裏で送る。送れなかった分は端末に貯めて、次の機会にまとめて送る */
function enqueue(item){ S.queue.push(item); LS.set('queue', S.queue); flush(); }
async function flush(){
  if (flushing || !S.queue.length || !S.cfg.url) return;
  flushing = true;
  try{
    const batch = S.queue.slice(0, 30);
    const logs = batch.filter(x => x.a === 'log');
    if (logs.length) await api({ a:'log', items: logs.map(x => ({sheet:x.sheet, row:x.row})) });
    for (const x of batch.filter(x => x.a !== 'log')) await api(x);
    S.queue = S.queue.slice(batch.length); LS.set('queue', S.queue);
    flushing = false;
    if (S.queue.length) flush();
  }catch(e){ flushing = false; }
}
window.addEventListener('online', flush);

/* ---------- 検索 ---------- */
/* ひらがな・カタカナ・漢字・住所・電話のどれでも探せるようにする。変換前のひらがなでも当たるよう、読みを併せ持つ */
const kata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const norm = s => kata(String(s||'').normalize('NFKC')).replace(/[\s・\-ー－―（）()「」、。,.]/g,'').replace(/ヶ/g,'ケ').replace(/髙/g,'高').replace(/﨑/g,'崎').replace(/藥/g,'薬').toLowerCase();
const slim = s => s.replace(/薬局|調剤|ヤツキヨク|ヤッキョク|チョウザイ|店$|テン$/g, '');
let NORM = new WeakMap(), YOMI = LS.get('yomi', {});
function keys(p){
  let k = NORM.get(p);
  if (!k){
    const y = String(YOMI[p.id] || ''), yn = y.includes('|') ? y.split('|')[0] : '', ya = y.includes('|') ? y.split('|')[1] : y;
    const n = norm(p.name), kn = norm(p.kana) || norm(yn);
    k = { names: [n, slim(n), kn, slim(kn)].filter(Boolean), addr: norm(p.addr) + '|' + norm(ya), tel: String(p.tel||'').replace(/\D/g,'') };
    NORM.set(p, k);
  }
  return k;
}
function scoreTerm(k, raw){
  const q = slim(norm(raw)) || norm(raw);
  const digits = String(raw).normalize('NFKC').replace(/\D/g,'');
  let sc = 0;
  if (q){
    if (k.names.some(x => x.startsWith(q))) sc = 100;
    else if (k.names.some(x => x.includes(q))) sc = 60;
    else if (q.length >= 2 && k.addr.includes(q)) sc = 25;
  }
  if (digits.length >= 4 && k.tel.includes(digits)) sc = Math.max(sc, 90);
  return sc;
}
/* 空白で区切った言葉は「全部に当てはまる薬局」を探す（例：とまと うらそえ） */
function searchOne(raw){
  const terms = String(raw||'').trim().split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  const usage = LS.get('usage', {});
  const res = [];
  for (const p of S.master){
    const k = keys(p);
    let sum = 0, ok = true;
    for (const t of terms){ const sc = scoreTerm(k, t); if (!sc){ ok = false; break; } sum += sc; }
    if (!ok) continue;
    res.push([sum / terms.length + Math.min(40, (usage[p.id]||0) * 8) + Math.min(10, p.visits||0), p]);
  }
  return res.sort((a,b) => b[0]-a[0]).slice(0, 8).map(x => x[1]);
}
/* 「、」や空白で区切って複数まとめて探す（音声入力向け） */
function tokens(q){
  const out = [];
  for (const c of String(q).split(/[、,，。\n]+/).map(x => x.trim()).filter(Boolean)){
    if (searchOne(c).length){ out.push(c); continue; }
    const parts = c.split(/\s+/).flatMap(x => x.replace(/薬局(?=.)/g, '薬局\u0000').split('\u0000')).map(x => x.trim()).filter(Boolean);
    out.push(...(parts.length ? parts : [c]));
  }
  return out;
}

/* ---------- 距離・時刻・現在地 ---------- */
function meters(a, b){
  const R = 6371000, r = x => x*Math.PI/180;
  const dLat = r(b.lat-a.lat), dLng = r(b.lng-a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const pt = p => (p.plat && p.plng) ? {lat:p.plat, lng:p.plng} : {lat:p.lat, lng:p.lng};
const hm = d => d ? new Date(d).toLocaleTimeString('ja-JP',{hour:'numeric',minute:'2-digit',timeZone:'Asia/Tokyo'}) : '--:--';
const secs = s => Number(String(s||'0s').replace('s','')) || 0;
const mins = sec => Math.max(1, Math.round(sec/60));
function here(){
  return new Promise((ok, ng) => {
    if (!navigator.geolocation) return ng(new Error('位置情報が使えません'));
    navigator.geolocation.getCurrentPosition(p => ok({lat:p.coords.latitude, lng:p.coords.longitude}),
      () => ng(new Error('現在地が取れません（位置情報を許可してください）')), { enableHighAccuracy:true, timeout:10000, maximumAge:20000 });
  });
}

/* ---------- ルート計算 ---------- */
const wp = p => ({ location:{ latLng:{ latitude:p.lat, longitude:p.lng } } });
async function routeCall(origin, list, dest, optimize){
  const body = {
    origin: wp(origin), destination: wp(dest), intermediates: list.map(wp),
    travelMode:'DRIVE', routingPreference:'TRAFFIC_AWARE',
    routeModifiers:{ avoidHighways:true, avoidTolls:true },
    languageCode:'ja-JP', units:'METRIC'
  };
  if (optimize && list.length > 1) body.optimizeWaypointOrder = true;
  const j = await api({ a:'routes', body, mask: ROUTE_MASK });
  const r = j.data.routes && j.data.routes[0];
  if (!r) throw new Error('ルートが見つかりませんでした');
  let ord = list.map((_,i) => i);
  if (body.optimizeWaypointOrder && r.optimizedIntermediateWaypointIndex) ord = r.optimizedIntermediateWaypointIndex;
  return { ord, legs: r.legs || [] };
}
/* 決まった順番のまま道のりを計算する（25件を超えたら分けて呼ぶ） */
async function routeFixed(origin, pts, dest){
  const legs = []; let cur = origin, i = 0;
  for (;;){
    const inter = pts.slice(i, i + MAX_WP); i += inter.length;
    const more = i < pts.length, d = more ? pts[i] : dest;
    if (more) i++;
    const r = await routeCall(cur, inter, d, false);
    legs.push(...r.legs); cur = d;
    if (!more) return legs;
  }
}
/* 直線距離での大まかな巡回順（25件を超える時に、近いもの同士で分けるために使う） */
function roughTour(origin, items){
  const left = items.slice(), out = []; let cur = origin;
  while (left.length){
    let bi = 0, bd = Infinity;
    left.forEach((p,i) => { const d = meters(cur, pt(p)); if (d < bd){ bd = d; bi = i; } });
    cur = pt(left[bi]); out.push(left.splice(bi,1)[0]);
  }
  for (let pass = 0; pass < 3; pass++){
    for (let i = 0; i < out.length-1; i++) for (let k = i+1; k < out.length; k++){
      const a = i ? pt(out[i-1]) : origin, b = pt(out[i]), c = pt(out[k]), d = k+1 < out.length ? pt(out[k+1]) : origin;
      if (meters(a,c) + meters(b,d) < meters(a,b) + meters(c,d) - 1) out.splice(i, k-i+1, ...out.slice(i,k+1).reverse());
    }
  }
  return out;
}
/* origin を出て items（[{id,pin}]）を回り dest へ。fixed なら渡した順のまま。pin は先頭に固定 */
async function planRoute(origin, items, dest, fixed){
  const ps = items.map(s => ({ s, p: byId(s.id) })).filter(x => x.p && x.p.lat);
  const pinned = fixed ? ps : ps.filter(x => x.s.pin), free = fixed ? [] : ps.filter(x => !x.s.pin);
  const seq = [], legs = []; let start = origin;
  if (pinned.length && free.length){
    const last = pt(pinned[pinned.length-1].p);
    legs.push(...await routeFixed(start, pinned.slice(0,-1).map(x => pt(x.p)), last));
    seq.push(...pinned); start = last;
  }
  if (!free.length){
    legs.push(...await routeFixed(start, pinned.map(x => pt(x.p)), dest)); seq.push(...pinned);
  } else if (free.length <= MAX_WP){
    const r = await routeCall(start, free.map(x => pt(x.p)), dest, true);
    seq.push(...r.ord.map(i => free[i])); legs.push(...r.legs);
  } else {
    const back = new Map(free.map(x => [x.p, x]));
    const tour = roughTour(start, free.map(x => x.p));
    const n = Math.ceil(tour.length / MAX_WP), size = Math.ceil(tour.length / n);
    const groups = []; for (let i = 0; i < tour.length; i += size) groups.push(tour.slice(i, i + size));
    for (let g = 0; g < groups.length; g++){
      const isLast = g === groups.length - 1;
      const r = await routeCall(start, groups[g].map(pt), isLast ? dest : pt(groups[g+1][0]), true);
      const ordered = r.ord.map(i => groups[g][i]);
      seq.push(...ordered.map(p => back.get(p)));
      legs.push(...(isLast ? r.legs : r.legs.slice(0, -1)));   // 次の組への区間は、次の計算で引き直す
      start = pt(ordered[ordered.length-1]);
    }
  }
  return { order: seq.map(x => x.s.id), legs: legs.map(l => ({ sec: secs(l.duration), m: l.distanceMeters || 0, poly: (l.polyline && l.polyline.encodedPolyline) || null })) };
}
/* 今の順番を崩さずに、いちばん遠回りにならない位置へ1件はさむ */
function insertBest(ids, id, origin, dest){
  const P = x => { const p = byId(x); return p && p.lat ? pt(p) : null; };
  const c = P(id); if (!c) return ids.concat(id);
  let best = ids.length, bd = Infinity;
  for (let i = 0; i <= ids.length; i++){
    const a = i ? P(ids[i-1]) : origin, b = i < ids.length ? P(ids[i]) : dest;
    if (!a || !b) continue;
    const d = meters(a, c) + meters(c, b) - meters(a, b);
    if (d < bd){ bd = d; best = i; }
  }
  return [...ids.slice(0, best), id, ...ids.slice(best)];
}
const curLeg = (t, i) => (t.legs || [])[i - (t.legBase || 0)];
/* 各配達先の到着予定と、営業所に戻る予定 */
function etas(t){
  const out = [], now = Date.now(); let tm = now;
  for (let i = 0; i < t.order.length; i++){
    if (i < t.idx){ out.push(null); continue; }
    const leg = curLeg(t, i), sec = leg ? leg.sec : 600;
    tm = (i === t.idx && t.navAt) ? Math.max(now, t.navAt + sec*1000) : tm + sec*1000;
    out.push(tm);
    const p = byId(t.order[i]); tm += ((p && p.avg) || DWELL_DEFAULT) * 60000;
  }
  const back = curLeg(t, t.order.length), bsec = back ? back.sec : 600;
  const end = (t.idx >= t.order.length && t.navAt) ? Math.max(now, t.navAt + bsec*1000) : tm + bsec*1000;
  return { list: out, end, backSec: bsec };
}
/* 出発前のルートを作る。ids を渡すとその順番のまま（手で並べた順） */
async function buildRoute(shift, ids){
  const t = S.day.trips[shift];
  let items = live(t);
  if (!items.length){ toast('配達先を登録してください'); return; }
  if (!S.cfg.depot){ toast('先に営業所の場所を登録してください'); S.view = 'set'; render(); return; }
  const other = S.day.trips[shift === 'am' ? 'pm' : 'am'];
  if (other.status === 'run') closeTrip(other, false);
  const fixed = !!ids;
  if (fixed) items = ids.map(id => items.find(s => s.id === id)).filter(Boolean);
  const noPos = items.filter(s => { const p = byId(s.id); return !p || !p.lat; });
  if (noPos.length) toast(noPos.length + '件は場所が分からないので外しました');
  if (toastEl) toastEl.remove();
  busy(fixed ? '時間を計算中…' : '最短ルートを計算中…');
  try{
    const r = await planRoute(S.cfg.depot, items.filter(s => !noPos.includes(s)), S.cfg.depot, fixed);
    Object.assign(t, { order: r.order, legs: r.legs, legBase: 0, idx: 0, status: 'ready', navAt: null, manual: fixed,
                       km: Math.round(r.legs.reduce((a,l) => a + l.m, 0) / 100) / 10 });
    S.day.active = shift; S.view = 'go'; S.sheet = null; save();
  }catch(e){ toast(e.message === 'Failed to fetch' ? '通信できませんでした。電波を確認してね' : e.message); }
  busy(false); render();
}
/* 配達中に残りを組み直す。opt: {ids, firstId, lastId, fixed, target} */
async function reroute(kind, opt){
  opt = opt || {};
  const t = curTrip();
  const ids = (opt.ids || t.order.slice(t.idx)).slice();
  const lastId = (opt.lastId && ids.length > 1) ? opt.lastId : null;
  let fallback = ids.slice();
  if (opt.firstId) fallback = [opt.firstId, ...fallback.filter(x => x !== opt.firstId)];
  if (lastId) fallback = [...fallback.filter(x => x !== lastId), lastId];
  busy('組み直し中…');
  let pos = null;
  try{
    pos = await here().catch(() => null);
    const origin = pos || (t.idx ? pt(byId(t.order[t.idx-1])) : S.cfg.depot);
    const r = await planRoute(origin, fallback.filter(id => id !== lastId).map(id => ({ id, pin: id === opt.firstId })), lastId ? pt(byId(lastId)) : S.cfg.depot, !!opt.fixed);
    let order = r.order, legs = r.legs;
    if (lastId){ const b = await planRoute(pt(byId(lastId)), [], S.cfg.depot, true); order = order.concat(lastId); legs = legs.concat(b.legs); }
    fallback.forEach(id => { if (!order.includes(id)) order.push(id); });
    t.order = t.order.slice(0, t.idx).concat(order); t.legs = legs;
  }catch(e){
    t.order = t.order.slice(0, t.idx).concat(fallback); t.legs = [];
    toast('通信できないので、順番だけ変えました');
  }
  if (opt.manual !== undefined) t.manual = opt.manual;
  t.legBase = t.idx; t.changes++; t.navAt = null;
  logChange(kind, opt.target || opt.firstId || lastId || '', pos);
  save(); busy(false); render();
}
/* 配達先を1件足す（登録中・出発前・配達中のどれでも） */
function addToTrip(t, id){
  const other = S.day.trips[t.shift === 'am' ? 'pm' : 'am'];
  const old = t.stops.find(s => s.id === id);
  if ((old && old.state !== 'drop') || other.stops.some(s => s.id === id && s.state !== 'drop')){ toast('もう入っています'); return false; }
  const u = LS.get('usage', {}); u[id] = (u[id]||0) + 1; LS.set('usage', u);
  if (old){ old.state = 'todo'; old.added = true; } else t.stops.push({ id, pin:false, state:'todo', added: t.status === 'run' });
  save();
  if (t.status === 'run'){
    const rest = t.order.slice(t.idx);
    if (t.manual) reroute('追加', { ids: insertBest(rest, id, null, S.cfg.depot), fixed:true, target:id });
    else reroute('追加', { ids: rest.concat(id), target:id });
  } else if (t.status === 'ready'){
    buildRoute(t.shift, t.manual ? insertBest(t.order, id, S.cfg.depot, S.cfg.depot) : null);
  } else { t.order = null; save(); }
  return true;
}

/* ---------- 配達の進行 ---------- */
function startTrip(){
  const t = curTrip();
  const n = S.day.history.filter(h => h.shift === t.shift).length;
  Object.assign(t, { status:'run', startAt: Date.now(), idx: 0, legBase: 0, navAt: null, pending: null, id: S.day.date + '-' + t.shift + (n ? '-' + (n + 1) : '') });
  const e = etas(t);
  t.predEnd = e.end;
  t.order.forEach((id, i) => { const st = t.stops.find(s => s.id === id); if (st){ st.plan = i + 1; st.eta0 = e.list[i]; } });
  S.day.active = t.shift; S.showAll = false; save(); render(); window.scrollTo(0, 0);
}
const mapsUrl = d => 'https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination=' + d.lat + ',' + d.lng;
function navTo(dest){
  const t = curTrip();
  settle(t, Date.now());
  if (!t.navAt) t.navAt = Date.now();
  save(); render();
  location.href = mapsUrl(dest);
}
/* 完了にする。記録の確定（滞在時間）は「次へ出発した時」に行う（settle） */
function complete(auto){
  const t = curTrip(); const id = t.order[t.idx]; if (!id) return;
  settle(t, null);
  const now = Date.now(), leg = curLeg(t, t.idx);
  const st = t.stops.find(s => s.id === id);
  Object.assign(st, { state:'done', doneAt: now, seq: t.idx + 1, auto: !!auto,
                      arrAt: (t.navAt && leg) ? Math.min(now, t.navAt + leg.sec*1000) : now });
  t.pending = id; t.idx++; t.navAt = null; S.sheet = null; save();
  const p = byId(id);
  if (p){ p.visits = (p.visits||0) + 1; p.last = S.day.date; saveMaster(); }
  render(); window.scrollTo(0, 0);
}
/* まちがえて完了になった時に、ひとつ戻す（次へ出発する前だけ） */
function undoDone(){
  const t = curTrip(); if (!t.pending || t.idx < 1 || t.order[t.idx-1] !== t.pending) return;
  const st = t.stops.find(s => s.id === t.pending);
  Object.assign(st, { state:'todo', doneAt:null, seq:null, arrAt:null, auto:false });
  const p = byId(st.id); if (p && p.visits){ p.visits--; saveMaster(); }
  t.pending = null; t.idx--; t.navAt = null; save(); render();
}
function settle(t, departAt){
  if (!t.pending) return;
  const st = t.stops.find(s => s.id === t.pending); t.pending = null;
  if (!st) return;
  const d = Math.round(((departAt || st.doneAt) - st.arrAt) / 60000);
  st.dwell = (d >= 1 && d <= 90) ? d : null;
  const p = byId(st.id);
  enqueue({ a:'log', sheet:'配達記録', row:[t.id, S.day.date, st.id, p ? p.name : '', st.plan || '', st.seq, st.eta0 ? hm(st.eta0) : '', hm(st.doneAt), st.dwell === null ? '' : st.dwell, (st.auto ? '完了(自動)' : '完了') + (st.added ? '・追加' : ''), st.pin ? '優先' : ''] });
  enqueue({ a:'visit', id: st.id, dwell: st.dwell, date: S.day.date });
  save();
}
function skipLater(){
  const t = curTrip();
  if (t.order.length - t.idx < 2){ toast('これが最後の1件です'); return; }
  reroute('後回し', { lastId: t.order[t.idx], fixed: t.manual });
}
function dropStop(id){
  const t = curTrip();
  const st = t.stops.find(s => s.id === id); if (!st) return;
  st.state = 'drop';
  const p = byId(id);
  enqueue({ a:'log', sheet:'配達記録', row:[t.id, S.day.date, id, p ? p.name : '', st.plan || '', '', st.eta0 ? hm(st.eta0) : '', '', '', '今日は行かない', ''] });
  reroute('今日は行かない', { ids: t.order.slice(t.idx).filter(x => x !== id), fixed:true, target:id });
}
/* 便を終える：記録を送り、履歴に移して、同じ枠で次の便を登録できるようにする */
function closeTrip(t, stale){
  settle(t, stale ? null : Date.now());
  const lastDone = Math.max(0, ...t.stops.map(s => s.doneAt || 0));
  t.status = 'done'; t.endAt = stale ? (lastDone || t.startAt) : Date.now(); t.navAt = null;
  enqueue({ a:'log', sheet:'便の記録', row:[t.id, S.day.date, shiftName(t.shift), hm(t.startAt), stale ? '(終了を押し忘れ)' : hm(t.endAt), t.stops.filter(s => s.state === 'done').length, hm(t.predEnd), hm(t.endAt), t.km || '', t.changes] });
  t.legs = null;
  S.day.history.push(t);
  S.day.trips[t.shift] = newTrip(t.shift);
  if (S.day.active === t.shift) S.day.active = null;
  save();
}
function finishTrip(){
  closeTrip(curTrip(), false);
  S.view = 'rev'; S.revDay = 'today'; S.sheet = null; S.showMap = false; render(); window.scrollTo(0, 0);
  toast('おつかれさまでした');
}
function logChange(kind, id, pos){
  const t = curTrip();
  enqueue({ a:'log', sheet:'変更の記録', row:[t.id || '', new Date().toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}), kind, id || '', pos ? pos.lat : '', pos ? pos.lng : ''] });
}
/* アプリに戻ってきた時：ナビ中の行き先の近くにいれば自動で完了にする */
async function onReturn(){
  if (returning) return; returning = true;
  try{
    const changed = ensureToday(); flush();
    const t = S.day.active && S.day.trips[S.day.active];
    if (t && t.status === 'run' && t.navAt){
      const pos = await here().catch(() => null);
      const id = t.order[t.idx], p = id && byId(id);
      if (pos && p && meters(pos, pt(p)) <= AUTO_DONE_METERS){ complete(true); return; }
      if (pos && !id && S.cfg.depot && meters(pos, S.cfg.depot) <= AUTO_DONE_METERS){ finishTrip(); return; }
    }
    if (changed || (S.view === 'go' && !S.sheet && !sorting)) render();
  } finally { returning = false; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') onReturn(); });
window.addEventListener('pageshow', ev => { if (ev.persisted) onReturn(); });

/* ---------- 地図（Leaflet + OpenStreetMap。使う時だけ読み込む） ---------- */
function loadLeaflet(){
  if (leaflet) return leaflet;
  leaflet = new Promise((ok, ng) => {
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'vendor/leaflet.css';
    const js = document.createElement('script'); js.src = 'vendor/leaflet.js';
    let n = 0; const done = () => { if (++n === 2) ok(); };
    css.onload = done; js.onload = done;
    css.onerror = js.onerror = () => { leaflet = null; ng(new Error('map')); };
    document.head.append(css, js);
  });
  return leaflet;
}
function decodePoly(str){
  const out = []; let i = 0, lat = 0, lng = 0;
  while (i < str.length){
    for (const k of [0, 1]){
      let b, shift = 0, r = 0;
      do { b = str.charCodeAt(i++) - 63; r |= (b & 31) << shift; shift += 5; } while (b >= 32);
      const d = (r & 1) ? ~(r >> 1) : (r >> 1);
      if (k === 0) lat += d; else lng += d;
    }
    out.push([lat / 1e5, lng / 1e5]);
  }
  return out;
}
async function drawMap(){
  const my = ++mapSeq;
  try{ await loadLeaflet(); }catch(e){ const el = document.getElementById('map'); if (el) el.outerHTML = '<p class="hint">地図を読み込めませんでした</p>'; return; }
  const el = document.getElementById('map');
  if (my !== mapSeq || !el) return;
  if (mapObj){ try{ mapObj.remove(); }catch(e){} mapObj = null; }
  const t = curTrip(); if (!t.order) return;
  const L = window.L, e = etas(t), dep = S.cfg.depot;
  const m = mapObj = L.map(el, { zoomControl:false });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap' }).addTo(m);
  const icon = (cls, txt) => L.divIcon({ className:'', html:`<div class="mk ${cls}">${txt}</div>`, iconSize:[26,26], iconAnchor:[13,13] });
  const at = i => { if (i < 0 || i >= t.order.length) return dep; const p = byId(t.order[i]); return p && p.lat ? pt(p) : null; };
  const all = [];
  for (let i = t.idx; i <= t.order.length; i++){
    const leg = curLeg(t, i), a = at(i - 1), b = at(i);
    const line = (leg && leg.poly) ? decodePoly(leg.poly) : (a && b && (i > t.idx || t.status !== 'run')) ? [[a.lat,a.lng],[b.lat,b.lng]] : null;
    if (line) L.polyline(line, { color:'#0A5FB4', weight:4, opacity:.85, dashArray: (leg && leg.poly) ? null : '6 8' }).addTo(m);
  }
  if (dep){ L.marker([dep.lat, dep.lng], { icon: icon('dep','営') }).addTo(m).bindPopup('営業所'); all.push([dep.lat, dep.lng]); }
  t.order.forEach((id, i) => {
    const p = byId(id), c = at(i); if (!c) return;
    const cls = i < t.idx ? 'done' : (i === t.idx && t.status === 'run') ? 'cur' : '';
    L.marker([c.lat, c.lng], { icon: icon(cls, i + 1), zIndexOffset: cls === 'cur' ? 1000 : cls === 'done' ? -500 : 0 }).addTo(m)
      .bindPopup(`${i + 1}. ${esc(p.name)}${e.list[i] ? '<br>着く予定 ' + hm(e.list[i]) : '<br>完了'}`);
    if (i >= t.idx || t.status !== 'run') all.push([c.lat, c.lng]);
  });
  if (all.length) m.fitBounds(all, { padding:[28,28], maxZoom:16 });
}

          <div class="tags">${TAG_LIST.map(x => `<button class="tag ${tg.includes(x)?'on':''}" data-a="tag" data-tag="${esc(x)}" data-id="${s.id}">${esc(x)}</button>`).join('')}</div>
          <textarea data-note="${s.id}" placeholder="気づいたこと（マイクで話してもOK）">${esc(p.note||'')}</textarea>
          <div class="more" style="margin-top:10px"><button class="btn" data-a="park" data-id="${s.id}">${IC.here}${p.plat ? '駐車位置を今の場所に直す' : '今いる場所を駐車位置にする'}</button></div>
        </div>` : ''}
      </div>`; }).join('')}</div>
      <p class="hint">書いたメモは、次にその薬局へ行く時に配達の画面に出ます。</p>`
    : `<div class="empty"><b>まだ回った薬局がありません</b>配達が終わると、ここで薬局ごとのメモを書けます。</div>`}`;
  setBar('');
}

/* ---------- 設定 ---------- */
function vSet(){
  const d = S.cfg.depot, at = LS.get('masterAt', 0);
  $('#main').innerHTML = title('設定') + `
    ${S.cfg.url ? '' : `<div class="memo" style="margin-bottom:12px">まだ使えません。設定リンク（QRコードのリンク）をコピーして、下の「設定リンクを貼り付け」に入れてください。</div>`}
    <div class="card">
      <div class="set"><div class="grow"><div class="k">営業所の場所</div><div class="v">${d ? '登録済み。出発と戻りの場所になります' : '未登録。営業所にいる時に押してください'}</div></div><button class="mini" data-a="setDepot">${d ? '今の場所に直す' : '今の場所を登録'}</button></div>
      <div class="set"><div class="grow"><div class="k">薬局リスト <span class="n">${S.master.length}</span>件</div><div class="v">${at ? new Date(at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'}) + ' に更新' : 'まだ読み込んでいません'}</div></div><button class="mini" data-a="reload">更新</button></div>
      <div class="set"><div class="grow"><div class="k">記録の送信</div><div class="v">${S.queue.length ? '未送信が' + S.queue.length + '件あります' : 'すべて保存済み'}</div></div>${S.queue.length ? `<button class="mini" data-a="flushNow">今すぐ送る</button>` : ''}</div>
    </div>
    <div class="label"><span>画面の色</span></div>
    <div class="seg three">${[['light','明るい'],['dark','暗い'],['auto','自動']].map(([k,l]) => `<button data-a="theme" data-th="${k}" class="${(S.cfg.theme||'light')===k?'on':''}">${l}</button>`).join('')}</div>
    <div class="label"><span>ホーム画面のアプリに設定を移す</span></div>
    <div class="card pad">
      <input class="field" id="cLink" placeholder="設定リンクを貼り付け" autocomplete="off">
      <div class="more"><button class="btn" data-a="pasteSetup">読み込む</button><button class="btn" data-a="copySetup">設定リンクをコピー</button></div>
    </div>
    <details><summary>くわしい設定</summary>
      <div class="card pad">
        <div class="v" style="font-size:13px;color:var(--ink2);margin-bottom:4px">Apps Script のURL</div><input class="field" id="cUrl" value="${esc(S.cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec">
        <div class="v" style="font-size:13px;color:var(--ink2);margin:10px 0 4px">合言葉</div><input class="field" id="cTok" value="${esc(S.cfg.t)}">
        <div class="more"><button class="btn" data-a="saveCfg">保存して確認</button></div>
      </div>
      <button class="btn quiet danger" data-a="resetDay" style="margin-top:10px">今日の配達をすべて消す</button>
    </details>
    <p class="hint">Googleマップの設定でも「高速道路を使わない」をオンにすると、ナビがこのアプリと同じ道になります。</p>
    <p class="hint">配達ルート ${VERSION}</p>`;
  setBar('');
}

/* ---------- 下から出るシート ---------- */
function renderSheet(){
  const o = $('#overlay'); if (o.querySelector('.loading')) return;
  if (!S.sheet){ o.innerHTML = ''; return; }
  const t = curTrip();
  const wrap = body => `<div class="sheet-bg" data-a="close"><div class="sheet">${body}<button class="btn quiet" data-a="close" style="margin-top:6px">閉じる</button></div></div>`;
  if (S.sheet === 'change'){
    const cur = byId(t.order[t.idx]);
    o.innerHTML = wrap(`<h2>その他</h2><div class="card">
      <button class="opt" data-a="rr">${IC.here}<div><b>今いる場所から最短に組み直す</b><span>渋滞や寄り道のあとに</span></div></button>
      <button class="opt" data-a="sheet" data-s="first">${IC.up}<div><b>先に行く薬局を選ぶ</b><span>選んだ薬局を次にします</span></div></button>
      <button class="opt" data-a="sheet" data-s="add">${IC.plus}<div><b>薬局を追加</b><span>名前で探して、ルートに入れます</span></div></button>
      ${cur ? `<button class="opt" data-a="done">${IC.check}<div><b>${esc(cur.name)} を完了にする</b><span>ナビを使わずに配達した時</span></div></button>
      <button class="opt" data-a="drop" data-id="${cur.id}">${IC.ban}<div><b>${esc(cur.name)} は今日行かない</b><span>リストから外します</span></div></button>` : ''}
      <button class="opt" data-a="toggleMap">${IC.nav}<div><b>${S.showMap ? '地図を閉じる' : '地図を見る'}</b><span>残りの配達先を地図で確認</span></div></button>
      <button class="opt" data-a="cancelTrip" style="color:var(--red)">${IC.x.replace('class="ic"','class="ic" style="color:var(--red)"')}<div><b>この便をやめる</b><span>登録の画面に戻って、やり直します</span></div></button>
    </div>`);
  } else if (S.sheet === 'first'){
    o.innerHTML = wrap(`<h2>先に行く薬局を選ぶ</h2><div class="card noline">${t.order.slice(t.idx).map((id, i) => `<div data-a="first" data-id="${id}">${stopRow({ num: t.idx + i + 1, name: byId(id)?.name || id })}</div>`).join('')}</div>`);
  } else if (S.sheet === 'add'){
    o.innerHTML = wrap(`<h2>薬局を追加</h2><div class="search">${IC.search}<input id="aq" placeholder="薬局名・電話番号で探す" autocomplete="off" autocorrect="off"></div><div id="acands" style="min-height:120px"></div>`);
    const aq = $('#aq'); aq.focus();
    aq.oninput = () => { const r = searchOne(aq.value); $('#acands').innerHTML = aq.value.trim() ? `<div style="height:8px"></div><div class="card">${r.map(p => `<div class="cand" data-a="addrun" data-id="${p.id}"><div class="grow"><div class="nm">${esc(p.name)}</div><div class="ad">${esc(shortAddr(p.addr))}</div></div><span class="plus">${IC.plus}</span></div>`).join('') || '<div class="cand"><div class="grow"><div class="nm">見つかりません</div></div></div>'}</div>` : ''; };
  }
}

/* 新しい薬局をリストに登録 */
async function newPharmacy(name){
  const nm = prompt('薬局名', name || ''); if (!nm) return;
  const addr = prompt('住所（伝票の住所をそのまま）', '沖縄県'); if (!addr || addr === '沖縄県') return;
  busy('登録中…');
  try{
    const j = await api({ a:'add', name:nm, addr });
    S.master.push(j.row); saveMaster();
    if (!j.row.lat) toast('住所から場所が分かりませんでした。住所を確かめてね');
    S.q = ''; busy(false); addToTrip(S.day.trips[S.shift], j.row.id);
  }catch(e){ toast(e.message); }
  busy(false); render();
}

/* ---------- 並べ替え（長押し）と スワイプ削除 ---------- */
function initSort(){
  sorters.forEach(s => { try{ s.destroy(); }catch(e){} }); sorters = [];
  if (!window.Sortable) return;
  document.querySelectorAll('[data-sort]').forEach(el => {
    if (!el.dataset.sort) return;
    sorters.push(new Sortable(el, {
      draggable: '.srow.can', animation: 160, delay: 260, delayOnTouchOnly: false, touchStartThreshold: 6,
      forceFallback: true, fallbackOnBody: true, fallbackTolerance: 4, filter: '.row-del,.flag', preventOnFilter: false,
      onChoose: () => { sorting = true; closeSwipes(); },
      onUnchoose: () => { sorting = false; },
      onEnd: ev => { sorting = false; if (ev.oldIndex !== ev.newIndex) reorder(el.dataset.sort, [...el.querySelectorAll('.srow[data-id]')].map(x => x.dataset.id)); }
    }));
  });
}
function reorder(kind, ids){
  if (kind === 'reg'){
    const t = S.day.trips[S.shift];
    t.stops = [...ids.map(id => t.stops.find(s => s.id === id)).filter(Boolean), ...t.stops.filter(s => !ids.includes(s.id))];
    t.order = null; t.status = 'plan'; save(); render();
  } else if (kind === 'ready'){
    buildRoute(goShift(), ids);
  } else if (kind === 'run'){
    const t = curTrip(), shown = new Set(ids);
    const rest = t.order.slice(t.idx + 1).filter(id => !shown.has(id));
    reroute('並べ替え', { ids: [t.order[t.idx], ...ids, ...rest], fixed:true, manual:true });
  }
}
const DEL_W = 88;
let sw = null;
function closeSwipes(except){
  document.querySelectorAll('.srow.open').forEach(r => { if (r !== except){ r.classList.remove('open'); r.querySelector('.row-body').style.transform = ''; } });
}
document.addEventListener('pointerdown', e => {
  const body = e.target.closest('.srow.del .row-body');
  closeSwipes(body && body.parentNode);
  if (!body) return;
  const row = body.parentNode;
  sw = { body, row, x: e.clientX, y: e.clientY, base: row.classList.contains('open') ? -DEL_W : 0, on: false, cur: 0, id: e.pointerId, full: !!row.closest('[data-sort="reg"]') };
});
document.addEventListener('pointermove', e => {
  if (!sw || sorting || e.pointerId !== sw.id) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.on){
    if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)){ sw = null; return; }
    if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy) * 1.3) return;
    sw.on = true; sw.body.style.transition = 'none';
    try{ sw.body.setPointerCapture(sw.id); }catch(err){}
  }
  sw.cur = Math.max(-sw.body.offsetWidth, Math.min(0, sw.base + dx));
  sw.body.style.transform = `translateX(${sw.cur}px)`;
});
function endSwipe(e){
  if (!sw || (e && e.pointerId !== sw.id)) return;
  const s = sw; sw = null;
  if (!s.on) return;
  swipedAt = Date.now();
  s.body.style.transition = '';
  if (s.full && s.cur < -s.body.offsetWidth * 0.6){
    s.body.style.transform = 'translateX(-100%)';
    const btn = s.row.querySelector('.row-del');
    setTimeout(() => ACT[btn.dataset.a](btn.dataset, btn), 150);
  } else if (s.cur < -DEL_W / 2){ s.row.classList.add('open'); s.body.style.transform = `translateX(${-DEL_W}px)`; }
  else { s.row.classList.remove('open'); s.body.style.transform = ''; }
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', () => { if (sw && sw.on){ sw.body.style.transition = ''; sw.body.style.transform = sw.row.classList.contains('open') ? `translateX(${-DEL_W}px)` : ''; } sw = null; });

/* ---------- 操作 ---------- */
const ACT = {
  tab: d => { if (toastEl) toastEl.remove(); S.view = d.v; S.sheet = null; if (d.v === 'go') S.showAll = false; if (d.v === 'reg' && S.day.active) S.shift = S.day.active; render(); window.scrollTo(0, 0); },
  shift: d => { S.shift = d.s; render(); },
  clearQ: () => { S.q = ''; render(); $('#q').focus(); },
  add: d => {
    const tk = tokens(S.q);
    S.q = tk.length > 1 ? tk.filter(x => x !== d.tok).join('、') : '';
    addToTrip(S.day.trips[S.shift], d.id); render();
    if (!S.q){ const q = $('#q'); if (q) q.focus(); }
  },
  new: d => newPharmacy(d.tok),
  delReg: d => {
    const t = S.day.trips[S.shift], i = t.stops.findIndex(s => s.id === d.id); if (i < 0) return;
    const [gone] = t.stops.splice(i, 1); t.order = null; t.status = 'plan'; save(); render();
    toast('削除しました', { label:'元に戻す', fn: () => { t.stops.splice(i, 0, gone); t.order = null; save(); render(); } });
  },
  delReady: d => {
    const t = curTrip(); t.stops = t.stops.filter(s => s.id !== d.id);
    const ids = t.order.filter(x => x !== d.id);
    if (!ids.length){ Object.assign(t, { order:null, legs:null, status:'plan' }); save(); S.view = 'reg'; S.shift = t.shift; render(); return; }
    save(); buildRoute(t.shift, ids);
  },
  delRun: d => dropStop(d.id),
  delRegRun: d => { S.day.active = S.shift; dropStop(d.id); },
  clearAll: () => {
    const t = S.day.trips[S.shift], keep = t.stops.slice(); if (!keep.length) return;
    Object.assign(t, { stops: [], order: null, status: 'plan' }); save(); render();
    toast(keep.length + '件を消しました', { label:'元に戻す', fn: () => { t.stops = keep; save(); render(); } });
  },
  cancelTrip: () => {
    const t = S.day.trips[S.day.active || S.shift];
    if (t.status !== 'run' && t.status !== 'ready') return;
    if (!confirm('この便をやめて、登録からやり直しますか？\n（配達先のリストは残ります）')) return;
    if (t.status === 'run') logChange('便をやめた', '', null);
    t.stops = live(t); t.stops.forEach(s => Object.assign(s, { state:'todo', doneAt:null, seq:null, arrAt:null, dwell:null }));
    Object.assign(t, { status:'plan', order:null, legs:null, legBase:0, idx:0, navAt:null, pending:null, startAt:null, manual:false, changes:0 });
    S.shift = t.shift; S.day.active = null; S.sheet = null; S.view = 'reg'; save(); render(); window.scrollTo(0, 0);
  },
  pin: d => { const t = S.day.trips[S.shift], s = t.stops.find(s => s.id === d.id); s.pin = !s.pin; t.order = null; t.status = 'plan'; save(); render(); },
  move: () => { const from = S.day.trips[S.shift], to = S.day.trips[S.shift === 'am' ? 'pm' : 'am']; if (to.status === 'run'){ toast('配達中の便には移せません'); return; } to.stops.push(...from.stops); from.stops = []; from.order = to.order = null; from.status = to.status = 'plan'; S.shift = to.shift; save(); render(); },
  build: () => buildRoute(S.shift),
  buildFixed: () => buildRoute(S.shift, live(S.day.trips[S.shift]).map(s => s.id)),
  rebuild: () => buildRoute(goShift()),
  edit: () => { S.shift = goShift(); S.view = 'reg'; render(); window.scrollTo(0, 0); },
  start: () => startTrip(),
  nav: () => { const t = curTrip(), p = byId(t.order[t.idx]); if (p) navTo(pt(p)); },
  navDepot: () => navTo(S.cfg.depot),
  finish: () => finishTrip(),
  later: () => skipLater(),
  done: () => complete(false),
  undoDone: () => undoDone(),
  sheet: d => { S.sheet = d.s; renderSheet(); },
  close: () => { S.sheet = null; renderSheet(); },
  rr: () => { S.sheet = null; reroute('組み直し', { manual:false }); },
  first: d => { S.sheet = null; reroute('先に行く', { firstId: d.id, fixed: curTrip().manual }); },
  drop: d => { S.sheet = null; dropStop(d.id); },
  addrun: d => { S.sheet = null; renderSheet(); addToTrip(curTrip(), d.id); },
  toggleAll: () => { S.showAll = !S.showAll; render(); },
  toggleMap: () => { S.showMap = !S.showMap; S.sheet = null; render(); if (S.showMap) setTimeout(() => { const m = document.getElementById('map'); if (m) m.scrollIntoView({ behavior:'smooth', block:'center' }); }, 60); },
  revDay: d => { S.revDay = d.d; S.revOpen = null; render(); },
  revOpen: d => { S.revOpen = S.revOpen === d.id ? null : d.id; render(); },
  tag: (d, el) => {
    const p = byId(d.id); if (!p) return;
    const tg = tagsOf(p);
    p.tags = (tg.includes(d.tag) ? tg.filter(x => x !== d.tag) : tg.concat(d.tag)).join('、');
    saveMaster(); el.classList.toggle('on'); enqueue({ a:'note', id:p.id, tags:p.tags });
  },
  park: async d => {
    try{ const pos = await here(); const p = byId(d.id); p.plat = pos.lat; p.plng = pos.lng; saveMaster(); enqueue({ a:'note', id:p.id, plat:pos.lat, plng:pos.lng }); toast('駐車位置を保存しました'); render(); }
    catch(e){ toast(e.message); }
  },
  setDepot: async () => { busy('現在地を取得中…'); try{ S.cfg.depot = await here(); save(); keepSetupInUrl(); toast('営業所を登録しました'); }catch(e){ toast(e.message); } busy(false); render(); },
  theme: d => { S.cfg.theme = d.th; save(); applyTheme(); render(); },
  reload: () => loadMaster(false),
  flushNow: () => { toast('送信しています'); flush().then(() => { if (S.view === 'set') render(); }); },
  resetDay: () => { if (confirm('今日の配達を全部消しますか？（スプレッドシートの記録は残ります）')){ S.day = newDay(); save(); S.view = 'reg'; render(); } },
  pasteSetup: () => {
    const r = readSetup($('#cLink').value);
    if (!r){ toast('設定リンクが読めませんでした'); return; }
    keepSetupInUrl(); loadMaster(false); render();
  },
  copySetup: async () => {
    if (!S.cfg.url){ toast('まだ設定がありません'); return; }
    const link = location.origin + location.pathname + setupHash();
    try{ await navigator.clipboard.writeText(link); toast('設定リンクをコピーしました'); }
    catch(e){ const i = $('#cLink'); i.value = link; i.select(); toast('上の欄を長押ししてコピーしてね'); }
  },
  saveCfg: () => { S.cfg.url = $('#cUrl').value.trim(); S.cfg.t = $('#cTok').value.trim(); save(); keepSetupInUrl(); loadMaster(false); }
};
document.addEventListener('click', ev => {
  if (Date.now() - swipedAt < 350) return;                              // スワイプ直後の誤タップを無視
  const el = ev.target.closest('[data-a]');
  if (!el) return;
  if (el.classList.contains('sheet-bg') && ev.target !== el) return;   // シートの中の空白では閉じない
  const fn = ACT[el.dataset.a];
  if (fn) fn(el.dataset, el);
});
/* 備考は、入力が止まったら保存 */
let noteTimer = null;
document.addEventListener('input', ev => {
  const id = ev.target.dataset && ev.target.dataset.note; if (!id) return;
  const p = byId(id); if (!p) return;
  p.note = ev.target.value; LS.set('master', S.master);
  clearTimeout(noteTimer); noteTimer = setTimeout(() => enqueue({ a:'note', id, note:p.note }), 1200);
});
/* 長押し中に画面が一緒に動かないようにする */
document.addEventListener('touchmove', ev => { if (sorting && ev.cancelable) ev.preventDefault(); }, { passive:false });
window.addEventListener('DOMContentLoaded', initSort);

/* ---------- 起動 ---------- */
ensureToday();
keepSetupInUrl();
if (!S.cfg.url) S.view = 'set';
if (S.day.active && S.day.trips[S.day.active].status === 'run') S.view = 'go';
render();
fetch('yomi.json').then(r => r.json()).then(j => { YOMI = j; LS.set('yomi', j); NORM = new WeakMap(); }).catch(() => {});
if (S.cfg.url && (!S.master.length || Date.now() - LS.get('masterAt', 0) > 6*3600*1000)) loadMaster(true);
onReturn();
</script>
