  const usage = LS.get('usage', {});
  if (!S.q.trim()){
    const have = new Set(['am','pm'].flatMap(k => live(S.day.trips[k]).map(s => s.id)));
    const top = Object.entries(usage).filter(([id]) => !have.has(id) && byId(id)).sort((a, b) => b[1] - a[1]).slice(0, 8);
    return (top.length ? `<div class="quick">${top.map(([id]) => `<button data-a="add" data-id="${id}">${IC.plus}${esc(byId(id).name)}</button>`).join('')}</div>` : '')
      + `<button class="newlink" data-a="sheet" data-s="new">${IC.plus}リストにない所を登録する（名前と住所）</button>`;
  }
  const have = new Set(['am','pm'].flatMap(k => live(S.day.trips[k]).map(s => s.id)));
  const groups = tokens(S.q).map(tok => { const res = searchOne(tok, have); return { tok, res, used: !res.length && searchOne(tok).length }; });
  return groups.map(g => `
    ${groups.length > 1 ? `<div class="label"><span>「${esc(g.tok)}」</span></div>` : '<div style="height:8px"></div>'}
    <div class="card">${g.res.length ? g.res.map(p => `
      <div class="cand" data-a="add" data-id="${p.id}" data-tok="${esc(g.tok)}"><div class="grow"><div class="nm">${esc(p.name)} ${(p.visits || usage[p.id]) ? '<span class="chip">前に行った</span>' : ''}</div><div class="ad">${esc(shortAddr(p.addr))}</div></div><span class="plus">${IC.plus}</span></div>`).join('')
      : g.used ? `<div class="cand allin"><span class="okdot">${IC.check}</span><div class="grow"><div class="nm">「${esc(g.tok)}」は ぜんぶ入れました</div><div class="ad">ほかにもあれば、下から探せます</div></div></div>`
      : `<div class="cand"><div class="grow"><div class="nm">リストにはありません</div><div class="ad">Googleマップから探すか、名前と住所で登録できます</div></div><button class="mini" data-a="sheet" data-s="new" data-tok="${esc(g.tok)}">手で登録</button></div>`}
      ${S.gres && S.gres.tok === g.tok ? (S.gres.list.length ? S.gres.list.map((x, i) => `<div class="cand" data-a="gadd" data-i="${i}"><div class="grow"><div class="nm">${esc(x.name)} <span class="chip green">Googleマップ</span></div><div class="ad">${esc(shortAddr(x.addr))}</div></div><span class="plus">${IC.plus}</span></div>`).join('') : `<div class="cand"><div class="grow"><div class="ad">Googleマップでも見つかりませんでした</div></div></div>`)
        : `<button class="as-btn" style="font-size:15px;padding:12px;border-top:.5px solid var(--rule)" data-a="gsearch" data-tok="${esc(g.tok)}">「${esc(g.tok)}」をGoogleマップでも探す</button>`}
      ${g.res.length ? `<button class="as-btn" style="font-size:15px;padding:12px;border-top:.5px solid var(--rule)" data-a="sheet" data-s="new" data-tok="${esc(g.tok)}">名前と住所を入れて登録する</button>` : ''}</div>`).join('');
}

/* ---------- 配達 ---------- */
function vGo(){
  const shift = goShift(), t = S.day.trips[shift];
  if (!t.order){
    const n = live(t).length;
    $('#main').innerHTML = title('配達') + `<div class="empty"><b>${n ? 'ルートを作ると、ここに出ます' : 'まだ配達先がありません'}</b>「登録」で今日の薬局を入れて、ルートを作ってね。</div>`;
    setBar(`<button class="btn primary" data-a="tab" data-v="reg">登録へ</button>`); return;
  }
  const e = etas(t), total = t.order.length, tab = S.goTab === 'map' ? 'map' : 'list';
  const rowOf = (i, o) => { const id = t.order[i], p = byId(id) || { name:id, addr:'' };
    return stopRow(Object.assign({ id, num: i + 1, name: p.name, addr: shortAddr(p.addr), side: hm(e.list[i]),
      extra: ((t.stops.find(x => x.id === id) || {}).closedAt ? ` <span class="chip red">${hm(t.stops.find(x => x.id === id).closedAt)} 閉まっていた</span>` : closedToday(p, t.shift) ? ' <span class="chip red">午後休診</span>' : '') + dueChip(t, t.stops.find(x => x.id === id), e.list[i]) + (plainTags(p).length || p.note ? ' <span class="chip amber">メモ</span>' : '') }, o)); };
  const depRow = (label, time, cls) => stopRow({ num: label, cls: 'term ' + cls, name: (S.cfg.depot && S.cfg.depot.name) || '営業所', side: time });
  const pick = (a, b) => `<div class="seg"><button data-a="goTab" data-t="list" class="${tab==='list'?'on':''}">${a}</button><button data-a="goTab" data-t="map" class="${tab==='map'?'on':''}">${b}</button></div>`;

  if (t.status === 'ready'){
    const pf = t.proof, ch = pf && pf.find(x => x.chosen), entry = pf && pf.find(x => x.label === '登録した順');
    const gain = ch && entry && entry !== ch ? Math.round((entry.sec - ch.sec) / 60) : 0;
    $('#main').innerHTML = title(shiftName(shift) + 'のルート', t.manual ? '自分で並べた順' : '') + `
      <div class="sign compact">
        <div class="fig"><small>今出ると、戻るのは</small><b style="font-size:40px">${hm(e.end)}</b></div>
        <div class="fig"><small>件数</small><b>${total}<span>件</span></b></div>
        <div class="fig"><small>道のり</small><b>${t.km ?? '-'}<span>km</span></b></div>
      </div>
      ${dueBar(t, e)}
      ${pf ? `<button class="why" data-a="sheet" data-s="proof">${IC.check}<span class="grow">${(t.dueMoved || []).length ? 'いちばん早い回り方を、時間指定に合わせました' : gain > 0 ? `登録した順より <b>${gain}分</b> 早い回り方です` : '比べた中で、いちばん早い回り方です'}</span><span class="lk">根拠</span>${IC.chev}</button>` : ''}
      ${pick('順番', '地図')}
      ${tab === 'map' ? `<div class="col2"><div id="map" class="tall"></div></div>` : `<div class="col2"><div class="card">
        ${depRow('発', '', 'first')}
        <div data-sort="ready">${t.order.map((_, i) => rowOf(i, { del:{ a:'delReady', label:'外す' }, drag:true, tap:'ready' })).join('')}</div>
        ${depRow('着', hm(e.end), 'last')}
      </div>
      <p class="hint">タップでメモ、長押しして動かすと入れ替え、左にスワイプで外せます。高速・有料道路は使いません。</p></div>`}`;
    setBar(`<button class="btn primary" data-a="start">${IC.nav}<span class="bt"><b>出発する</b><small>1件目 ${esc((byId(t.order[0]) || {}).name || '')}</small></span></button><div class="more"><button class="btn" data-a="sheet" data-s="add">配達先を追加</button>${t.manual ? `<button class="btn" data-a="rebuild">最短に並べ直す</button>` : `<button class="btn" data-a="edit">登録に戻る</button>`}</div>`);
    return;
  }

  /* 配達中 */
  const id = t.order[t.idx];
  const prevId = t.pending && t.idx > 0 && t.order[t.idx - 1] === t.pending ? t.pending : null, prev = prevId && byId(prevId);
  const steps = total <= 40 ? `<div class="steps">${t.order.map((_, i) => `<i class="${i < t.idx ? 'd' : i === t.idx ? 'c' : ''}"></i>`).join('')}</div>` : '';
  const head = title(`${Math.min(t.idx + 1, total)}<span style="font-size:18px;font-weight:600;color:var(--ink2)"> / ${total}件目</span>`, `戻る予定 <b class="n" style="font-size:20px;color:var(--ink)">${hm(e.end)}</b>`) + steps
    + doneList();
  function doneList(){
    if (!t.idx) return '';
    const from = S.showDone ? 0 : Math.max(0, t.idx - 5);
    const rows = [];
    for (let i = from; i < t.idx; i++){
      const did = t.order[i], dp = byId(did) || { name: did }, ds = t.stops.find(x => x.id === did) || {};
      rows.push(`<div class="srow done mini-row ${i === from ? 'first' : ''}"><div class="row-body" data-a="stop" data-id="${did}" data-ctx="cur"><div class="rail"><span class="node">${IC.check}</span></div>
        <div class="txt"><div class="nm">${esc(dp.name)}</div></div>${did === prevId ? `<button class="undo" data-a="undoDone">まだだった</button>` : `<div class="side">${hm(ds.doneAt)} 完了</div>`}</div></div>`);
    }
    return `<div class="label" style="margin-top:0"><span>完了 ${t.idx}件</span>${t.idx > 5 ? `<button class="lkbtn" data-a="toggleDone" aria-expanded="${!!S.showDone}">${S.showDone ? 'たたむ' : 'すべて見る'}<i class="chev ${S.showDone ? 'up' : ''}"></i></button>` : ''}</div><div class="card done-card">${rows.join('')}</div><div class="link-rail"></div>`;
  }

  if (isLand()){ vGoLand(t, e); return; }
  if (!id){
    $('#main').innerHTML = head + `
      <div class="sign"><div class="eyebrow"><span>全部まわりました</span></div><div class="name">営業所へ戻る</div>
        <div class="figs"><div class="fig"><small>ここから</small><b>${mins(e.backSec)}<span>分</span></b></div><div class="fig"><small>着く予定</small><b>${hm(e.end)}</b></div></div></div>${t.navAt ? '' : exitHtml(t)}`;
    setBar(`<button class="btn primary" data-a="navDepot">${IC.nav}<span class="bt"><b>ナビ開始</b><small>営業所へ・約${mins(e.backSec)}分</small></span></button><div class="more"><button class="btn" data-a="finish">便を終える</button><button class="btn" data-a="sheet" data-s="add">配達先を追加</button></div>`);
    return;
  }
  const p = byId(id) || { name:id, addr:'' }, leg = curLeg(t, t.idx), going = !!t.navAt;
  const rest = total - t.idx - 1, show = S.showAll ? rest : Math.min(4, rest);
  $('#main').innerHTML = head + `
    <div class="sign ${going ? 'going' : 'now'}" data-a="stop" data-id="${id}" data-ctx="cur">
      <div class="state"><i class="live"></i>${going ? 'いま向かっています' : 'つぎはここ'}</div>
      <div class="name" style="font-size:${p.name.length > 16 ? 21 : p.name.length > 11 ? 25 : 30}px">${esc(p.name)}</div>
      <div class="addr">${esc(shortAddr(p.addr))}</div>
      <div class="figs"><div class="fig"><small>ここから</small><b>${leg ? mins(leg.sec) : '-'}<span>分</span></b></div><div class="fig"><small>着く予定</small><b>${hm(e.list[t.idx])}</b></div></div>
      <div class="sign-acts">
        <button class="sa ${going ? '' : 'cur'}" data-a="nav">${IC.nav}<span>${going ? 'ナビを開く' : 'ナビ開始'}</span></button>
        <button class="sa ${going ? 'cur' : ''}" data-a="done">${IC.check}<span>配達完了</span></button>
      </div>
    </div>
    ${t.breakAt ? `<div class="memo" style="display:flex;align-items:center;gap:10px"><span class="grow">休憩中（${hm(t.breakAt)}から）</span><button class="mini" data-a="breakEnd">休憩を終える</button></div>` : ''}
    ${closedOffer(p, t.stops.find(x => x.id === id))}
    ${(() => { const st = t.stops.find(x => x.id === id), h = dueHour(t, st); if (!h) return ''; const late = e.list[t.idx] > dueAt(t, st); return `<div class="memo ${late ? 'closed' : 'duememo'}"><b>${h}時までに届ける</b>${late ? '　今のままだと遅れそうです' : ''}</div>`; })()}
    ${memoHtml(p, t.shift)}
    ${going ? '' : exitHtml(t)}
    <div style="height:14px"></div>
    ${pick(rest ? `このあと ${rest}件` : 'このあと', '地図')}
    ${tab === 'map' ? `<div id="map" class="tall run"></div>` : rest ? `
      <div class="card"><div data-sort="run">${Array.from({length: show}, (_, k) => rowOf(t.idx + 1 + k, { cls: k === 0 ? 'first' : '', del:{ a:'delRun', label:'行かない', went:true }, drag:true, tap:'run' })).join('')}</div>
      ${show === rest ? depRow('着', hm(e.end), 'last') : ''}</div>
      ${rest > 4 ? `<button class="btn quiet" data-a="toggleAll">${S.showAll ? '少なく表示' : 'あと' + (rest - 4) + '件も見る'}</button>` : ''}` : '<p class="hint" style="text-align:center;margin-top:16px">これが最後の1件です</p>'}`;
  const nx = byId(t.order[t.idx + 1]), chain = !!S.cfg.chain;
  setBar(going
    ? `${chain && nx && (plainTags(nx).length || nx.note || closedToday(nx, t.shift)) ? `<div class="nextmemo"><b>つぎの所のメモ</b>${esc(nx.name)}：${esc([...(closedToday(nx, t.shift) ? ['今日は午後休診'] : []), ...plainTags(nx), nx.note].filter(Boolean).join('・'))}</div>` : ''}
       <button class="btn go" data-a="${chain ? 'doneNav' : 'done'}">${IC.check}<span class="bt"><b>${chain ? '配達完了・次のナビへ' : '配達完了・次へ'}</b><small>${chain ? 'つぎ：' + esc(nx ? nx.name : '営業所へ戻る') : esc(p.name)}</small></span></button><div class="more"><button class="btn danger" data-a="closedNow">閉まっていた</button><button class="btn" data-a="nav">ナビを開く</button><button class="btn" data-a="sheet" data-s="change">その他</button></div>`
    : `<button class="btn primary" data-a="nav">${IC.nav}<span class="bt"><b>ナビ開始</b><small>${esc(p.name)}へ${leg ? '・約' + mins(leg.sec) + '分' : ''}</small></span></button><div class="more"><button class="btn" data-a="later">1つ後に回す</button><button class="btn" data-a="sheet" data-s="change">その他</button></div>`);
}

/* 配達中・横向き：左に今の配達先とボタン、右に地図1枚（出口のまわり ⇄ 全体） */
function vGoLand(t, e){
  const total = t.order.length, id = t.order[t.idx], p = id ? (byId(id) || { name:id, addr:'' }) : null, st = id ? t.stops.find(x => x.id === id) : null;
  const leg = curLeg(t, t.idx), going = !!t.navAt, rest = Math.max(0, total - t.idx - 1), dep = S.cfg.depot || {};
  const prevId = t.pending && t.idx > 0 && t.order[t.idx - 1] === t.pending ? t.pending : null, prev = prevId && byId(prevId);
  const nx = byId(t.order[t.idx + 1]), chain = !!S.cfg.chain;
  let strip = '';
  if (t.breakAt) strip = `<div class="l-strip"><span class="grow one">休憩中（${hm(t.breakAt)}から）</span><button class="mini" data-a="breakEnd">休憩を終える</button></div>`;
  else if (p){
    const shut = st && st.closedAt, today = closedToday(p, t.shift);
    const bits = [dueHour(t, st) ? dueHour(t, st) + '時まで' : '', shut ? `さっき ${hm(st.closedAt)} は閉まっていた` : '', today ? '今日は午後休診' : '', ...plainTags(p), dwellTag(p) ? `納品 約${dwellTag(p)}分` : '', p.note || ''].filter(Boolean);
    if (bits.length) strip = `<div class="l-strip ${shut || today ? 'red' : ''}" data-a="stop" data-id="${id}" data-ctx="cur"><span class="grow one">${esc(bits.join('・'))}</span>${IC.chev}</div>`;
  }
  const nm = p ? p.name : (dep.name || '営業所') + 'へ戻る';
  const big = !id ? `<button class="btn primary l-big" data-a="navDepot">${IC.nav}ナビ開始</button>`
    : going ? `<button class="btn go l-big" data-a="${chain ? 'doneNav' : 'done'}">${IC.check}<span class="bt"><b>${chain ? '配達完了・次のナビへ' : '配達完了・次へ'}</b>${chain ? `<small>つぎ：${esc(nx ? nx.name : '営業所へ戻る')}</small>` : ''}</span></button>`
    : `<button class="btn primary l-big" data-a="nav">${IC.nav}ナビ開始</button>`;
  const acts = !id ? `<div class="l-acts two"><button class="btn" data-a="finish">便を終える</button><button class="btn" data-a="sheet" data-s="add">配達先を追加</button></div>`
    : going ? `<div class="l-acts"><button class="btn danger" data-a="closedNow">閉まっていた</button><button class="btn" data-a="nav">ナビを開く</button><button class="btn" data-a="sheet" data-s="change">その他</button></div>`
    : `<div class="l-acts"><button class="btn" data-a="done">配達完了</button><button class="btn" data-a="later">1つ後に回す</button><button class="btn" data-a="sheet" data-s="change">その他</button></div>`;
  const x = exitInfo(t);
  $('#main').innerHTML = `<div class="lrun">
    <div class="l-left">
      <div class="l-head"><span><b>${Math.min(t.idx + 1, total)}</b> / ${total}件目</span>${prev ? `<button class="undo" data-a="undoDone">ひとつ前は、まだだった</button>` : ''}<span class="end">戻る予定 <b>${hm(e.end)}</b></span></div>
      <div class="sign l-sign ${going ? 'going' : 'now'}" ${id ? `data-a="stop" data-id="${id}" data-ctx="cur"` : ''}>
        <div class="state"><i class="live"></i>${!id ? '全部まわりました' : going ? 'いま向かっています' : 'つぎはここ'}</div>
        <div class="name" style="font-size:${nm.length > 15 ? 18 : nm.length > 11 ? 21 : 25}px">${esc(nm)}</div>
        <div class="addr">${esc(p ? shortAddr(p.addr) : shortAddr(dep.addr || ''))}</div>
        <div class="l-figs"><span><small>ここから</small><b>${id ? (leg ? mins(leg.sec) : '-') : mins(e.backSec)}<i>分</i></b></span><span><small>着く予定</small><b>${hm(id ? e.list[t.idx] : e.end)}</b></span></div>
      </div>
      ${strip}${big}${acts}
    </div>
    <div class="l-right">
      <div id="lmap"></div>
      ${x ? `<button class="l-dir" data-a="compass"><span id="dial" class="sm" data-deg="${Math.round(x.deg)}"><span class="d-ring"><span>北</span></span><span class="d-arrow"><svg viewBox="0 0 24 24"><path d="M12 2 20 21l-8-4.5L4 21z"/></svg></span></span><span style="min-width:0"><b>${esc(dirTarget(t))}</b><small id="dialSub" data-short="1"></small></span></button>` : ''}
      <div class="l-mapbtn">${rest ? `<button data-a="sheet" data-s="rest">このあと ${rest}件</button>` : ''}<button data-a="lmapMode">${S.lmapMode === 'all' ? '出口のまわり' : '全体を見る'}</button></div>
    </div>
  </div>`;
  document.body.classList.add('fit'); window.scrollTo(0, 0);
  setBar('');
}

/* ---------- 振り返り ---------- */
function revDayObj(){ const prev = LS.get('prevDay', null); return (S.revDay === 'prev' && prev) ? prev : S.day; }
function vRev(){
  const prev = LS.get('prevDay', null);
  const day = revDayObj();
  const hist = day.history || [];
  const trips = [...hist, ...['am','pm'].map(k => day.trips[k]).filter(t => t.startAt)];
  const all = trips.flatMap(t => t.stops.filter(s => s.state === 'done' || s.state === 'drop').sort((a, b) => (a.seq || 999) - (b.seq || 999)).map(s => ({ s, t })));
  $('#main').innerHTML = title('振り返り', S.queue.length ? `<span class="chip amber">未送信 ${S.queue.length}</span>` : '<span class="chip green">保存済み</span>') + `
    ${prev ? `<div class="seg"><button data-a="revDay" data-d="today" class="${day===S.day?'on':''}">今日</button><button data-a="revDay" data-d="prev" class="${day===S.day?'':'on'}">前回 ${esc(dateLabel(prev.date).replace(/（.*/, ''))}</button></div>` : ''}
    ${trips.map(t => `<div class="label"><span>${shiftName(t.shift)}の便　${hm(t.startAt)} 出発</span><span>${t.stops.filter(s => s.state === 'done').length}件 完了</span></div>
      <div class="card"><div class="sum"><div><small>出発時の予測</small><b>${hm(t.predEnd)}</b></div><div><small>実際</small><b>${t.endAt ? hm(t.endAt) : '<span>配達中</span>'}</b></div><div><small>ルート変更</small><b>${t.changes}<span>回</span></b></div></div>
      ${hist.includes(t) ? `<button class="as-btn danger" style="font-size:15px;padding:12px;border-top:.5px solid var(--rule)" data-a="delTrip" data-id="${esc(t.id)}">この便の記録を消す</button>` : ''}</div>`).join('')}
    ${all.length ? `<div class="label"><span>回った所</span><span>タップでメモ・納品時間を登録</span></div>
      <div class="card">${all.map(({ s, t }) => { const p = byId(s.id) || { name:s.id }; const tg = plainTags(p), dw = dwellTag(p), cd = closedDays(p); return `
      <div class="rv">
        <div class="rv-h" data-a="stop" data-ctx="rev" data-id="${s.id}" data-trip="${esc(t.id)}"><div class="grow"><div class="nm">${esc(p.name)}</div>${tg.length || p.note || dw || cd.length ? `<div>${tg.map(x => `<span class="chip amber" style="margin-right:4px">${esc(x)}</span>`).join('')}${dw ? `<span class="chip amber" style="margin-right:4px">納品${dw}分</span>` : ''}${cd.length ? `<span class="chip amber" style="margin-right:4px">午後休診 ${cd.join('・')}</span>` : ''}${p.note ? '<span class="chip">備考あり</span>' : ''}</div>` : ''}</div>
          <div class="side">${s.state === 'drop' ? '行かなかった' : (s.dwell != null ? '滞在 約' + s.dwell + '分' : hm(s.doneAt))}</div>${IC.chev}</div>
      </div>`; }).join('')}</div>
      <p class="hint">メモは、次にその薬局へ行く時に配達の画面に出ます。記録を消しても、メモは残ります。</p>
      ${hist.length ? `<button class="btn quiet danger" data-a="delDay" style="margin-top:8px">この日の記録をすべて消す</button>` : ''}`
    : `<div class="empty"><b>まだ回った所がありません</b>配達が終わると、ここで薬局ごとのメモを書けます。</div>`}`;
  setBar('');
}
/* 記録を消す（テスト用）。スプレッドシート側も消して、訪問回数と平均滞在を計算し直す */
async function eraseRecords(body, doneMsg, localFn){
  busy('記録を消しています…');
  try{
    await api(body);
    localFn(); busy(false); toast(doneMsg); loadMaster(true); render();
  }catch(e){
    busy(false);
    if (S.cfg.test){ localFn(); toast('この端末から消しました（テストモード）'); render(); return; }
    toast(e.server && /unknown action/.test(e.message) ? 'スプレッドシート側の更新がまだです（Apps Scriptを新しくしてね）' : '通信できなかったので、消せませんでした');
  }
}
function dropLocalTrip(day, id){

}

/* 新しい薬局をリストに登録 */
async function newPharmacy(nm, addr, useHere){
  if (!nm){ toast('名前を入れてください'); return; }
  if (!useHere && (!addr || addr === '沖縄県')){ toast('住所を入れるか、「今いる場所で登録」を押してください'); return; }
  let pos = null;
  if (useHere){ busy('現在地を取得中…'); try{ pos = await here(); }catch(e){ busy(false); toast(e.message); return; } }
  S.sheet = null; busy('登録中…');
  try{
    const j = await api(pos ? { a:'add', name:nm, addr: (addr && addr !== '沖縄県') ? addr : '', lat:pos.lat, lng:pos.lng, src:'手入力(現在地)' } : { a:'add', name:nm, addr });
    S.master.push(j.row); saveMaster();
    if (!j.row.lat) toast('住所から場所が分かりませんでした。住所を確かめてね');
    S.q = ''; busy(false); addToTrip(S.day.trips[S.shift], j.row.id);
  }catch(e){ toast(e.message === 'Failed to fetch' ? '通信できませんでした' : e.message); }
  busy(false); render();
}

/* ---------- 並べ替え（長押し）と スワイプ削除 ---------- */
function initSort(){
  sorters.forEach(s => { try{ s.destroy(); }catch(e){} }); sorters = [];
  if (!window.Sortable) return;
  document.querySelectorAll('[data-sort]').forEach(el => {
    if (!el.dataset.sort) return;
    sorters.push(new Sortable(el, {
      draggable: '.srow.can', animation: 160, delay: 260, delayOnTouchOnly: false, touchStartThreshold: 6,
      forceFallback: true, fallbackOnBody: true, fallbackTolerance: 4, filter: '.row-del,.row-went,.flag', preventOnFilter: false,
      onChoose: ev => { sorting = true; held = { id: ev.item.dataset.id, moved: false }; closeSwipes(); },
      onStart: () => { if (held) held.moved = true; },
      onUnchoose: () => { sorting = false; const h = held; held = null; if (h && !h.moved && h.id) ACT.stop({ id: h.id, ctx: el.dataset.sort }); },
      onEnd: ev => { sorting = false; if (ev.oldIndex !== ev.newIndex) reorder(el.dataset.sort, [...el.querySelectorAll('.srow[data-id]')].map(x => x.dataset.id)); }
    }));
  });

function reorder(kind, ids){
  if (kind === 'reg'){
    const t = S.day.trips[S.shift];
    t.stops = [...ids.map(id => t.stops.find(s => s.id === id)).filter(Boolean), ...t.stops.filter(s => !ids.includes(s.id))];
    t.order = null; t.status = 'plan'; save(); render();
  } else if (kind === 'ready'){
    buildRoute(goShift(), ids);
  } else if (kind === 'run'){
    const t = curTrip(), shown = new Set(ids);
    const rest = t.order.slice(t.idx + 1).filter(id => !shown.has(id));
    reroute('並べ替え', { ids: [t.order[t.idx], ...ids, ...rest], fixed:true, manual:true });
  }
}
const DEL_W = 88;
let sw = null, held = null;
function closeSwipes(except){
  document.querySelectorAll('.srow.open').forEach(r => { if (r !== except){ r.classList.remove('open'); r.querySelector('.row-body').style.transform = ''; } });
}
document.addEventListener('pointerdown', e => {
  const body = e.target.closest('.srow.del .row-body');
  const onBtn = e.target.closest('.row-del,.row-went');   // 開いたボタンを押す時は、閉じない（閉じると下の行を押したことになる）
  closeSwipes(onBtn ? onBtn.parentNode : body && body.parentNode);
  if (!body) return;
  const row = body.parentNode;
  sw = { body, row, x: e.clientX, y: e.clientY, w: row.classList.contains('two') ? DEL_W * 2 : DEL_W, base: row.classList.contains('open') ? -(row.classList.contains('two') ? DEL_W * 2 : DEL_W) : 0, on: false, cur: 0, id: e.pointerId, full: !!row.closest('[data-sort="reg"]') };
});
document.addEventListener('pointermove', e => {
  if (!sw || sorting || e.pointerId !== sw.id) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.on){
    if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)){ sw = null; return; }
    if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy) * 1.3) return;
    sw.on = true; sw.body.style.transition = 'none';
    try{ sw.body.setPointerCapture(sw.id); }catch(err){}
  }
  sw.cur = Math.max(sw.full ? -sw.body.offsetWidth : -sw.w - 24, Math.min(0, sw.base + dx));
  sw.body.style.transform = `translateX(${sw.cur}px)`;
});
function endSwipe(e){
  if (!sw || (e && e.pointerId !== sw.id)) return;
  const s = sw; sw = null;
  if (!s.on) return;
  swipedAt = Date.now();
  s.body.style.transition = '';
  if (s.full && s.cur < -s.body.offsetWidth * 0.6){
    s.body.style.transform = 'translateX(-100%)';
    const btn = s.row.querySelector('.row-del');
    setTimeout(() => ACT[btn.dataset.a](btn.dataset, btn), 150);
  } else if (s.cur < (s.base ? -s.w + 30 : -44)){ s.row.classList.add('open'); s.body.style.transform = `translateX(${-s.w}px)`; }
  else { s.row.classList.remove('open'); s.body.style.transform = ''; }
}
document.addEventListener('pointerup', endSwipe);
document.addEventListener('pointercancel', () => { if (sw && sw.on){ sw.body.style.transition = ''; sw.body.style.transform = sw.row.classList.contains('open') ? `translateX(${-sw.w}px)` : ''; } sw = null; });

fetch('yomi.json').then(r => r.json()).then(j => { YOMI = j; LS.set('yomi', j); NORM = new WeakMap(); }).catch(() => {});
if (S.cfg.url && (!S.master.length || Date.now() - LS.get('masterAt', 0) > 6*3600*1000)) loadMaster(true);

applyDefaultDepot();
