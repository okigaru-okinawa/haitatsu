<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="配達ルート">
<meta name="theme-color" content="#1f6fb2">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>配達ルート</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#16181d;--sub:#5d6470;--muted:#9aa1ab;--line:#e2e5ea;
  --accent:#1f6fb2;--accent-bg:#e5f0fa;--on-accent:#fff;--warn:#8a5a00;--warn-bg:#fdf1d8;
  --ok:#1e7a44;--ok-bg:#e3f4ea;--danger:#b42318;--danger-bg:#fde8e6;
  --r:12px;--fs:17px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111317;--card:#1c1f25;--text:#eef0f3;--sub:#a9b0bb;--muted:#6f7682;--line:#2c3038;
  --accent:#5aa2e6;--accent-bg:#17304a;--on-accent:#0b1520;--warn:#f2c46b;--warn-bg:#3a2c0f;
  --ok:#6fd39a;--ok-bg:#12321f;--danger:#ff8a80;--danger-bg:#3d1714;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(150px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--sub);font:inherit;font-size:14px;padding:8px 0;border-radius:8px}
.tabs button.on{background:var(--card);color:var(--text);font-weight:600}
main{padding:12px 14px}
h2{font-size:20px;margin:6px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.sub{color:var(--sub);font-size:14px}.muted{color:var(--muted);font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--sub)}
.seg button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
input,textarea{font:inherit;font-size:18px;width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:70px;font-size:16px}
.btn{display:block;width:100%;font:inherit;font-weight:600;padding:15px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-size:19px;padding:17px}
.btn.small{padding:10px;font-size:15px;font-weight:500}
.btn:active{transform:scale(.98)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.cand{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
.cand:last-child{border-bottom:0}
.cand .nm{font-weight:600}
.cand .ad{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.ok{background:var(--ok-bg);color:var(--ok)}
.group-h{font-size:13px;color:var(--sub);margin:12px 2px 4px}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.num{width:28px;height:28px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none}
.num.done{background:var(--ok-bg);color:var(--ok)}
.x{border:0;background:transparent;color:var(--muted);font-size:22px;padding:4px 8px}
.pin{border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:13px;padding:5px 9px;border-radius:999px}
.pin.on{background:var(--warn-bg);color:var(--warn);border-color:transparent;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:22px}
.big-name{font-size:26px;font-weight:700;margin:4px 0 2px;line-height:1.3}
.turn{background:var(--accent-bg);color:var(--accent);border-radius:14px;padding:14px;text-align:center;margin:12px 0}
.turn .ar{font-size:44px;line-height:1}
.turn .tx{font-size:19px;font-weight:700;margin-top:4px}
.turn .s2{font-size:13px;opacity:.85;margin-top:2px}
.memo{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bar .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.opt{display:block;width:100%;text-align:left;font:inherit;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px}
.opt b{display:block;font-size:17px}.opt span{font-size:13px;color:var(--sub)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{border:1px solid var(--line);background:var(--card);color:var(--sub);font:inherit;font-size:14px;padding:6px 12px;border-radius:999px}
.tag.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(170px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:15px;z-index:30;max-width:90%;text-align:center}
.loading{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:600}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
label.f{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px}
</style>
</head>
<body>
<header>
  <div class="tabs" id="tabs">
    <button data-v="reg">登録</button><button data-v="go">配達</button><button data-v="rev">振り返り</button><button data-v="set">設定</button>
  </div>
</header>
<main id="main"></main>
<div class="bar" id="bar" hidden></div>
<div id="overlay"></div>

<script>
'use strict';
/* =========================================================
   配達ルートアプリ（1ファイル構成）
   データ: localStorage に保存。スプレッドシートとは Apps Script 経由で裏で同期
   ========================================================= */
const DWELL_DEFAULT = 6;            // 1件あたりの標準滞在（分）
const AUTO_DONE_METERS = 250;       // 戻った時にこの距離以内なら自動で完了
const MAX_WP = 25;                  // Routes API の最適化で1回に扱える経由地の上限
const TAG_LIST = ['裏口','右側','左側','駐車しにくい','駐車場あり','昼休みあり','受付に時間がかかる'];

/* ---------- 保存 ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let S = {
  view: 'reg',
  cfg: LS.get('cfg', { url:'', t:'', depot:null }),
  master: LS.get('master', []),
  day: LS.get('day', null),
  queue: LS.get('queue', []),
  shift: 'am',       // 登録画面で選択中の便
  q: '',             // 検索文字
  sheet: null        // 開いているシート（ルート変更など）
};
const todayStr = () => new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});
function newDay(){ return { date: todayStr(), trips: { am: newTrip('am'), pm: newTrip('pm') }, active: null }; }
function newTrip(s){ return { shift:s, stops:[], order:null, legs:null, idx:0, status:'plan', changes:0, startAt:null, endAt:null, predEnd:null, km:null, id:null }; }
if (!S.day || S.day.date !== todayStr()) S.day = newDay();
const save = () => { LS.set('day', S.day); LS.set('cfg', S.cfg); };
const byId = id => S.master.find(p => p.id === id);
const trip = () => S.day.trips[S.day.active || S.shift];

/* ---------- 初回セットアップ（#setup=...） ---------- */
(function(){
  const m = location.hash.match(/setup=([^&]+)/);
  if (!m) return;
  try{
    const o = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    S.cfg.url = o.u; S.cfg.t = o.t; save();
    history.replaceState(null,'',location.pathname);
    setTimeout(()=>toast('設定を読み込みました'),300);
  }catch(e){ setTimeout(()=>toast('設定リンクが読めませんでした'),300); }
})();

/* ---------- 通信（Apps Script） ---------- */
async function api(body){
  if (!S.cfg.url) throw new Error('設定でApps ScriptのURLを入れてください');
  const res = await fetch(S.cfg.url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({...body, t:S.cfg.t}) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || '通信エラー');
  return j;
}
async function loadMaster(silent){
  if (!S.cfg.url) return;
  try{
    const res = await fetch(S.cfg.url + '?a=master&t=' + encodeURIComponent(S.cfg.t));
    const j = await res.json();
    if (!j.ok) throw new Error(j.error);
    S.master = j.master; LS.set('master', S.master); LS.set('masterAt', Date.now());
    if (!silent) toast('薬局リストを更新しました（' + S.master.length + '件）');
    render();
  }catch(e){ if (!silent) toast('薬局リストを取れませんでした: ' + e.message); }
}
/* 記録は裏で送る。失敗したら貯めて次回まとめて */
function enqueue(item){ S.queue.push(item); LS.set('queue', S.queue); flush(); }
let flushing = false;
async function flush(){
  if (flushing || !S.queue.length || !S.cfg.url) return;
  flushing = true;
  try{
    const batch = S.queue.slice(0, 30);
    const logs = batch.filter(x => x.a === 'log');
    if (logs.length) await api({ a:'log', items: logs.map(x => ({sheet:x.sheet, row:x.row})) });
    for (const x of batch.filter(x => x.a !== 'log')) await api(x);
    S.queue = S.queue.slice(batch.length); LS.set('queue', S.queue);
    flushing = false;
    if (S.queue.length) flush();
  }catch(e){ flushing = false; }
}
window.addEventListener('online', flush);

/* ---------- 検索 ---------- */
const kata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const norm = s => kata((s||'').normalize('NFKC')).replace(/[\s・\-ー－（）()]/g,'').toLowerCase();
function searchOne(raw){
  let q = norm(raw).replace(/(薬局|ヤッキョク)$/,'');
  const digits = (raw||'').normalize('NFKC').replace(/\D/g,'');
  if (!q && digits.length < 4) return [];
  const usage = LS.get('usage', {});
  const res = [];
  for (const p of S.master){
    const n = norm(p.name), k = norm(p.kana), a = norm(p.addr);
    let sc = 0;
    if (q){
      if (n.startsWith(q) || k.startsWith(q)) sc = 100;
      else if (n.includes(q) || k.includes(q)) sc = 60;
      else if (q.length >= 2 && a.includes(q)) sc = 20;
    }
    if (digits.length >= 4 && p.tel && p.tel.replace(/\D/g,'').includes(digits)) sc = Math.max(sc, 90);
    if (!sc) continue;
    sc += Math.min(40, (usage[p.id]||0) * 8) + Math.min(10, p.visits||0);
    res.push([sc, p]);
  }
  return res.sort((a,b) => b[0]-a[0]).slice(0, 6).map(x => x[1]);
}
function addStop(id){
  const t = S.day.trips[S.shift];
  if (S.day.trips.am.stops.some(s=>s.id===id) || S.day.trips.pm.stops.some(s=>s.id===id)) { toast('登録済みです'); return; }
  t.stops.push({ id, pin:false, state:'todo' });
  t.order = null;
  const u = LS.get('usage', {}); u[id] = (u[id]||0) + 1; LS.set('usage', u);
  save();
}

/* ---------- 距離・時刻 ---------- */
function meters(a, b){
  const R = 6371000, r = x => x*Math.PI/180;
  const dLat = r(b.lat-a.lat), dLng = r(b.lng-a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const pt = p => (p.plat && p.plng) ? {lat:p.plat, lng:p.plng} : {lat:p.lat, lng:p.lng};
const hm = d => d ? new Date(d).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tokyo'}) : '--:--';
const secs = s => Number(String(s||'0s').replace('s','')) || 0;
function here(){
  return new Promise((ok, ng) => {
    if (!navigator.geolocation) return ng(new Error('位置情報が使えません'));
    navigator.geolocation.getCurrentPosition(p => ok({lat:p.coords.latitude, lng:p.coords.longitude}),
      e => ng(new Error('現在地が取れません（設定で位置情報を許可してください）')), { enableHighAccuracy:true, timeout:10000, maximumAge:20000 });
  });
}

/* ---------- ルート計算 ---------- */
const wp = p => ({ location:{ latLng:{ latitude:p.lat, longitude:p.lng } } });
async function routeCall(origin, list, dest, optimize){
  const body = {
    origin: wp(origin), destination: wp(dest), intermediates: list.map(wp),
    travelMode:'DRIVE', routingPreference:'TRAFFIC_AWARE',
    routeModifiers:{ avoidHighways:true, avoidTolls:true },
    languageCode:'ja-JP', units:'METRIC'
  };
  if (optimize && list.length > 1) body.optimizeWaypointOrder = true;
  const j = await api({ a:'routes', body });
  const r = j.data.routes && j.data.routes[0];
  if (!r) throw new Error('ルートが見つかりませんでした');
  let ord = list.map((_,i)=>i);
  if (optimize && list.length > 1 && r.optimizedIntermediateWaypointIndex) ord = r.optimizedIntermediateWaypointIndex;
  return { ord, legs: r.legs || [] };
}
/* 直線距離で大まかな巡回順（25件を超える時の分割用） */
function roughTour(origin, items){
  const left = items.slice(), out = []; let cur = origin;
  while (left.length){
    let bi = 0, bd = Infinity;
    left.forEach((p,i) => { const d = meters(cur, pt(p)); if (d < bd){ bd = d; bi = i; } });
    cur = pt(left[bi]); out.push(left.splice(bi,1)[0]);
  }
  for (let pass = 0; pass < 3; pass++){
    for (let i = 0; i < out.length-1; i++) for (let k = i+1; k < out.length; k++){
      const a = i ? pt(out[i-1]) : origin, b = pt(out[i]), c = pt(out[k]), d = k+1 < out.length ? pt(out[k+1]) : origin;
      if (meters(a,c) + meters(b,d) < meters(a,b) + meters(c,d) - 1){ out.splice(i, k-i+1, ...out.slice(i,k+1).reverse()); }
    }
  }
  return out;
}
/* origin から stops を回って dest へ。先に行く(pin)ものは順番固定 */
async function planRoute(origin, stops, dest){
  const ps = stops.map(s => ({ s, p: byId(s.id) })).filter(x => x.p && x.p.lat);
  const pinned = ps.filter(x => x.s.pin), free = ps.filter(x => !x.s.pin);
  let seq = [], legs = [];
  let start = origin;
  if (pinned.length){
    const nextAnchor = free.length ? pt(roughTour(pt(pinned[pinned.length-1].p), free.map(x=>x.p))[0]) : dest;
    const r = await routeCall(start, pinned.slice(0,-1).map(x=>pt(x.p)), pt(pinned[pinned.length-1].p), false);
    seq.push(...pinned); legs.push(...r.legs);
    start = pt(pinned[pinned.length-1].p);
  }
  if (free.length){
    if (free.length <= MAX_WP){
      const r = await routeCall(start, free.map(x=>pt(x.p)), dest, true);
      seq.push(...r.ord.map(i => free[i])); legs.push(...r.legs);
    } else {
      const tour = roughTour(start, free.map(x=>x.p));
      const half = Math.ceil(tour.length/2);
      const g1 = tour.slice(0, half), g2 = tour.slice(half);
      const mid = pt(g2[0]);
      const r1 = await routeCall(start, g1.map(pt), mid, true);
      const s1 = r1.ord.map(i => g1[i]);
      const r2 = await routeCall(pt(s1[s1.length-1]), g2.map(pt), dest, true);
      const s2 = r2.ord.map(i => g2[i]);
      // r1 の最後の区間（→g2[0]）は捨て、r2 で g1末尾→g2 を計算し直している
      legs.push(...r1.legs.slice(0, -1), ...r2.legs);
      const find = p => free.find(x => x.p === p);
      seq.push(...s1.map(find), ...s2.map(find));
    }
  } else if (pinned.length){
    const r = await routeCall(start, [], dest, false); legs.push(...r.legs);
  }
  return { order: seq.map(x => x.s.id), legs: legs.map(l => ({ sec: secs(l.duration), m: l.distanceMeters||0, steps: (l.steps||[]).slice(0,4).map(s => s.navigationInstruction || {}) })) };
}
function etas(t, fromTime){
  const out = []; let tm = fromTime || Date.now();
  t.order.forEach((id, i) => {
    if (i < t.idx) { out.push(null); return; }
    const leg = curLeg(t, i);
    tm += (leg ? leg.sec : 600) * 1000;
    out.push(tm);
    const p = byId(id); tm += ((p && p.avg) || DWELL_DEFAULT) * 60000;
  });
  const back = curLeg(t, t.order.length);
  return { list: out, end: tm + (back ? back.sec*1000 : 0) };
}
async function buildRoute(shift){
  const t = S.day.trips[shift];
  if (!t.stops.length) { toast('配達先を登録してください'); return; }
  if (!S.cfg.depot) { toast('設定で営業所の場所を登録してください'); S.view='set'; render(); return; }
  const noPos = t.stops.filter(s => { const p = byId(s.id); return !p || !p.lat; });
  if (noPos.length) toast(noPos.length + '件は位置が無いので外しました');
  busy('最短ルートを計算中…');
  try{
    const r = await planRoute(S.cfg.depot, t.stops.filter(s=>!noPos.includes(s)), S.cfg.depot);
    t.order = r.order; t.legs = r.legs; t.idx = 0; t.status = 'ready';
    t.km = Math.round(r.legs.reduce((a,l)=>a+l.m,0)/100)/10;
    save(); S.view = 'go'; S.day.active = shift; save();
  }catch(e){ toast(e.message); }
  busy(false); render();
}
/* 今いる場所から残りを組み直す */
async function reroute(kind, targetId){
  const t = trip();
  const remain = t.order.slice(t.idx).map(id => t.stops.find(s => s.id === id)).filter(Boolean);
  if (!remain.length) return;
  busy('組み直し中…');
  try{
    const pos = await here().catch(() => null);
    const origin = pos || (t.idx ? pt(byId(t.order[t.idx-1])) : S.cfg.depot);
    remain.forEach(s => s.pin = (s.id === targetId));
    const r = await planRoute(origin, remain, S.cfg.depot);
    remain.forEach(s => s.pin = false);
    t.order = t.order.slice(0, t.idx).concat(r.order);
    t.legs = r.legs; t.legBase = t.idx; t.changes++;
    t.navAt = null;
    logChange(kind, targetId, pos);
    save();
  }catch(e){ toast(e.message); }
  busy(false); render();
}

/* ---------- 配達の進行 ---------- */
function curLeg(t, i){ return t.legs[i - (t.legBase || 0)]; }
function startTrip(){
  const t = trip();
  t.status = 'run'; t.startAt = Date.now(); t.idx = 0; t.legBase = 0;
  t.id = S.day.date + '-' + t.shift;
  t.predEnd = etas(t).end;
  save(); render();
}
function navTo(p){
  const d = pt(p);
  const t = trip(); t.navAt = Date.now(); save();
  location.href = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination=' + d.lat + ',' + d.lng;
}
function complete(auto){
  const t = trip(); const id = t.order[t.idx]; if (!id) return;
  const p = byId(id); const now = Date.now();
  const leg = curLeg(t, t.idx);
  let dwell = null;
  if (t.navAt && leg){ dwell = Math.round((now - (t.navAt + leg.sec*1000)) / 60000); if (dwell < 1 || dwell > 60) dwell = null; }
  const st = t.stops.find(s => s.id === id); st.state = 'done'; st.doneAt = now; st.dwell = dwell; st.seq = t.idx + 1;
  t.idx++; t.navAt = null; save();
  enqueue({ a:'log', sheet:'配達記録', row:[t.id, S.day.date, id, p ? p.name : '', st.plan || '', st.seq, st.eta ? hm(st.eta) : '', hm(now), dwell === null ? '' : dwell, auto ? '完了(自動)' : '完了', st.pin ? '優先' : ''] });
  enqueue({ a:'visit', id, dwell, date:S.day.date });
  if (p){ p.visits = (p.visits||0) + 1; p.last = S.day.date; LS.set('master', S.master); }
  toast((p ? p.name : '') + ' 完了');
  render();
}
function skipLater(){
  const t = trip(); const id = t.order[t.idx];
  if (t.idx >= t.order.length - 1) { toast('最後の1件です'); return; }
  t.order.splice(t.idx, 1); t.order.push(id);
  t.legs = null; save();
  reroute('後回し', null);
}
function dropStop(id){
  const t = trip(); const i = t.order.indexOf(id); if (i < t.idx) return;
  t.order.splice(i, 1);
  const st = t.stops.find(s => s.id === id); st.state = 'drop';
  const p = byId(id);
  enqueue({ a:'log', sheet:'配達記録', row:[t.id, S.day.date, id, p ? p.name : '', st.plan || '', '', '', '', '', '今日は行かない', ''] });
  save(); reroute('今日は行かない', id === undefined ? null : null);
}
function finishTrip(){
  const t = trip(); t.status = 'done'; t.endAt = Date.now();
  enqueue({ a:'log', sheet:'便の記録', row:[t.id, S.day.date, t.shift === 'am' ? '午前' : '午後', hm(t.startAt), hm(t.endAt), t.stops.filter(s=>s.state==='done').length, hm(t.predEnd), hm(t.endAt), t.km || '', t.changes] });
  S.day.active = null; save();
  S.view = 'rev'; render(); toast('おつかれさまでした！');
}
function logChange(kind, id, pos){
  const t = trip();
  enqueue({ a:'log', sheet:'変更の記録', row:[t.id || '', new Date().toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}), kind, id || '', pos ? pos.lat : '', pos ? pos.lng : ''] });
}

}

function vGo(){

  }
  if (!S.day.active) S.day.active = shift;
  const e = etas(t, t.status === 'run' ? Date.now() : null);
  t.order.forEach((id,i) => { const st = t.stops.find(s=>s.id===id); if (st && e.list[i]) { st.eta = e.list[i]; if (!st.plan) st.plan = i+1; } });
  if (t.status === 'ready'){
    $('#main').innerHTML = `
      <h2>${shift==='am'?'午前':'午後'}のルート</h2>
      <div class="stats"><div class="stat"><span class="sub">終わる予定</span><b>${hm(e.end)}</b></div><div class="stat"><span class="sub">件数</span><b>${t.order.length}件</b></div><div class="stat"><span class="sub">距離</span><b>${t.km ?? '-'}km</b></div></div>
      <div class="card list" style="padding:2px 12px">
        <div class="it"><div class="num">発</div><div class="grow">営業所</div><div class="sub">今出たら</div></div>
        ${t.order.map((id,i) => { const p = byId(id); const st = t.stops.find(s=>s.id===id); return `<div class="it"><div class="num">${i+1}</div><div class="grow"><div>${esc(p?p.name:id)} ${st&&st.pin?'<span class="pill warn">先に</span>':''}</div><div class="muted">${esc(p?shortAddr(p.addr):'')}</div></div><div class="sub">${hm(e.list[i])}</div></div>`; }).join('')}
      </div>
      <p class="muted">高速・有料道路は使わない設定。時刻は今の渋滞から予測。</p>`;
    setBar(`<button class="btn primary" id="start">出発する</button><div class="two"><button class="btn small" id="rebuild">作り直す</button><button class="btn small" data-v2="reg">配達先を直す</button></div>`);
    return;
  }
  if (t.status === 'done'){ $('#main').innerHTML = `<div class="empty">この便は終わりました。おつかれさま！</div>`; setBar(''); return; }
  // 走行中
  const id = t.order[t.idx];
  if (!id){
    $('#main').innerHTML = `<div class="sub">全部まわりました</div><div class="big-name">営業所へ戻る</div>`;
    setBar(`<button class="btn primary" id="navDepot">ナビ開始（営業所）</button><div class="two"><button class="btn small" id="finish">便を終える</button><button class="btn small" data-v2="rev">振り返り</button></div>`);
    return;
  }
  const p = byId(id); const leg = curLeg(t, t.idx);
  const tv = turnInfo(leg);
  const tags = (p.tags||'').split(/[,、]/).filter(Boolean);
  const next = t.order.slice(t.idx+1, t.idx+3).map((nid,k) => `${t.idx+2+k} ${esc(byId(nid)?.name||'')}`).join('<br>');
  $('#main').innerHTML = `
    <div class="row sub"><div class="grow">残り${t.order.length - t.idx}件</div><div>終わる予定 <b>${hm(e.end)}</b></div></div>
    <div class="big-name">${esc(p.name)}</div>
    <div class="sub">${esc(shortAddr(p.addr))}${leg ? '　約' + Math.max(1,Math.round(leg.sec/60)) + '分' : ''}</div>
    ${tv ? `<div class="turn"><div class="ar">${tv.ar}</div><div class="tx">${esc(tv.tx)}</div>${tv.s2?`<div class="s2">${esc(tv.s2)}</div>`:''}</div>` : '<div style="height:12px"></div>'}
    ${tags.length ? `<div class="memo">${tags.map(esc).join('　')}</div>` : ''}
    ${p.note ? `<div class="memo">${esc(p.note)}</div>` : ''}
    ${next ? `<div class="group-h">このあと</div><div class="sub">${next}</div>` : ''}
    <p style="text-align:center;margin-top:18px"><button class="pin" id="doneNow">手動で完了にする</button></p>`;
  setBar(`<button class="btn primary" id="nav">ナビ開始</button><div class="two"><button class="btn small" id="later">後回し</button><button class="btn small" id="change">ルート変更</button></div>`);
}
function turnInfo(leg){
  if (!leg || !leg.steps || !leg.steps.length) return null;
  const st = leg.steps;
  const turnIdx = st.findIndex((s,i) => i <= 2 && /LEFT|RIGHT|UTURN|ROUNDABOUT/.test(s.maneuver || ''));
  const s = turnIdx >= 0 ? st[turnIdx] : st[0];
  const m = s.maneuver || '';
  const ar = /UTURN/.test(m) ? '↶' : /LEFT/.test(m) ? '←' : /RIGHT/.test(m) ? '→' : '↑';
  const tx = (/LEFT/.test(m) ? '最初は左へ' : /RIGHT/.test(m) ? '最初は右へ' : 'まっすぐ進む');
  const s2 = (s.instructions || '').split('\n')[0];
  return { ar, tx, s2 };
}

async function newPharmacy(name){
  const nm = prompt('薬局名', name || ''); if (!nm) return;
  const addr = prompt('住所（伝票の住所をそのまま）', '沖縄県'); if (!addr || addr === '沖縄県') return;
  busy('登録中…');
  try{
    const j = await api({ a:'add', name:nm, addr });
    S.master.push(j.row); LS.set('master', S.master);
    if (!j.row.lat) toast('住所から場所が分かりませんでした。住所を確かめてね');

/* ---------- 操作 ---------- */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('button, [data-add], [data-first], [data-drop], [data-addrun], [data-close]');
  if (!el) return;
  const ds = el.dataset;
  if (ds.close && ev.target === el || (ds.close && el.tagName === 'BUTTON')) { S.sheet = null; renderSheet(); return; }
  if (el.closest('#tabs')) { S.view = ds.v; S.sheet = null; render(); window.scrollTo(0,0); return; }
  if (ds.shift) { S.shift = ds.shift; render(); return; }
  if (ds.add) {
    addStop(ds.add);
    const toks = S.q.split(/[、,，。\n]+|\s{2,}/).map(x=>x.trim()).filter(Boolean);
    S.q = toks.length > 1 ? toks.filter(x => x !== ds.tok).join('、') : '';
    render(); if (!S.q) { const q = $('#q'); q && q.focus(); } return;
  }
  if (ds.new !== undefined) { newPharmacy(ds.new); return; }
  if (ds.del) { const t = S.day.trips[S.shift]; t.stops = t.stops.filter(s=>s.id!==ds.del); t.order=null; save(); render(); return; }
  if (ds.pin) { const s = S.day.trips[S.shift].stops.find(s=>s.id===ds.pin); s.pin = !s.pin; S.day.trips[S.shift].order=null; save(); render(); return; }
  if (ds.move) { const from = S.day.trips[ds.move], to = S.day.trips[ds.move==='am'?'pm':'am']; to.stops.push(...from.stops); from.stops = []; from.order = to.order = null; save(); render(); return; }
  if (ds.v2) { S.view = ds.v2; render(); return; }
  if (ds.rr) { S.sheet = null; renderSheet(); reroute('組み直し', null); return; }
  if (ds.sheet) { S.sheet = ds.sheet; renderSheet(); return; }
  if (ds.first) { S.sheet = null; renderSheet(); reroute('先に行く', ds.first); return; }
  if (ds.drop) { S.sheet = null; renderSheet(); dropStop(ds.drop); return; }
  if (ds.addrun) {
    const t = trip(); const id = ds.addrun;
    if (t.order.includes(id)) { toast('すでに入っています'); return; }
    t.stops.push({ id, pin:false, state:'todo', added:true }); t.order.push(id); S.sheet = null; save(); renderSheet();
    reroute('追加', id === null ? null : null); return;
  }
  if (ds.tag) {
    const p = byId(ds.pid); let tags = (p.tags||'').split(/[,、]/).filter(Boolean);
    tags = tags.includes(ds.tag) ? tags.filter(x=>x!==ds.tag) : tags.concat(ds.tag);
    p.tags = tags.join('、'); LS.set('master', S.master); el.classList.toggle('on');
    enqueue({ a:'note', id:p.id, tags:p.tags }); return;
  }
  if (ds.park) {
    try{ const pos = await here(); const p = byId(ds.park); p.plat = pos.lat; p.plng = pos.lng; LS.set('master', S.master); enqueue({ a:'note', id:p.id, plat:pos.lat, plng:pos.lng }); toast('駐車位置を保存しました'); render(); }catch(e){ toast(e.message); }
    return;
  }
  switch (el.id){
    case 'build': buildRoute(S.shift); break;
    case 'rebuild': buildRoute(S.day.active || S.shift); break;
    case 'start': startTrip(); break;
    case 'nav': navTo(byId(trip().order[trip().idx])); break;
    case 'navDepot': trip().navAt = Date.now(); location.href = 'https://www.google.com/maps/dir/?api=1&travelmode=driving&dir_action=navigate&destination=' + S.cfg.depot.lat + ',' + S.cfg.depot.lng; break;
    case 'finish': finishTrip(); break;
    case 'later': skipLater(); break;
    case 'change': S.sheet = 'change'; renderSheet(); break;
    case 'doneNow': complete(false); break;
    case 'setDepot': try{ busy('現在地を取得中…'); S.cfg.depot = await here(); save(); toast('営業所を登録しました'); }catch(e){ toast(e.message); } busy(false); render(); break;
    case 'reload': loadMaster(false); break;
    case 'flushNow': flush().then(()=>render()); toast('送信しています'); break;
    case 'resetDay': if (confirm('今日の配達を全部消しますか？（スプレッドシートの記録は残ります）')) { S.day = newDay(); save(); render(); } break;
    case 'saveCfg':
      S.cfg.url = $('#cUrl').value.trim(); S.cfg.t = $('#cTok').value.trim(); save();
      loadMaster(false); break;
  }
});
/* 備考は入力が止まったら保存 */
let noteTimer = null;
document.addEventListener('input', ev => {
  const id = ev.target.dataset && ev.target.dataset.note; if (!id) return;
  const p = byId(id); if (!p) return; p.note = ev.target.value; LS.set('master', S.master);
  clearTimeout(noteTimer); noteTimer = setTimeout(() => enqueue({ a:'note', id, note:p.note }), 1200);
});

/* ---------- 起動 ---------- */
if (S.day.active && S.day.trips[S.day.active].status === 'run') S.view = 'go';
render();
if (S.cfg.url && (!S.master.length || Date.now() - LS.get('masterAt',0) > 6*3600*1000)) loadMaster(true);
onReturn();
</script>
</body>
